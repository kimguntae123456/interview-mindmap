(function() {
  const STAR_KEY = 'mm-episode-star';
  const defaultStars = {
    ep1: { situation: '대학 시절 등록금 마련을 위해 서브웨이 알바', action: '', result: '', takeaway: '' },
    ep2: { situation: '보증서 날인 누락 사건', action: '', result: '', takeaway: '' },
    ep3: { situation: '필름카메라 취미 도전', action: '', result: '', takeaway: '' },
    ep4: { situation: '유럽여행 중 소매치기 피해', action: '', result: '', takeaway: '' },
    ep5: { situation: '신대홍 홍보대사 활동', action: '', result: '', takeaway: '' },
    ep6: { situation: '구옥 리모델링 경험', action: '', result: '', takeaway: '' },
    ep7: { situation: '매출 0원 부실 의심 건', action: '', result: '', takeaway: '' },
    ep8: { situation: '김중소 UCC 공모전 참가', action: '', result: '', takeaway: '' },
    ep9: { situation: '힙합가사절기 즉석 가사 작사', action: '', result: '', takeaway: '' },
    ep10: { situation: '영어 선생님과의 전환점', action: '', result: '', takeaway: '' },
    ep11: { situation: '서손 인쇄 실수 사건', action: '', result: '', takeaway: '' },
    ep12: { situation: '맛동산업무2배 인턴 불공평 경험', action: '', result: '', takeaway: '' },
    ep13: { situation: '인턴 중 악성민원인 폭언 30분 감내, 즉시 업무 복귀', action: '', result: '', takeaway: '',
      scripts: [
        { id: 'sc_brief', label: '축약형', content: `인턴 당시, **지점에서도 유명한 악성 민원인**의 전화를 당겨받은 경험이 있습니다. **"간첩이냐"** 같은 폭언을 30분 동안 들었지만, 끝나고 **바람을 쐬고 돌아와 바로 다음 업무를 이어갔습니다.** 오래 담아두지 않고 빠르게 털고 다음에 몰입하는 것이 제 강점이라고 생각합니다.` }
      ]
    },
  };
  function ensureShape(entry) {
    if (!entry) entry = {};
    if (typeof entry.situation !== 'string') entry.situation = '';
    if (typeof entry.action !== 'string') entry.action = '';
    if (typeof entry.result !== 'string') entry.result = '';
    if (typeof entry.takeaway !== 'string') entry.takeaway = '';
    if (typeof entry.fullScript !== 'string') entry.fullScript = '';
    if (typeof entry.briefScript !== 'string') entry.briefScript = '';
    if (!Array.isArray(entry.subsections)) entry.subsections = [];
    // migrate to scripts array
    if (!Array.isArray(entry.scripts)) {
      entry.scripts = [];
      if (entry.fullScript) entry.scripts.push({ id: 'sc_full', label: '완전형(대본)', content: entry.fullScript });
      if (entry.briefScript) entry.scripts.push({ id: 'sc_brief', label: '축약형', content: entry.briefScript });
      if (entry.scripts.length === 0) {
        entry.scripts.push({ id: 'sc_full', label: '완전형(대본)', content: '' });
        entry.scripts.push({ id: 'sc_brief', label: '축약형', content: '' });
      }
    }
    return entry;
  }
  function loadStars() {
    try {
      const raw = localStorage.getItem(STAR_KEY);
      const merged = JSON.parse(JSON.stringify(defaultStars));
      Object.keys(merged).forEach(k => { merged[k] = ensureShape(merged[k]); });
      if (!raw) return merged;
      const saved = JSON.parse(raw);
      Object.keys(saved).forEach(k => {
        if (!merged[k]) merged[k] = ensureShape({});
        Object.assign(merged[k], ensureShape(saved[k]));
      });
      return merged;
    } catch(e) {
      const fb = JSON.parse(JSON.stringify(defaultStars));
      Object.keys(fb).forEach(k => { fb[k] = ensureShape(fb[k]); });
      return fb;
    }
  }
  const listeners = new Set();
  function notify() { listeners.forEach(fn => { try { fn(); } catch(e){} }); }
  window.MMStars = {
    get: loadStars,
    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },
    save(stars) { localStorage.setItem(STAR_KEY, JSON.stringify(stars)); notify(); },
    update(epId, field, value) {
      const stars = loadStars();
      if (!stars[epId]) stars[epId] = ensureShape({});
      stars[epId][field] = value;
      this.save(stars);
    },
    setEntry(epId, entry) {
      const stars = loadStars();
      stars[epId] = ensureShape({ ...(stars[epId] || {}), ...entry });
      this.save(stars);
    },
    remove(epId) {
      const stars = loadStars();
      delete stars[epId];
      this.save(stars);
    }
  };
})();
</script>

<script>
// ─── store.js ───
function isBrokenEmoji(s) {
  if (!s) return false;
  for (var i = 0; i < s.length; i++) {
    var c = s.charCodeAt(i);
    if (c >= 0xD800 && c <= 0xDBFF) { if (i+1 >= s.length || s.charCodeAt(i+1) < 0xDC00 || s.charCodeAt(i+1) > 0xDFFF) return true; i++; }
    else if (c >= 0xDC00 && c <= 0xDFFF) return true;
  }
  return false;
}
(function () {
  const STORAGE_KEY = 'mindmap-v6';
  function migrateQuestion(q) {
    const fa = q.fullAnswer || '';
    let scripts = q.scripts;
    if (!Array.isArray(scripts) || scripts.length === 0) {
      scripts = [{ id: 'sc_' + Math.random().toString(36).slice(2, 9), title: '기본 대본', content: fa }];
    }
    return { ...q, answers: [...q.answers], priority: q.priority || 'normal', fullAnswer: fa, scripts };
  }
  const defaultState = {
    questions: window.MM_DATA.questions.map(migrateQuestion),
    episodes: window.MM_DATA.episodes.map(ep => ({ ...ep, emoji: window.MM_DATA.EP_EMOJI[ep.id] || '' })),
    experiences: (window.MM_DATA.experiences || []).map(ex => ({ ...ex, followups: (ex.followups || []).map(f => ({ ...f })) })),
    crossFollowups: [
      { id:'cf1', q:'인턴 경험 중 가장 좋았던 경험은?', a:'' },
      { id:'cf2', q:'세 인턴 경험을 통해 공통적으로 배운 것은?', a:'' },
      { id:'cf3', q:'다양한 경험 중 산업은행 직무에 가장 도움이 될 경험은?', a:'' },
    ],
    customNodes: [],
    customEdges: [],
    positions: {},
    collapsedCats: {},
    view: { zoom: 0.6, panX: 0, panY: 0 },
    activeQ: null,
    deletedQuestions: [],
  };

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return JSON.parse(JSON.stringify(defaultState));
      const saved = JSON.parse(raw);
      const state = JSON.parse(JSON.stringify(defaultState));
      if (Array.isArray(saved.deletedQuestions)) {
        state.deletedQuestions = saved.deletedQuestions.slice();
        const delSet = new Set(saved.deletedQuestions);
        state.questions = state.questions.filter(q => !delSet.has(q.id));
      }
      if (saved.questions) {
        const delSet = new Set(state.deletedQuestions);
        saved.questions.forEach(sq => {
          if (delSet.has(sq.id)) return;
          const m = migrateQuestion(sq);
          const idx = state.questions.findIndex(q => q.id === sq.id);
          if (idx >= 0) state.questions[idx] = m;
          else state.questions.push(m);
        });
      }
      if (saved.episodes) {
        state.episodes = saved.episodes.map(ep => {
          let emoji = ep.emoji || window.MM_DATA.EP_EMOJI[ep.id] || '';
          if (isBrokenEmoji(emoji)) emoji = '';
          return { ...ep, emoji };
        });
      }
      if (Array.isArray(saved.experiences)) {
        state.experiences = saved.experiences.map(ex => ({ ...ex, followups: Array.isArray(ex.followups) ? ex.followups.map(f => ({ ...f })) : [] }));
      }
      if (Array.isArray(saved.crossFollowups)) {
        state.crossFollowups = saved.crossFollowups.map(f => ({ ...f }));
      }
      if (saved.customNodes) state.customNodes = saved.customNodes;
      if (saved.customEdges) state.customEdges = saved.customEdges;
      if (saved.positions) state.positions = saved.positions;
      if (saved.collapsedCats) state.collapsedCats = saved.collapsedCats;
      if (saved.view) state.view = saved.view;
      if (saved.categories) saved.categories.forEach(sc => { if (!MM_DATA.categories.find(c => c.id === sc.id)) MM_DATA.categories.push(sc); });
      return state;
    } catch (e) {
      return JSON.parse(JSON.stringify(defaultState));
    }
  }

  let state = load();
  const listeners = new Set();
  let saveTimer = null;

  // ── Undo/Redo 히스토리 ──
  const MAX_HISTORY = 50;
  let history = [];
  let historyIdx = -1;
  function snapshot() {
    const snap = JSON.stringify(state);
    // 현재 위치 이후의 redo 히스토리 제거
    history = history.slice(0, historyIdx + 1);
    history.push(snap);
    if (history.length > MAX_HISTORY) history.shift();
    historyIdx = history.length - 1;
  }
  snapshot(); // 초기 상태 저장

  function notify() { listeners.forEach(fn => fn(state)); }
  function persist() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { const toSave = Object.assign({}, state, { categories: MM_DATA.categories }); localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave)); window.dispatchEvent(new CustomEvent('mm-saved')); } catch (e) {}
    }, 200);
  }

  window.addEventListener('storage', e => { if (e.key === STORAGE_KEY) { state = load(); notify(); } });

  window.MMStore = {
    get: () => state,
    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },
    update(mutator, skipHistory) {
      mutator(state);
      if (!skipHistory) snapshot();
      notify();
      persist();
    },
    undo() {
      if (historyIdx <= 0) return false;
      historyIdx--;
      state = JSON.parse(history[historyIdx]);
      notify(); persist();
      return true;
    },
    redo() {
      if (historyIdx >= history.length - 1) return false;
      historyIdx++;
      state = JSON.parse(history[historyIdx]);
      notify(); persist();
      return true;
    },
    reset() { localStorage.removeItem(STORAGE_KEY); state = load(); snapshot(); notify(); },
    exportJSON() { return JSON.stringify({ questions: state.questions, episodes: state.episodes, customNodes: state.customNodes, customEdges: state.customEdges, positions: state.positions, categories: MM_DATA.categories }, null, 2); },
    importJSON(text) { try { const d = JSON.parse(text); this.update(s => { if (d.questions) s.questions = d.questions; if (d.episodes) s.episodes = d.episodes; if (d.customNodes) s.customNodes = d.customNodes; if (d.customEdges) s.customEdges = d.customEdges; if (d.positions) s.positions = d.positions; }); if (d.categories) { MM_DATA.categories.length = 0; d.categories.forEach(c => MM_DATA.categories.push(c)); } return true; } catch (e) { return false; } }
  };
})();
</script>

<script>
// ─── layout.js — 라이브 d3-force 시뮬레이션 매니저 ───
window.MMLayout = (function () {
  const ROOT_X = 5000, ROOT_Y = 5000;
  const CAT_RADIUS = 700;
  const N = window.MM_DATA.categories.length;

  // 노드 타입별 반경 (충돌 회피용 — 실제 카드 크기 커버)
  function nodeRadius(type) {
    if (type === 'root') return 100;
    if (type === 'cat') return 90;
    if (type === 'q') return 155;  // 가로 260px 카드 커버
    return 120; // 답변 노드
  }

  // 라이브 시뮬레이션 인스턴스
  let sim = null;
  let simNodes = [];
  let simLinks = [];
  let onTickCb = null;

  function buildGraph(state) {
    const nodes = [];
    const links = [];
    const nodeMap = {};

    // Root — 고정
    const root = { id: 'root', type: 'root', fx: ROOT_X, fy: ROOT_Y };
    nodes.push(root); nodeMap['root'] = root;

    // 카테고리 — 원형 배치, 저장 위치 우선
    MM_DATA.categories.forEach((cat, i) => {
      const savedPos = state.positions[cat.id];
      const angle = (i / N) * Math.PI * 2 - Math.PI / 2;
      const cx = savedPos ? savedPos.x : ROOT_X + Math.cos(angle) * CAT_RADIUS;
      const cy = savedPos ? savedPos.y : ROOT_Y + Math.sin(angle) * CAT_RADIUS;
      const n = { id: cat.id, type: 'cat', fx: cx, fy: cy, _angle: angle };
      nodes.push(n); nodeMap[cat.id] = n;
      links.push({ source: 'root', target: cat.id, depth: 0 });
    });

    // 펼쳐진 카테고리의 질문들
    MM_DATA.categories.forEach((cat) => {
      if (state.collapsedCats[cat.id] !== false) return;
      const qs = state.questions.filter(q => q.cat === cat.id);
      const catNode = nodeMap[cat.id];
      const baseAngle = catNode._angle;
      const arcSpan = Math.min(Math.PI * 0.8, qs.length * 0.13);

      qs.forEach((q, qi) => {
        const frac = qs.length === 1 ? 0 : (qi / (qs.length - 1)) - 0.5;
        const subAngle = baseAngle + frac * arcSpan;
        const dist = 380 + Math.floor(qi / 7) * 300;
        // 사용자 드래그 위치 우선
        const savedPos = state.positions[q.id];
        const initX = savedPos ? savedPos.x : catNode.fx + Math.cos(subAngle) * dist;
        const initY = savedPos ? savedPos.y : catNode.fy + Math.sin(subAngle) * dist;
        const n = { id: q.id, type: 'q', x: initX, y: initY };
        // 저장된 위치가 있으면 고정 (드래그 시에만 해제)
        if (savedPos) { n.fx = initX; n.fy = initY; }
        nodes.push(n); nodeMap[q.id] = n;
        links.push({ source: cat.id, target: q.id, depth: 1 });
      });
    });

    // 답변/커스텀 노드
    (state.customNodes || []).forEach(cn => {
      if (cn.type === 'answer' && cn.parentId) {
        const rootQ = state.questions.find(q => q.id === (cn.rootQId || cn.parentId));
        // 부모 질문의 카테고리가 접혀있으면 스킵
        if (rootQ && state.collapsedCats[rootQ.cat] !== false) return;
      }
      const parent = nodeMap[cn.parentId];
      const savedPos = state.positions[cn.id];
      const initX = savedPos ? savedPos.x : (parent ? parent.x + 200 : ROOT_X + 300);
      const initY = savedPos ? savedPos.y : (parent ? parent.y + 80 : ROOT_Y + 300);
      const n = { id: cn.id, type: cn.type === 'answer' ? 'ans' : 'custom', x: initX, y: initY };
      if (savedPos) { n.fx = initX; n.fy = initY; }
      nodes.push(n); nodeMap[cn.id] = n;
      if (cn.parentId && nodeMap[cn.parentId]) {
        links.push({ source: cn.parentId, target: cn.id, depth: 2 });
      }
    });

    // 사용자 연결
    (state.customEdges || []).forEach(ed => {
      if (nodeMap[ed.from] && nodeMap[ed.to]) {
        links.push({ source: ed.from, target: ed.to, depth: 2 });
      }
    });

    return { nodes, links, nodeMap };
  }

  function start(state, tickCallback) {
    onTickCb = tickCallback;
    const { nodes, links } = buildGraph(state);
    simNodes = nodes;
    simLinks = links;

    if (sim) sim.stop();

    sim = d3.forceSimulation(simNodes)
      .velocityDecay(0.82)  // 높은 마찰 → 빠르게 안정
      .force('link', d3.forceLink(simLinks).id(d => d.id).distance(d => {
        if (d.depth === 0) return CAT_RADIUS;
        if (d.depth === 1) return 200;
        return 160;
      }).strength(d => {
        if (d.depth === 0) return 1;
        if (d.depth === 1) return 0.7;
        return 0.6;
      }))
      .force('charge', d3.forceManyBody().strength(d => {
        if (d.type === 'root' || d.type === 'cat') return 0;
        return -200;
      }))
      .force('collide', d3.forceCollide().radius(d => nodeRadius(d.type)).strength(1).iterations(3))
      .on('tick', () => {
        if (onTickCb) {
          const pos = {};
          simNodes.forEach(n => { pos[n.id] = { x: n.x, y: n.y }; });
          onTickCb(pos);
        }
      });

    // 초기 안정화: 낮은 alpha로 부드럽게 시작, 빠르게 감속
    sim.alpha(0.3).alphaDecay(0.03).alphaMin(0.001);
  }

  function update(state) {
    const { nodes: newNodes, links: newLinks } = buildGraph(state);
    const oldMap = {};
    simNodes.forEach(n => { oldMap[n.id] = n; });

    // 기존 노드는 현재 위치에 완전 고정 — 새 노드만 force가 정렬
    newNodes.forEach(n => {
      const old = oldMap[n.id];
      if (old) {
        const ox = (old.fx != null) ? old.fx : old.x;
        const oy = (old.fy != null) ? old.fy : old.y;
        n.x = ox; n.y = oy;
        n.fx = ox; n.fy = oy;
        n.vx = 0; n.vy = 0;
        n._wasFixed = (old.fx != null);
      } else {
        n._isNew = true;
      }
    });

    simNodes = newNodes;
    simLinks = newLinks;

    if (sim) {
      sim.nodes(simNodes);
      sim.force('link').links(simLinks);
      sim.force('collide').radius(d => nodeRadius(d.type));
      sim.alpha(0.08).restart();

      // 새 노드가 안정된 뒤 — 원래 드래그로 고정된 적 없는 기존 노드의 핀을 풀어주기
      setTimeout(() => {
        simNodes.forEach(n => {
          if (n.type === 'root' || n.type === 'cat') return;
          if (n._isNew) { delete n._isNew; return; }
          if (!n._wasFixed) { n.fx = null; n.fy = null; }
          delete n._wasFixed;
        });
      }, 350);
    }
  }

  // 드래그 시작
  function dragStart(id) {
    const n = simNodes.find(x => x.id === id);
    if (!n || n.type === 'root') return; // root만 드래그 불가
    if (sim) sim.alphaTarget(0.1).restart();
  }

  // 드래그 중 — 하위 노드 함께 이동
  function dragMove(id, x, y) {
    const n = simNodes.find(x2 => x2.id === id);
    if (!n) return;

    const currentX = (n.fx != null) ? n.fx : n.x;
    const currentY = (n.fy != null) ? n.fy : n.y;
    const dx = x - currentX;
    const dy = y - currentY;

    n.fx = x;
    n.fy = y;

    // 드래그 중에도 시뮬레이션 계속 깨우기 (collide 유지)
    if (sim && sim.alpha() < 0.05) sim.alpha(0.15).restart();

    // 재귀: 연결된 하위 노드들을 같은 거리만큼 이동
    const moveChildren = (parentId) => {
      simLinks.filter(l => (l.source.id || l.source) === parentId).forEach(l => {
        const child = typeof l.target === 'object' ? l.target : simNodes.find(nn => nn.id === l.target);
        if (!child || child.type === 'root') return;
        child.x += dx;
        child.y += dy;
        if (child.fx != null) { child.fx += dx; child.fy += dy; }
        moveChildren(child.id);
      });
    };
    moveChildren(n.id);
  }

  // 드래그 끝 — 드래그한 노드는 고정, 나머지는 자유
  function dragEnd(id) {
    const n = simNodes.find(x => x.id === id);
    if (!n) return;
    // 드래그한 노드만 고정 유지
    n.fx = n.x; n.fy = n.y;
    if (sim) { sim.alphaTarget(0); sim.alpha(0.15).restart(); }
  }

  function stop() { if (sim) sim.stop(); }

  function getPositions() {
    const pos = {};
    simNodes.forEach(n => { pos[n.id] = { x: n.x, y: n.y }; });
    return pos;
  }

  return { ROOT_X, ROOT_Y, start, update, stop, dragStart, dragMove, dragEnd, getPositions,
    // 하위 호환용
    compute(state) { return { positions: getPositions() }; },
    nodeSize(id) { return { w: 260, h: 120 }; }
  };
})();
</script>

<script>
// ─── gist-sync.js — GitHub Gist 자동 동기화 ───
window.MMGist = (function () {
  const TOKEN_KEY = 'mm-gist-token';
  const GIST_ID_KEY = 'mm-gist-id';
  const LAST_SYNC_KEY = 'mm-gist-last-sync';
  const FILENAME = 'mindmap-data.json';
  const STORE_KEYS = ['mindmap-v6', 'mm-episode-star', 'mm-node-sizes', 'mm-theme'];

  const listeners = new Set();
  let status = 'offline'; // offline | idle | uploading | downloading | error
  let lastError = null;
  let pendingTimer = null;
  let initialPullDone = false;

  function emit() { listeners.forEach(fn => { try { fn(status, lastError); } catch(e){} }); }
  function setStatus(s, err) { status = s; lastError = err || null; emit(); }

  function getToken() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch(e) { return ''; } }
  function setToken(t) { localStorage.setItem(TOKEN_KEY, (t||'').trim()); }
  function getGistId() { try { return localStorage.getItem(GIST_ID_KEY) || ''; } catch(e) { return ''; } }
  function setGistId(id) { localStorage.setItem(GIST_ID_KEY, id); }
  function clearAll() {
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(GIST_ID_KEY);
    localStorage.removeItem(LAST_SYNC_KEY);
    setStatus('offline');
  }

  function gather() {
    const data = { v: 1, ts: Date.now(), items: {} };
    STORE_KEYS.forEach(k => { const v = localStorage.getItem(k); if (v != null) data.items[k] = v; });
    return data;
  }
  function apply(d) {
    if (!d || !d.items) return false;
    Object.keys(d.items).forEach(k => { try { localStorage.setItem(k, d.items[k]); } catch(e){} });
    return true;
  }

  async function api(path, method, body) {
    const tok = getToken();
    if (!tok) throw new Error('토큰이 없습니다');
    const res = await fetch('https://api.github.com' + path, {
      method,
      headers: {
        Authorization: 'Bearer ' + tok,
        Accept: 'application/vnd.github+json',
        'Content-Type': 'application/json',
        'X-GitHub-Api-Version': '2022-11-28'
      },
      body: body ? JSON.stringify(body) : undefined
    });
    if (!res.ok) {
      let msg = res.status + '';
      try { const j = await res.json(); msg += ' ' + (j.message || ''); } catch(e){}
      throw new Error(msg);
    }
    return res.json();
  }

  async function createGist() {
    const data = gather();
    const r = await api('/gists', 'POST', {
      description: '면접 마인드맵 — 자동 동기화 (do not edit)',
      public: false,
      files: { [FILENAME]: { content: JSON.stringify(data, null, 2) } }
    });
    setGistId(r.id);
    localStorage.setItem(LAST_SYNC_KEY, r.updated_at);
    return r;
  }

  async function pushNow() {
    const tok = getToken(); if (!tok) { setStatus('offline'); return; }
    setStatus('uploading');
    try {
      let id = getGistId();
      if (!id) { await createGist(); setStatus('idle'); return; }
      const data = gather();
      const r = await api('/gists/' + id, 'PATCH', {
        files: { [FILENAME]: { content: JSON.stringify(data, null, 2) } }
      });
      localStorage.setItem(LAST_SYNC_KEY, r.updated_at);
      setStatus('idle');
    } catch (e) { setStatus('error', e.message); throw e; }
  }

  function pushDebounced() {
    if (!getToken()) return;
    clearTimeout(pendingTimer);
    pendingTimer = setTimeout(() => { pushNow().catch(()=>{}); }, 5000);
  }

  async function pullNow(force) {
    const tok = getToken(); if (!tok) { setStatus('offline'); return { applied:false }; }
    const id = getGistId(); if (!id) { setStatus('idle'); return { applied:false, reason:'no-gist' }; }
    setStatus('downloading');
    try {
      const r = await api('/gists/' + id, 'GET');
      const file = r.files && r.files[FILENAME];
      if (!file) { setStatus('idle'); return { applied:false, reason:'no-file' }; }
      const content = file.content || (file.truncated && file.raw_url ? await (await fetch(file.raw_url)).text() : '');
      const data = JSON.parse(content);
      const lastSync = localStorage.getItem(LAST_SYNC_KEY) || '';
      if (force || r.updated_at > lastSync) {
        apply(data);
        localStorage.setItem(LAST_SYNC_KEY, r.updated_at);
        setStatus('idle');
        return { applied:true, ts: r.updated_at };
      }
      setStatus('idle');
      return { applied:false, ts: r.updated_at };
    } catch (e) { setStatus('error', e.message); return { applied:false, error:e.message }; }
  }

  async function init() {
    if (!getToken()) { setStatus('offline'); return; }
    setStatus('idle');
    // hook into save events
    window.addEventListener('mm-saved', pushDebounced);
    if (window.MMStars && MMStars.subscribe) MMStars.subscribe(pushDebounced);
    window.addEventListener('mm-theme-change', pushDebounced);
    // initial pull
    if (!initialPullDone) {
      initialPullDone = true;
      const res = await pullNow();
      if (res && res.applied) {
        window.dispatchEvent(new CustomEvent('mm-gist-pulled'));
      }
    }
  }

  return {
    getStatus: () => status,
    getError: () => lastError,
    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },
    getToken, setToken, getGistId, setGistId, clearAll,
    pushNow, pullNow, init,
    gistUrl() { const id = getGistId(); return id ? 'https://gist.github.com/' + id : ''; }
  };
})();
// 자동 시작 (토큰 있으면) — 여러 진입점에서 모두 트리거
function _mmGistBoot(){ try { MMGist.init(); } catch(e){} }
if (document.readyState === 'complete' || document.readyState === 'interactive') {
  setTimeout(_mmGistBoot, 0);
} else {
  document.addEventListener('DOMContentLoaded', _mmGistBoot, { once: true });
  window.addEventListener('load', _mmGistBoot, { once: true });
}
// bfcache 복귀 시에도 재시도
window.addEventListener('pageshow', (e) => { if (MMGist.getToken() && MMGist.getStatus() === 'offline') _mmGistBoot(); });
// 화면 복귀 시 한 번 풀
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && MMGist.getToken()) {
    if (MMGist.getStatus() === 'offline') _mmGistBoot();
    else MMGist.pullNow().catch(()=>{});
  }
});
</script>

<script type="text/babel">
const uid = (p='n') => p + '_' + Math.random().toString(36).slice(2, 9);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

// S자 곡선 (Cubic Bezier)
function curvePath(x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < 1) return `M${x1},${y1} L${x2},${y2}`;
  const tension = Math.min(dist * 0.4, 200); 
  const angle = Math.atan2(dy, dx);
  const c1x = x1 + Math.cos(angle) * tension;
  const c1y = y1 + Math.sin(angle) * tension;
  const c2x = x2 - Math.cos(angle) * tension;
  const c2y = y2 - Math.sin(angle) * tension;
  return `M${x1},${y1} C${c1x},${c1y} ${c2x},${c2y} ${x2},${y2}`;
}

// 테이퍼드 엣지
function taperedPath(x1, y1, x2, y2, w1, w2) {
  const dx = x2 - x1, dy = y2 - y1;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < 1) return `M${x1},${y1} L${x2},${y2}`; 
  const angle = Math.atan2(dy, dx);
  const perpAngle = angle + Math.PI / 2;
  const tension = Math.min(dist * 0.4, 200);

  const sx1 = x1 + Math.cos(perpAngle) * w1 / 2;
  const sy1 = y1 + Math.sin(perpAngle) * w1 / 2;
  const sx2 = x1 - Math.cos(perpAngle) * w1 / 2;
  const sy2 = y1 - Math.sin(perpAngle) * w1 / 2;

  const ex1 = x2 + Math.cos(perpAngle) * w2 / 2;
  const ey1 = y2 + Math.sin(perpAngle) * w2 / 2;
  const ex2 = x2 - Math.cos(perpAngle) * w2 / 2;
  const ey2 = y2 - Math.sin(perpAngle) * w2 / 2;

  const c1ax = sx1 + Math.cos(angle) * tension, c1ay = sy1 + Math.sin(angle) * tension;
  const c2ax = ex1 - Math.cos(angle) * tension, c2ay = ey1 - Math.sin(angle) * tension;
  const c1bx = ex2 - Math.cos(angle) * tension, c1by = ey2 - Math.sin(angle) * tension;
  const c2bx = sx2 + Math.cos(angle) * tension, c2by = sy2 + Math.sin(angle) * tension;

  return `M${sx1},${sy1} C${c1ax},${c1ay} ${c2ax},${c2ay} ${ex1},${ey1} L${ex2},${ey2} C${c1bx},${c1by} ${c2bx},${c2by} ${sx2},${sy2} Z`;
}

// 앵커 포인트
function anchorPoint(cx, cy, tx, ty, halfW, halfH) {
  const dx = tx - cx, dy = ty - cy;
  if (dx === 0 && dy === 0) return { x: cx, y: cy };
  const absDx = Math.abs(dx), absDy = Math.abs(dy);
  let scale;
  if (absDx / halfW > absDy / halfH) {
    scale = halfW / absDx;
  } else {
    scale = halfH / absDy;
  }
  return { x: cx + dx * scale, y: cy + dy * scale };
}

function Minimap({ state, positions, view, withPanel, onJump }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const cv = ref.current; if (!cv) return;
    const ctx = cv.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const W = cv.width = 220 * dpr, H = cv.height = 140 * dpr;
    cv.style.width = '220px'; cv.style.height = '140px';
    ctx.scale(dpr, dpr);
    const VW = 220, VH = 140;
    ctx.clearRect(0, 0, VW, VH);
    const ids = Object.keys(positions);
    if (!ids.length) return;
    let minX=1e9, minY=1e9, maxX=-1e9, maxY=-1e9;
    ids.forEach(id => { const p = positions[id]; if (!p) return; minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y); });
    const pad = 240; minX -= pad; minY -= pad; maxX += pad; maxY += pad;
    const sx = VW / (maxX - minX), sy = VH / (maxY - minY);
    const s = Math.min(sx, sy);
    const ox = (VW - (maxX - minX) * s) / 2;
    const oy = (VH - (maxY - minY) * s) / 2;
    state.questions.forEach(q => {
      if (state.collapsedCats[q.cat] !== false) return;
      const p = positions[q.id]; if (!p) return;
      const cat = MM_DATA.categories.find(c => c.id === q.cat);
      ctx.fillStyle = cat ? cat.color : '#999';
      ctx.globalAlpha = 0.65;
      ctx.beginPath();
      ctx.arc((p.x - minX) * s + ox, (p.y - minY) * s + oy, 1.8, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    MM_DATA.categories.forEach(c => {
      const p = positions[c.id]; if (!p) return;
      ctx.fillStyle = c.color;
      ctx.beginPath();
      ctx.arc((p.x - minX) * s + ox, (p.y - minY) * s + oy, 4, 0, Math.PI*2);
      ctx.fill();
    });
    const root = positions['root'];
    if (root) {
      ctx.fillStyle = '#1d1d1f';
      ctx.beginPath();
      ctx.arc((root.x - minX) * s + ox, (root.y - minY) * s + oy, 5, 0, Math.PI*2);
      ctx.fill();
    }
    const vp = ref.current.parentElement.querySelector('.vp');
    const wr = document.querySelector('.canvas-wrap');
    if (vp && wr) {
      const r = wr.getBoundingClientRect();
      const vx = -view.panX / view.zoom;
      const vy = -view.panY / view.zoom;
      const vw = r.width / view.zoom;
      const vh = r.height / view.zoom;
      vp.style.left = ((vx - minX) * s + ox) + 'px';
      vp.style.top = ((vy - minY) * s + oy) + 'px';
      vp.style.width = (vw * s) + 'px';
      vp.style.height = (vh * s) + 'px';
    }
    cv._mapInfo = { minX, minY, s, ox, oy };
  }, [state, positions, view]);

  const handleClick = (e) => {
    const cv = ref.current; if (!cv || !cv._mapInfo) return;
    const r = cv.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const { minX, minY, s, ox, oy } = cv._mapInfo;
    onJump((mx - ox) / s + minX, (my - oy) / s + minY);
  };

  return (
    <div className={"minimap" + (withPanel ? ' with-panel' : '')}>
      <canvas ref={ref} onClick={handleClick}></canvas>
      <div className="vp"></div>
      <div className="label">Overview</div>
    </div>
  );
}

function DetailPanel({ q, onClose }) {
  if (!q) return null;
  const cat = MM_DATA.categories.find(c => c.id === q.cat);
  const update = (mut) => MMStore.update(s => {
    const qq = s.questions.find(x => x.id === q.id); if (qq) mut(qq);
  });

  return (
    <div className="detail-panel">
      <div className="dp-head">
        <span className="dp-cat-pill" style={{background: cat.color + '18', color: cat.color}}>
          <span className="dot" style={{background: cat.color}}></span>{cat.name}
        </span>
        <span className="dp-id">{q.id.toUpperCase()}</span>
        <button className="dp-close" onClick={onClose}>×</button>
      </div>
      <div className="dp-q" contentEditable suppressContentEditableWarning
           onBlur={e=>update(qq=>qq.q=e.currentTarget.textContent)}>{q.q}</div>
      <div className="dp-body">
        <div className="dp-section">
          <div className="dp-label">중요도</div>
          <div className="dp-priority">
            {['low','normal','high'].map(p => (
              <button key={p} className={"prio-btn " + p + (q.priority === p ? ' active' : '')}
                      onClick={()=>update(qq=>qq.priority=p)}>
                {p === 'low' ? '낮음' : p === 'normal' ? '보통' : '핵심'}
              </button>
            ))}
          </div>
        </div>
        <div className="dp-section">
          <div className="dp-label">핵심 키워드</div>
          <input className="dp-keyword-input" value={q.kw || ''}
                 placeholder="짧은 키워드 (예: 실행력/꾸준함)"
                 onChange={e=>update(qq=>qq.kw=e.target.value)} />
        </div>
        <div className="dp-section">
          <div className="dp-label">핵심 답변 (요약)</div>
          {q.answers.map((a, i) => (
            <div className="ans-block" key={i}>
              <div className="ans-num">답변 {i+1}</div>
              <button className="ans-del" onClick={()=>update(qq=>qq.answers.splice(i,1))}>×</button>
              <MentionTextarea value={a}
                        placeholder="짧고 명료하게... (@로 에피소드 멘션)"
                        onChange={e=>update(qq=>qq.answers[i]=e.target.value)}
                        rows={2} style={{minHeight:'auto'}} />
            </div>
          ))}
          <button className="add-ans-btn" onClick={()=>update(qq=>qq.answers.push(''))}>+ 답변 추가</button>
        </div>
        <div className="dp-section">
          <div className="dp-label">전체 답변 (실전 스크립트)</div>
          {(q.scripts || []).map((sc, si) => (
            <div className="ans-block" key={sc.id || si}>
              <div className="ans-num" style={{display:'flex', gap:6, alignItems:'center'}}>
                <input value={sc.title || ''} placeholder={'버전 ' + (si+1)}
                       onChange={e=>update(qq=>{ qq.scripts[si].title = e.target.value; })}
                       style={{flex:1, border:'none', background:'transparent', fontSize:11, fontWeight:700, color:'var(--text2)', outline:'none', textTransform:'uppercase', letterSpacing:'0.06em'}} />
                <span style={{fontSize:10, color:'var(--text4)'}}>{(sc.content||'').length}자</span>
              </div>
              {q.scripts.length > 1 && (
                <button className="ans-del" title="삭제" onClick={()=>update(qq=>{ qq.scripts.splice(si,1); if (si===0 && qq.scripts[0]) qq.fullAnswer = qq.scripts[0].content; })}>×</button>
              )}
              <MentionTextarea value={sc.content || ''}
                        placeholder="실제 면접에서 말할 풀버전 답변... (@로 에피소드 멘션)"
                        onChange={e=>update(qq=>{
                          qq.scripts[si].content = e.target.value;
                          if (si === 0) qq.fullAnswer = e.target.value;
                        })}
                        rows={6} />
            </div>
          ))}
          <button className="add-ans-btn" onClick={()=>update(qq=>{
            qq.scripts = qq.scripts || [];
            qq.scripts.push({ id: 'sc_'+Date.now().toString(36), title: '버전 ' + (qq.scripts.length+1), content: '' });
          })}>+ 다른 버전 대본 추가</button>
        </div>
        <div className="dp-section">
          <div className="dp-label">예상 꼬리질문</div>
          <MentionTextarea value={q.tail || ''}
                    placeholder="예상되는 후속 질문... (@로 에피소드 멘션)"
                    onChange={e=>update(qq=>qq.tail=e.target.value)}
                    rows={2} style={{minHeight:'auto'}} />
        </div>
      </div>
    </div>
  );
}

function MindmapView() {
  const [state, setState] = React.useState(() => {
    const s = MMStore.get();
    if (Object.keys(s.collapsedCats || {}).length === 0) {
      MMStore.update(st => {
        MM_DATA.categories.forEach(c => { st.collapsedCats[c.id] = true; });
      });
    }
    return MMStore.get();
  });
  const [view, setView] = React.useState(state.view || { zoom: 0.7, panX: 0, panY: 0 });
  const [activeQId, setActiveQId] = React.useState(null);
  const [connectFrom, setConnectFrom] = React.useState(null);
  const [ctxMenu, setCtxMenu] = React.useState(null);
  const [search, setSearch] = React.useState('');
  const [toast, setToast] = React.useState('');
  const [modal, setModal] = React.useState(null);
  const [addMenu, setAddMenu] = React.useState(null); 
  const [dragVersion, setDragVersion] = React.useState(0);
  const positionsRef = React.useRef({});
  const wrapRef = React.useRef(null);
  const dragRef = React.useRef(null);
  const panRef = React.useRef(null);
  const justDraggedRef = React.useRef(false);
  const resizeRef = React.useRef(null); 
  const [nodeSizes, setNodeSizes] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('mm-node-sizes') || '{}'); } catch(e) { return {}; }
  });

  React.useEffect(() => MMStore.subscribe(s => {
    setState(JSON.parse(JSON.stringify(s)));
  }), []);

  React.useEffect(() => {
    MMLayout.start(MMStore.get(), (pos) => {
      positionsRef.current = pos;
      setDragVersion(v => v + 1);
    });
    return () => MMLayout.stop();
  }, []);

  React.useEffect(() => {
    MMLayout.update(state);
  }, [JSON.stringify(state.collapsedCats), state.questions.length, state.customNodes.length, state.customEdges.length]);

  const positions = positionsRef.current;
  const catColor = (id) => (state.catColors||{})[id] || MM_DATA.categories.find(c => c.id === id)?.color || '#999';
  const qColor = (q) => (q && q.color) || catColor(q ? q.cat : null);
  const [colorPicker, setColorPicker] = React.useState(null); // {x,y,target:{type,id}}
  const activeQ = activeQId ? state.questions.find(q => q.id === activeQId) : null;

  const applyView = React.useCallback((v) => {
    setView(v);
    MMStore.update(s => { s.view = v; }, true);
  }, []);

  React.useEffect(() => {
    const wr = wrapRef.current; if (!wr) return;
    if (state.view && (state.view.panX || state.view.panY)) return;
    const r = wr.getBoundingClientRect();
    const z = 0.7;
    setView({ zoom: z, panX: r.width/2 - MMLayout.ROOT_X * z, panY: r.height/2 - MMLayout.ROOT_Y * z });
  }, []);

  React.useEffect(() => {
    const wr = wrapRef.current; if (!wr) return;
    const onWheel = (e) => {
      e.preventDefault();
      const r = wr.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      const oz = view.zoom;
      const nz = clamp(oz + (e.deltaY > 0 ? -0.06 : 0.06), 0.2, 2.5);
      applyView({ zoom: nz, panX: mx - (mx - view.panX) * (nz/oz), panY: my - (my - view.panY) * (nz/oz) });
    };
    wr.addEventListener('wheel', onWheel, { passive: false });
    return () => wr.removeEventListener('wheel', onWheel);
  }, [view, applyView]);

  // 활성 포인터 추적 (멀티터치/핀치)
  const pointersRef = React.useRef(new Map());
  const pinchRef = React.useRef(null);
  const longPressRef = React.useRef(null);

  const onCanvasMouseDown = (e) => {
    if (connectFrom) return;
    if (e.target.closest('.node')) return;
    if (e.button !== undefined && e.button !== 0) return;
    pointersRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointersRef.current.size === 2) {
      // 핀치 시작
      const pts = Array.from(pointersRef.current.values());
      const dx = pts[0].x - pts[1].x, dy = pts[0].y - pts[1].y;
      const dist = Math.hypot(dx, dy) || 1;
      const cx = (pts[0].x + pts[1].x) / 2;
      const cy = (pts[0].y + pts[1].y) / 2;
      pinchRef.current = { dist, zoom: view.zoom, panX: view.panX, panY: view.panY, cx, cy };
      panRef.current = null;
      return;
    }
    panRef.current = { sx: e.clientX - view.panX, sy: e.clientY - view.panY };
    wrapRef.current.classList.add('grabbing');
  };

  React.useEffect(() => {
    const onMove = (e) => {
      if (pointersRef.current.has(e.pointerId)) {
        pointersRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
      }
      // 핀치 줌 처리
      if (pinchRef.current && pointersRef.current.size >= 2) {
        const pts = Array.from(pointersRef.current.values()).slice(0, 2);
        const dx = pts[0].x - pts[1].x, dy = pts[0].y - pts[1].y;
        const dist = Math.hypot(dx, dy) || 1;
        const ratio = dist / pinchRef.current.dist;
        const nz = clamp(pinchRef.current.zoom * ratio, 0.2, 2.5);
        const r = wrapRef.current.getBoundingClientRect();
        const mx = pinchRef.current.cx - r.left;
        const my = pinchRef.current.cy - r.top;
        const oz = pinchRef.current.zoom;
        applyView({
          zoom: nz,
          panX: mx - (mx - pinchRef.current.panX) * (nz / oz),
          panY: my - (my - pinchRef.current.panY) * (nz / oz),
        });
        return;
      }
      if (resizeRef.current) {
        const r = resizeRef.current;
        const dx = (e.clientX - r.startX) / view.zoom;
        const dy = (e.clientY - r.startY) / view.zoom;
        const delta = Math.max(dx, dy);
        const newScale = Math.max(0.5, Math.min(3.5, r.startScale + delta / 200));
        setNodeSizes(prev => {
          const next = {...prev, [r.id]: newScale};
          localStorage.setItem('mm-node-sizes', JSON.stringify(next));
          return next;
        });
        return;
      }
      if (panRef.current) {
        applyView({ ...view, panX: e.clientX - panRef.current.sx, panY: e.clientY - panRef.current.sy });
      }
      if (dragRef.current) {
        const d = dragRef.current;
        const dxScreen = e.clientX - d.startX;
        const dyScreen = e.clientY - d.startY;
        if (!d.moved && Math.hypot(dxScreen, dyScreen) < 5) return;
        if (!d.moved) {
          d.moved = true;
          if (longPressRef.current) { clearTimeout(longPressRef.current.timer); longPressRef.current = null; }
          document.querySelector(`[data-node-id="${d.id}"]`)?.classList.add('dragging');
          MMLayout.dragStart(d.id);
        }
        const wx = (e.clientX - view.panX) / view.zoom;
        const wy = (e.clientY - view.panY) / view.zoom;
        const nx = wx - d.ox, ny = wy - d.oy;
        MMLayout.dragMove(d.id, nx, ny);
        positionsRef.current[d.id] = { x: nx, y: ny };
        setDragVersion(v => v + 1);
      }
    };
    const onUp = (e) => {
      if (e && e.pointerId !== undefined) pointersRef.current.delete(e.pointerId);
      if (pointersRef.current.size < 2) pinchRef.current = null;
      if (longPressRef.current) { clearTimeout(longPressRef.current.timer); longPressRef.current = null; }
      if (resizeRef.current) { resizeRef.current = null; return; }
      if (panRef.current) wrapRef.current?.classList.remove('grabbing');
      panRef.current = null;
      if (dragRef.current) {
        const d = dragRef.current;
        if (d.moved) {
          document.querySelector(`[data-node-id="${d.id}"]`)?.classList.remove('dragging');
          const p = positionsRef.current[d.id];
          if (p) MMStore.update(s => { s.positions[d.id] = { x: p.x, y: p.y }; });
          MMLayout.dragEnd(d.id, true);
          justDraggedRef.current = true;
          setTimeout(() => { justDraggedRef.current = false; }, 200);
        }
        dragRef.current = null;
      }
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    return () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
    };
  }, [view]);

  const startDrag = (id, e) => {
    if (connectFrom) return;
    if (e.button !== undefined && e.button !== 0) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.stopPropagation();
    pointersRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const wx = (e.clientX - view.panX) / view.zoom;
    const wy = (e.clientY - view.panY) / view.zoom;
    const p = positionsRef.current[id] || { x: wx, y: wy };
    dragRef.current = { id, ox: wx - p.x, oy: wy - p.y, startX: e.clientX, startY: e.clientY, moved: false };
    // 롱프레스 = 우클릭 컨텍스트 메뉴
    const node = e.target.closest('[data-node-id]');
    if (node && e.pointerType !== 'mouse') {
      const cx = e.clientX, cy = e.clientY;
      const timer = setTimeout(() => {
        if (dragRef.current && !dragRef.current.moved) {
          // 노드 타입 식별
          const item = state.questions.find(q => q.id === id);
          const cat = MM_DATA.categories.find(c => c.id === id);
          const cn = state.customNodes.find(c => c.id === id);
          let target = null;
          if (item) target = { type:'q', id };
          else if (cat) target = { type:'cat', id };
          else if (cn) target = { type:'custom', id };
          if (target) setCtxMenu({ x: cx, y: cy, target });
          dragRef.current = null;
        }
        longPressRef.current = null;
      }, 500);
      longPressRef.current = { timer };
    }
  };

  const startConnect = (fromId) => { setConnectFrom(fromId); showT('연결할 다른 노드를 클릭하세요'); };
  const completeConnect = (toId) => {
    if (connectFrom && connectFrom !== toId) {
      MMStore.update(s => { s.customEdges.push({ id: uid('e'), from: connectFrom, to: toId, color: '#0071e3' }); });
      showT('연결됨');
    }
    setConnectFrom(null);
  };

  React.useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'Escape') { setConnectFrom(null); setActiveQId(null); setCtxMenu(null); }
      if (e.key === 'f' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); document.getElementById('search')?.focus(); }
      if (e.key === '0' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); fitAll(); }
      if (e.key === 'z' && (e.ctrlKey || e.metaKey) && !e.shiftKey) { e.preventDefault(); if(MMStore.undo()) showT('실행 취소'); }
      if ((e.key === 'z' && (e.ctrlKey || e.metaKey) && e.shiftKey) || (e.key === 'y' && (e.ctrlKey || e.metaKey))) { e.preventDefault(); if(MMStore.redo()) showT('다시 실행'); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const showT = (m) => { setToast(m); setTimeout(()=>setToast(''), 2200); };
  const zoomBy = (d) => {
    const wr = wrapRef.current; const r = wr.getBoundingClientRect();
    const cx = r.width/2, cy = r.height/2; const oz = view.zoom; const nz = clamp(oz + d, 0.2, 2.5);
    applyView({ zoom: nz, panX: cx - (cx - view.panX)*(nz/oz), panY: cy - (cy - view.panY)*(nz/oz) });
  };
  const fitAll = () => {
    const wr = wrapRef.current; const r = wr.getBoundingClientRect();
    const z = 0.7;
    applyView({ zoom: z, panX: r.width/2 - MMLayout.ROOT_X * z, panY: r.height/2 - MMLayout.ROOT_Y * z });
  };
  const focusNode = (id) => {
    const p = positionsRef.current[id]; if (!p) return;
    const wr = wrapRef.current; const r = wr.getBoundingClientRect();
    const z = Math.max(view.zoom, 0.85);
    applyView({ zoom: z, panX: r.width/2 - p.x * z, panY: r.height/2 - p.y * z });
  };
  const jumpTo = (wx, wy) => {
    const wr = wrapRef.current; const r = wr.getBoundingClientRect();
    applyView({ ...view, panX: r.width/2 - wx * view.zoom, panY: r.height/2 - wy * view.zoom });
  };

  const handleNodeClick = (id, type) => {
    if (justDraggedRef.current) return;
    if (connectFrom) return completeConnect(id);
    if (type === 'cat') {
      MMStore.update(s => { s.collapsedCats[id] = s.collapsedCats[id] === false ? true : false; });
    } else if (type === 'q') {
      setActiveQId(activeQId === id ? null : id);
      if (activeQId !== id) setTimeout(() => focusNode(id), 30);
    }
  };

  const openCtx = (e, target) => { e.preventDefault(); e.stopPropagation(); setCtxMenu({ x: e.clientX, y: e.clientY, target }); };

  React.useEffect(() => {
    if (!search.trim()) return;
    const t = search.toLowerCase();
    const f = state.questions.find(q =>
      q.q.toLowerCase().includes(t) || (q.kw && q.kw.toLowerCase().includes(t)) ||
      q.answers.some(a => a && a.toLowerCase().includes(t)) ||
      ((q.scripts || []).some(sc => sc.content && sc.content.toLowerCase().includes(t))) ||
      (q.fullAnswer && q.fullAnswer.toLowerCase().includes(t))
    );
    if (f) {
      MMStore.update(s => { s.collapsedCats[f.cat] = false; });
      setActiveQId(f.id);
      setTimeout(() => focusNode(f.id), 100);
    }
  }, [search]);

  React.useEffect(() => {
    const h = window.location.hash;
    const m = h.match(/focus=([^&]+)/);
    if (m && m[1]) {
      const q = state.questions.find(qq => qq.id === m[1]);
      if (q) {
        MMStore.update(s => { s.collapsedCats[q.cat] = false; });
        setTimeout(() => { setActiveQId(q.id); focusNode(q.id); }, 200);
      }
    }
  }, []);

  const edges = [];
  MM_DATA.categories.forEach(cat => {
    const p1 = positions['root'], p2 = positions[cat.id];
    if (!p1 || !p2) return;
    const expanded = state.collapsedCats[cat.id] === false;
    const a1 = anchorPoint(p1.x, p1.y, p2.x, p2.y, 125, 32);
    const a2 = anchorPoint(p2.x, p2.y, p1.x, p1.y, 110, 25);
    edges.push({ id:'r_'+cat.id, x1:a1.x, y1:a1.y, x2:a2.x, y2:a2.y,
                 color:catColor(cat.id), op:expanded?0.5:0.2, depth:0, tapered:true, w1:expanded?6:3, w2:expanded?2:1 });
  });
  state.questions.forEach(q => {
    if (state.collapsedCats[q.cat] !== false) return;
    const p1 = positions[q.cat], p2 = positions[q.id];
    if (!p1 || !p2) return;
    const isActive = activeQId === q.id;
    const a1 = anchorPoint(p1.x, p1.y, p2.x, p2.y, 110, 25);
    const a2 = anchorPoint(p2.x, p2.y, p1.x, p1.y, 130, 60);
    edges.push({ id:'c_'+q.id, x1:a1.x,y1:a1.y,x2:a2.x,y2:a2.y,
                 color:qColor(q), op:isActive?0.6:0.3, depth:1, tapered:true, w1:isActive?4:2.5, w2:isActive?1.5:0.8 });
  });
  state.customEdges.forEach(ed => {
    const p1 = positions[ed.from], p2 = positions[ed.to];
    if (!p1 || !p2) return;
    edges.push({ id: ed.id, x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,
                 color: ed.color || '#0071e3', op:0.85, depth:2, tapered:false, w:2.4, type:'user' });
  });
  (state.customNodes || []).filter(n => n.type === 'answer' && n.parentId).forEach(n => {
    const p1 = positions[n.parentId], p2 = positions[n.id];
    if (!p1 || !p2) return;
    edges.push({ id:'ans_'+n.id, x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,
                 color: n.color || '#86868b', op:0.5, depth:2, tapered:true, w1:2, w2:0.5 });
  });

  const tabSwitch = (tab) => { window.location.hash = '#' + tab; };

  return (
    <>
      <div className="topbar">
        <div className="brand">면접 마인드맵</div>
        <div className="tabs">
          <button className="tab active">마인드맵</button>
          <button className="tab" onClick={()=>tabSwitch('table')}>리스트 뷰</button>
          <button className="tab" onClick={()=>tabSwitch('episode')}>에피소드 관리</button>
          <button className="tab" onClick={()=>tabSwitch('experience')}>경험 관리</button>
        </div>
        <input id="search" className="search" placeholder="질문, 키워드, 답변 검색..."
               value={search} onChange={e=>setSearch(e.target.value)} />
        <div className="tb-spacer"></div>
        <SyncIndicator />
        <ThemeToggle />
        <button className="btn ghost" onClick={()=>{
          MMStore.update(s=>{MM_DATA.categories.forEach(c=>{s.collapsedCats[c.id]=true;});});
          setActiveQId(null); fitAll();
        }}>모두 접기</button>
        <button className="btn ghost" onClick={()=>{
          MMStore.update(s=>{MM_DATA.categories.forEach(c=>{s.collapsedCats[c.id]=false;});});
        }}>모두 펼치기</button>
        <button className="btn primary" onClick={()=>setModal({type:'addQuestion'})}>+ 질문</button>
        <button className="btn ghost" title="백업" onClick={()=>{
          const blob = new Blob([MMStore.exportJSON()], {type:'application/json'});
          const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'mindmap.json'; a.click();
        }}>내보내기</button>
        <input type="file" id="impFile" accept=".json" style={{display:'none'}} onChange={e=>{
          const f = e.target.files[0]; if (!f) return;
          const r = new FileReader();
          r.onload = ev => { MMStore.importJSON(ev.target.result) ? showT('복원 완료') : showT('파일 오류'); };
          r.readAsText(f);
        }} />
        <button className="btn ghost" title="복원" onClick={()=>document.getElementById('impFile').click()}>가져오기</button>
      </div>

      <div className="legend">
        <h4>단축키</h4>
        <div className="row"><span className="kbd">드래그</span> 이동</div>
        <div className="row"><span className="kbd">휠</span> 확대/축소</div>
        <div className="row"><span className="kbd">⌘F</span> 검색</div>
        <div className="row"><span className="kbd">ESC</span> 닫기</div>
        <div className="row"><span className="kbd">⌘Z</span> 실행 취소</div>
        <div className="row"><span className="kbd">⇧⌘Z</span> 다시 실행</div>
      </div>

      <div ref={wrapRef} className={"canvas-wrap" + (connectFrom ? ' connect-mode' : '')}
           onPointerDown={onCanvasMouseDown} onClick={()=>{setCtxMenu(null);setAddMenu(null);}}>
        <div className="grid-bg"></div>
        <div className="canvas" style={{ transform: `translate(${view.panX}px, ${view.panY}px) scale(${view.zoom})` }}>
          <svg className="edges" width="12000" height="12000">
            {edges.map(e => (
              <g key={e.id}>
                {e.tapered ? (
                  <path d={taperedPath(e.x1, e.y1, e.x2, e.y2, e.w1, e.w2)}
                        fill={e.color} opacity={e.op} />
                ) : (
                  <path d={curvePath(e.x1, e.y1, e.x2, e.y2)}
                        stroke={e.color} strokeWidth={e.w || 2} opacity={e.op}
                        fill="none" strokeLinecap="round" />
                )}
                {e.type === 'user' && (
                  <path className="edge hit" d={curvePath(e.x1, e.y1, e.x2, e.y2)} fill="none"
                        onClick={(ev)=>{ev.stopPropagation();if(confirm('연결 삭제?'))MMStore.update(s=>{s.customEdges=s.customEdges.filter(x=>x.id!==e.id);});}} />
                )}
              </g>
            ))}
          </svg>

          {positions.root && (
            <div className="node node-root" data-node-id="root"
                 style={{left:positions.root.x+'px',top:positions.root.y+'px'}}
                 onPointerDown={e=>startDrag('root', e)}
                 onClick={e=>e.stopPropagation()}>
              면접 마인드맵
            </div>
          )}

          {MM_DATA.categories.map((cat, i) => {
            const p = positions[cat.id]; if (!p) return null;
            const expanded = state.collapsedCats[cat.id] === false;
            const cnt = state.questions.filter(q=>q.cat===cat.id).length;
            const filled = state.questions.filter(q=>q.cat===cat.id && (q.answers.length>0||q.tail||q.fullAnswer||(q.scripts||[]).some(s=>s.content&&s.content.trim()))).length;
            return (
              <div key={cat.id} className={"node node-cat " + (expanded?'expanded':'collapsed')}
                   data-node-id={cat.id}
                   style={{
                     left: p.x + 'px', top: p.y + 'px',
                     transform: `translate(-50%,-50%) scale(${nodeSizes[cat.id] || 1.3})`,
                     '--cat-color': catColor(cat.id),
                     background: expanded ? catColor(cat.id) : 'var(--surface)',
                     borderColor: catColor(cat.id),

          <div className="ctx-item" onClick={()=>{

            <div className="ctx-item" onClick={()=>{setActiveQId(ctxMenu.target.id);focusNode(ctxMenu.target.id);setCtxMenu(null);}}>자세히</div>

          </>)}
          {ctxMenu.target.type==='cat'&&(
            <div className="ctx-item" onClick={()=>{MMStore.update(s=>{s.collapsedCats[ctxMenu.target.id]=s.collapsedCats[ctxMenu.target.id]===false?true:false;});setCtxMenu(null);}}>접기/펼치기</div>
          )}

          <div className="ctx-item" onClick={()=>{MMStore.update(s=>{delete s.positions[ctxMenu.target.id];});setCtxMenu(null);}}>위치 초기화</div>
        </div>
      )}

      {colorPicker && (
        <ColorPickerPopover x={colorPicker.x} y={colorPicker.y} current={colorPicker.current}
          onPick={(c) => {
            const t = colorPicker.target;
            MMStore.update(s => {
              if (t.type === 'cat') {
                s.catColors = s.catColors || {};
                if (c == null) delete s.catColors[t.id]; else s.catColors[t.id] = c;
              } else if (t.type === 'q') {
                const q = s.questions.find(x => x.id === t.id);
                if (q) { if (c == null) delete q.color; else q.color = c; }
              } else if (t.type === 'custom') {
                const cn = s.customNodes.find(x => x.id === t.id);
                if (cn) { if (c == null) delete cn.color; else cn.color = c; }

            });
          }}
          onClose={() => setColorPicker(null)} />
      )}

      <DetailPanel q={activeQ} onClose={()=>setActiveQId(null)} />

      {addMenu && !addMenu.selectedType && (
        <div className="ctx-menu" style={{left:addMenu.x, top:addMenu.y}} onClick={e=>e.stopPropagation()}>
          {[
            {type:'answer', label:'답변', icon:'\u{1F4AC}'},
            {type:'tail', label:'꼬리질문', icon:'\u{1F517}'},
            {type:'why', label:'왜 그렇게 생각?', icon:'\u{1F914}'},
            {type:'opinion', label:'추가 의견', icon:'\u{1F4A1}'},

        <AddNodeModal addMenu={addMenu} onClose={()=>setAddMenu(null)} />

      {modal && <Modal modal={modal} onClose={()=>setModal(null)} showT={showT} />}
    </>
  );
}

// ─── AddNodeModal ───
function AddNodeModal({ addMenu, onClose }) {
  const [text, setText] = React.useState('');
  const textareaRef = React.useRef(null);
  React.useEffect(() => { if (textareaRef.current) textareaRef.current.focus(); }, []);
  const submit = () => {
    if (!text.trim()) { onClose(); return; }
    MMStore.update(s => {
      s.customNodes.push({ id:uid('ans'), type:'answer', nodeType:addMenu.selectedType, parentId:addMenu.parentId, rootQId:addMenu.rootQId, label:text.trim(), color:addMenu.color });
    });
    onClose();
  };
  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h3>{addMenu.selectedLabel} 추가</h3>
        <label>내용</label>
        <textarea ref={textareaRef} value={text} onChange={e=>setText(e.target.value)}
                  placeholder={addMenu.selectedLabel + '을 입력하세요...'}
                  onKeyDown={e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey))submit();}} />
        <div className="modal-actions">
          <button className="btn ghost" onClick={onClose}>취소</button>
          <button className="btn primary" onClick={submit}>추가</button>
        </div>
      </div>
    </div>
  );
}

// ─── Episode helpers (store + seed 머지) ───
function getEpisodes() {
  const fromStore = (window.MMStore && MMStore.get().episodes) || [];
  if (fromStore.length > 0) return fromStore;
  return window.MM_DATA.episodes;
}
function getEpEmoji(epId) {
  try {
    const ep = getEpisodes().find(e => e.id === epId);
    const raw = (ep && ep.emoji) || MM_DATA.EP_EMOJI[epId] || '';
    return isBrokenEmoji(raw) ? '' : raw;
  } catch(e) { return ''; }
}
function findEpByTag(tag) { return getEpisodes().find(ep => ep.tag === tag); }
function findEpById(epId) { return getEpisodes().find(ep => ep.id === epId); }

// ─── EpTooltip ───
function EpTooltipPopup({ epId, pos }) {
  const ep = findEpById(epId);
  if (!ep) return null;

      )}

// ─── EpBadge ───
function EpBadge({ tag }) {
  const ep = findEpByTag(tag);
  const [tooltip, setTooltip] = React.useState(null);
  if (!ep) return <span className="ep-badge">[@{tag}]</span>;
  const emoji = getEpEmoji(ep.id);
  const handleMouseEnter = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    setTooltip({ x: rect.left + rect.width/2 - 160, y: rect.top - 8 });
  };
  const handleMouseLeave = () => setTooltip(null);
  return (
    <>
      <span className="ep-badge" onMouseEnter={handleMouseEnter} onMouseLeave={handleMouseLeave}>
        {emoji} {tag}
      </span>
      {tooltip && ReactDOM.createPortal(
        <EpTooltipPopup epId={ep.id} pos={{x: Math.max(8, tooltip.x), y: tooltip.y - 120}} />,
        document.body
      )}
    </>
  );
}

// ─── renderTextWithBadges ───
function renderTextWithBadges(text) {
  if (!text) return null;
  const parts = [];
  const regex = /\[@([^\]]+)\]/g;
  let lastIdx = 0;
  let match;
  while ((match = regex.exec(text)) !== null) {
    if (match.index > lastIdx) parts.push(text.slice(lastIdx, match.index));
    parts.push(<EpBadge key={match.index} tag={match[1]} />);
    lastIdx = match.index + match[0].length;
  }
  if (lastIdx < text.length) parts.push(text.slice(lastIdx));
  if (parts.length === 0) return text;
  return <>{parts}</>;
}

// ─── MentionDropdown ───
function MentionDropdown({ targetRef, onSelect, onClose, filter }) {
  const [activeIdx, setActiveIdx] = React.useState(0);
  const episodes = getEpisodes();
  const filtered = React.useMemo(() => {
    try {
      if (!filter) return episodes.filter(Boolean);
      const f = (filter || '').toLowerCase();
      return episodes.filter(Boolean).filter(function(ep) {
        var tag = (ep.tag || '').toLowerCase();
        var desc = (ep.desc || '').toLowerCase();
        return tag.includes(f) || desc.includes(f);
      });
    } catch(e) { console.error('MentionDropdown filter error:', e); return []; }
  }, [filter, episodes]);

  React.useEffect(() => { setActiveIdx(0); }, [filter]);

  React.useEffect(() => {
    var onKey = function(e) {
      if (e.isComposing || e.keyCode === 229) return;
      if (e.key === 'ArrowDown') { e.preventDefault(); setActiveIdx(function(i) { return Math.min(i+1, filtered.length-1); }); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); setActiveIdx(function(i) { return Math.max(i-1, 0); }); }
      else if (e.key === 'Enter') { e.preventDefault(); if (filtered[activeIdx]) onSelect(filtered[activeIdx]); }
      else if (e.key === 'Escape') { e.preventDefault(); onClose(); }
    };
    window.addEventListener('keydown', onKey, true);
    return function() { window.removeEventListener('keydown', onKey, true); };
  }, [activeIdx, filtered]);

  const pos = React.useMemo(() => {
    if (!targetRef || !targetRef.current) return { left: 100, top: 100 };
    const rect = targetRef.current.getBoundingClientRect();
    return { left: rect.left, top: rect.bottom + 4 };
  }, []);

  if (filtered.length === 0) return null;

  try {
    return ReactDOM.createPortal(
      <div className="mention-dropdown" style={{ left: pos.left, top: pos.top }}>
        {filtered.map((ep, i) => {
          if (!ep || !ep.id) return null;
          return (
            <div key={ep.id} className={"mention-item" + (i === activeIdx ? ' active' : '')}
                 onClick={() => onSelect(ep)}
                 onMouseEnter={() => setActiveIdx(i)}>
              <span className="ep-emoji">{getEpEmoji(ep.id) || '📌'}</span>
              <span className="ep-tag">{ep.tag || ''}</span>
              <span className="ep-desc">— {ep.desc || ''}</span>
            </div>
          );
        })}
      </div>,
      document.body
    );
  } catch(e) { console.error('MentionDropdown render error:', e); return null; }
}

// ─── Excerpt Store ───
window.ExcerptStore = (function() {
  var KEY = 'mm-excerpts';
  var listeners = new Set();
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch(e) { return []; } }
  function save(arr) { localStorage.setItem(KEY, JSON.stringify(arr)); listeners.forEach(function(fn){ try{fn();}catch(e){} }); }
  return {
    get: load,
    add: function(text, source) {
      var arr = load();
      arr.unshift({ id: 'ex_'+Date.now().toString(36), text: text, source: source || '', time: Date.now() });
      save(arr);
    },
    remove: function(id) { save(load().filter(function(x){ return x.id !== id; })); },
    clear: function() { save([]); },
    subscribe: function(fn) { listeners.add(fn); return function() { listeners.delete(fn); }; }
  };
})();

// ─── SelectionPopover — 텍스트 선택 시 Bold/Highlight/발췌 팝오버 ───
function SelectionPopover() {
  var ref = React.useRef(null);
  var state = React.useState(null);
  var popover = state[0];
  var setPopover = state[1];

  React.useEffect(function() {
    var hideTimer = null;

    function onMouseUp(e) {
      clearTimeout(hideTimer);
      hideTimer = setTimeout(function() {
        var sel = window.getSelection();
        var text = sel ? sel.toString() : '';
        if (!text || text.length < 1) { setPopover(null); return; }
        var active = document.activeElement;
        if (!active || (active.tagName !== 'TEXTAREA' && !active.isContentEditable)) { setPopover(null); return; }
        var range = null;
        try { range = sel.getRangeAt(0); } catch(e) { setPopover(null); return; }
        var rect = range.getBoundingClientRect();
        if (!rect || (rect.width === 0 && rect.height === 0)) {
          // textarea fallback
          var taRect = active.getBoundingClientRect();
          rect = { left: e.clientX, top: taRect.top, width: 0, height: 0 };
        }
        setPopover({ x: rect.left + rect.width / 2, y: rect.top - 8, target: active, text: text });
      }, 150);
    }

    function onMouseDown() {
      clearTimeout(hideTimer);
      setPopover(null);
    }

    document.addEventListener('mouseup', onMouseUp);
    document.addEventListener('mousedown', onMouseDown);
    return function() {
      document.removeEventListener('mouseup', onMouseUp);
      document.removeEventListener('mousedown', onMouseDown);
      clearTimeout(hideTimer);
    };
  }, []);

  function wrapSelection(prefix, suffix) {
    if (!popover || !popover.target) return;
    var ta = popover.target;
    if (ta.tagName === 'TEXTAREA') {
      var start = ta.selectionStart;
      var end = ta.selectionEnd;
      var val = ta.value;
      var selected = val.slice(start, end);
      // toggle: 이미 감싸져 있으면 제거
      var before = val.slice(0, start);
      var after = val.slice(end);
      if (before.endsWith(prefix) && after.startsWith(suffix)) {
        var newVal = before.slice(0, -prefix.length) + selected + after.slice(suffix.length);
        var nativeInputValueSetter = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, 'value').set;
        nativeInputValueSetter.call(ta, newVal);
        ta.dispatchEvent(new Event('input', { bubbles: true }));
        ta.setSelectionRange(start - prefix.length, end - prefix.length);
      } else {
        var newVal2 = before + prefix + selected + suffix + after;
        var nativeInputValueSetter2 = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, 'value').set;
        nativeInputValueSetter2.call(ta, newVal2);
        ta.dispatchEvent(new Event('input', { bubbles: true }));
        ta.setSelectionRange(start + prefix.length, end + prefix.length);
      }
      ta.focus();
    }
    setPopover(null);
  }

  function doExcerpt() {
    if (!popover) return;
    var source = '';
    var ta = popover.target;
    // 질문 카드에서 발췌한 경우 질문 텍스트 찾기
    if (ta) {
      var card = ta.closest('.q-card') || ta.closest('.ep-card');
      if (card) {
        var qEl = card.querySelector('.qc-question') || card.querySelector('.ep-tag-input');
        if (qEl) source = qEl.textContent || qEl.value || '';
      }
    }
    ExcerptStore.add(popover.text, source.slice(0, 80));
    setPopover(null);
  }

  function doAddFollowup() {
    if (!popover || !popover.target) return;
    var card = popover.target.closest && popover.target.closest('.exp-card[data-exp-id]');
    var exId = card ? card.getAttribute('data-exp-id') : null;
    if (!exId) { alert('경험 카드(자소서/인턴/활동) 안의 텍스트를 선택해주세요.'); setPopover(null); return; }
    var text = (popover.text || '').trim();
    if (!text) { setPopover(null); return; }
    if (window.MMStore) {
      window.MMStore.update(function(s) {
        var ex = (s.experiences||[]).find(function(e){return e.id===exId;});
        if (!ex) return;
        ex.followups = ex.followups || [];
        ex.followups.push({ id: 'fu_'+Date.now().toString(36), q: text, a: '' });
      });

// ─── formatRendered: **bold** 및 ==highlight== 렌더링 ───
var _fmtRe = /(\*\*([\s\S]+?)\*\*)|(==([\s\S]+?)==)|(\[@(.+?)\])/g;
function hasFormatting(text) {
  if (!text) return false;
  _fmtRe.lastIndex = 0;
  return _fmtRe.test(text);
}
function formatRendered(text) {
  if (!text) return '';
  var parts = [];
  _fmtRe.lastIndex = 0;
  var last = 0;
  var m;
  while ((m = _fmtRe.exec(text)) !== null) {
    if (m.index > last) parts.push(text.slice(last, m.index));
    if (m[1]) {
      parts.push(React.createElement('span', { className: 'fmt-bold', key: 'b'+m.index }, m[2]));
    } else if (m[3]) {
      parts.push(React.createElement('span', { className: 'fmt-highlight', key: 'h'+m.index }, m[4]));
    } else if (m[5]) {
      var _mTag = m[6];
      var _mTip = '';
      try {
        var _mEps = MMStars.get();
        var _mEp = _mEps.find(function(ep){ return ep.tag === _mTag; });
        if (_mEp && _mEp.scripts && _mEp.scripts.length > 0) {
          _mTip = _mEp.scripts.map(function(sc){ return (sc.label||'대본') + ':\n' + (sc.content||'(비어있음)'); }).join('\n\n');
        } else if (_mEp && _mEp.situation) {
          _mTip = _mEp.situation;
        }
      } catch(e){}
      var _mProps = { className: 'fmt-mention', key: 'm'+m.index };
      if (_mTip) _mProps['data-tip'] = _mTip;
      parts.push(React.createElement('span', _mProps, _mTag));
    }
    last = _fmtRe.lastIndex;
  }
  if (last < text.length) parts.push(text.slice(last));
  return parts.length > 0 ? parts : text;
}

// ─── wrapTextarea helper ───
function wrapTextarea(ta, prefix, suffix, onChange) {
  if (!ta) return;
  var start = ta.selectionStart;
  var end = ta.selectionEnd;
  if (start === end) return; // 선택 없으면 무시
  var val = ta.value;
  var selected = val.slice(start, end);
  var before = val.slice(0, start);
  var after = val.slice(end);
  var newVal;
  if (before.endsWith(prefix) && after.startsWith(suffix)) {
    newVal = before.slice(0, -prefix.length) + selected + after.slice(suffix.length);
    var setter = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, 'value').set;
    setter.call(ta, newVal);
    ta.dispatchEvent(new Event('input', { bubbles: true }));
    ta.setSelectionRange(start - prefix.length, end - prefix.length);
  } else {
    newVal = before + prefix + selected + suffix + after;
    var setter2 = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, 'value').set;
    setter2.call(ta, newVal);
    ta.dispatchEvent(new Event('input', { bubbles: true }));
    ta.setSelectionRange(start + prefix.length, end + prefix.length);
  }
  if (onChange) onChange({ target: { value: ta.value } });
}

// ─── MentionTextarea ───
function MentionTextarea({ value, onChange, placeholder, rows, style, className, autoResize }) {
  const [mentionState, setMentionState] = React.useState(null);
  const [editing, setEditing] = React.useState(false);
  const ref = React.useRef(null);

  // auto-resize
  React.useEffect(function() {
    if (!autoResize || !ref.current) return;
    var ta = ref.current;
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
  }, [value, autoResize]);

  var showPreview = !editing && hasFormatting(value);

  var handleFocus = function() { setEditing(true); };

  const handleChange = (e) => {
    const newVal = e.target.value;
    onChange(e);
    const cursorPos = e.target.selectionStart;
    const textBefore = newVal.slice(0, cursorPos);
    const atIdx = textBefore.lastIndexOf('@');
    if (atIdx >= 0 && (atIdx === 0 || /\s/.test(textBefore[atIdx-1]))) {
      const filterText = textBefore.slice(atIdx + 1);
      if (!/\s/.test(filterText) || filterText.length === 0) {
        setMentionState({ startPos: atIdx, filter: filterText });
        return;
      }
    }
    setMentionState(null);
  };

  const handleKeyDown = (e) => {
    if (e.isComposing || e.keyCode === 229) return;
    // Cmd+B: bold, Cmd+H: highlight
    if ((e.metaKey || e.ctrlKey) && (e.key === 'b' || e.key === 'B')) {
      e.preventDefault();
      wrapTextarea(ref.current, '**', '**', onChange);
      return;
    }
    if ((e.metaKey || e.ctrlKey) && (e.key === 'h' || e.key === 'H')) {
      e.preventDefault();
      wrapTextarea(ref.current, '==', '==', onChange);
      return;
    }
    if (mentionState && (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Enter')) {
      return;
    }
    if (e.key === 'Escape' && mentionState) {
      setMentionState(null);
    }
  };

  const handleSelect = (ep) => {
    if (!mentionState || !ref.current) return;
    const ta = ref.current;
    const before = value.slice(0, mentionState.startPos);
    const after = value.slice(ta.selectionStart);
    const insertText = '[@' + ep.tag + ']';
    const newValue = before + insertText + after;
    const syntheticEvent = { target: { value: newValue } };
    onChange(syntheticEvent);
    setMentionState(null);
    setTimeout(() => {
      const newPos = before.length + insertText.length;
      ta.setSelectionRange(newPos, newPos);
      ta.focus();
    }, 0);
  };

  const handleBlur = (e) => {
    setTimeout(function() { setMentionState(null); setEditing(false); }, 200);
  };

  if (showPreview) {
    return React.createElement('div', {
      className: (className || 'dp-textarea') + ' fmt-preview',
      style: Object.assign({}, style || {}, { minHeight: rows ? (rows * 20 + 12) : undefined }),
      'data-placeholder': placeholder || '',
      onClick: function() {
        setEditing(true);
        setTimeout(function() { if (ref.current) ref.current.focus(); }, 0);
      },
      tabIndex: 0,
      onFocus: function() {
        setEditing(true);
        setTimeout(function() { if (ref.current) ref.current.focus(); }, 0);
      }
    }, formatRendered(value));
  }

  return (
    <>
      <textarea ref={ref} className={className || "dp-textarea"} value={value || ''}
                placeholder={placeholder} rows={rows} style={style}
                onChange={handleChange} onKeyDown={handleKeyDown} onBlur={handleBlur} onFocus={handleFocus} />
      {mentionState && (
        <MentionDropdown targetRef={ref} filter={mentionState.filter}
                         onSelect={handleSelect} onClose={()=>setMentionState(null)} />
      )}
    </>
  );
}

function Modal({ modal, onClose, showT }) {
  const [form, setForm] = React.useState({ cat:'c1', q:'', kw:'', label:'', color:'#0071e3' });
  const submit = () => {
    if (modal.type === 'addQuestion') {
      if (!form.q.trim()) return;
      MMStore.update(s => {
        s.questions.push({ id:'q_'+Date.now(), cat:form.cat, q:form.q, kw:form.kw, answers:[], tail:'', fullAnswer:'', scripts:[{ id:'sc_'+Date.now().toString(36), title:'기본 대본', content:'' }], priority:'normal' });
        s.collapsedCats[form.cat] = false;
      });
      showT('질문 추가됨'); onClose();
    } else if (modal.type === 'addNode') {
      if (!form.label.trim()) return;
      MMStore.update(s => { s.customNodes.push({ id:uid('cn'), label:form.label, color:form.color, x:MMLayout.ROOT_X+200, y:MMLayout.ROOT_Y+200 }); });
      showT('노드 추가됨'); onClose();
    } else if (modal.type === 'addAnswerNode') {
      if (!form.label.trim()) return;
      MMStore.update(s => {
        s.customNodes.push({ id:uid('ans'), type:'answer', nodeType:modal.nodeType, parentId:modal.parentId, rootQId:modal.rootQId, label:form.label.trim(), color:modal.color });
      });
      showT('추가됨'); onClose();
    }
  };
  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        {modal.type==='addQuestion'&&(<>
          <h3>새 질문 추가</h3>
          <label>카테고리</label>
          <select value={form.cat} onChange={e=>setForm({...form,cat:e.target.value})}>
            {MM_DATA.categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
          </select>
          <label>질문</label>
          <input value={form.q} onChange={e=>setForm({...form,q:e.target.value})} autoFocus
                 onKeyDown={e=>{if(e.key==='Enter')submit();}} />
          <label>키워드 (선택)</label>
          <input value={form.kw} onChange={e=>setForm({...form,kw:e.target.value})}
                 onKeyDown={e=>{if(e.key==='Enter')submit();}} />
        </>)}
        {modal.type==='addNode'&&(<>
          <h3>새 노드 추가</h3>
          <label>라벨</label>
          <input value={form.label} onChange={e=>setForm({...form,label:e.target.value})} autoFocus />
          <label>색상</label>
          <input type="color" value={form.color} onChange={e=>setForm({...form,color:e.target.value})} />

          <button className="btn primary" onClick={submit}>추가</button>
        </div>
      </div>
    </div>
  );
}

function SyncSettingsModal({ onClose }) {
  const [token, setToken] = React.useState(MMGist.getToken());
  const [gistId, setGistId] = React.useState(MMGist.getGistId());
  const [busy, setBusy] = React.useState(false);
  const [msg, setMsg] = React.useState('');
  const [status, setStatus] = React.useState(MMGist.getStatus());
  React.useEffect(() => MMGist.subscribe(s => setStatus(s)), []);
  const url = MMGist.gistUrl();

  const save = async () => {
    if (!token.trim()) { setMsg('토큰을 입력하세요.'); return; }
    MMGist.setToken(token.trim());
    setBusy(true); setMsg('연결 확인 중...');
    try {
      const res = await fetch('https://api.github.com/user', { headers: { Authorization: 'Bearer ' + token.trim() } });
      if (!res.ok) throw new Error(res.status + ' — 토큰이 유효하지 않습니다');
      const u = await res.json();
      setMsg('✓ ' + u.login + ' 계정으로 연결됨. ' + (gistId ? '기존 gist에서 동기화합니다.' : '첫 업로드 시 비공개 gist가 생성됩니다.'));
      await MMGist.init();
      if (!MMGist.getGistId()) {
        setMsg('비공개 gist 생성 중...');
        await MMGist.pushNow();
        setGistId(MMGist.getGistId());
        setMsg('✓ 비공개 gist 생성 + 업로드 완료');
      }
    } catch (e) { setMsg('✗ ' + e.message); }
    setBusy(false);
  };

  const pushManual = async () => {
    setBusy(true); setMsg('업로드 중...');
    try { await MMGist.pushNow(); setMsg('✓ 업로드 완료'); }
    catch (e) { setMsg('✗ ' + e.message); }
    setBusy(false);
  };
  const pullManual = async () => {
    if (!confirm('현재 이 기기의 데이터를 gist 데이터로 덮어씁니다. 계속할까요?')) return;
    setBusy(true); setMsg('다운로드 중...');
    const res = await MMGist.pullNow(true);
    if (res && res.applied) { setMsg('✓ 다운로드 완료 — 새로고침합니다'); setTimeout(() => window.location.reload(), 600); }
    else if (res && res.error) setMsg('✗ ' + res.error);
    else setMsg('변경 사항 없음');
    setBusy(false);
  };
  const disconnect = () => {
    if (!confirm('동기화를 끄고 토큰/gist 연결을 이 기기에서 제거합니다. (gist 자체는 GitHub에 남습니다.) 계속?')) return;
    MMGist.clearAll();
    setToken(''); setGistId(''); setMsg('연결 해제됨.');
  };

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()} style={{width:480}}>
        <h3>기기 간 동기화</h3>
        <div style={{fontSize:13, color:'var(--text2)', marginBottom:14, lineHeight:1.5}}>
          GitHub의 비공개 gist에 모든 데이터를 자동 백업합니다. 다른 기기에서도 같은 토큰을 입력하면 같은 gist를 공유합니다.
        </div>

        <label>GITHUB PERSONAL ACCESS TOKEN (gist 권한)</label>
        <input type="password" value={token} onChange={e=>setToken(e.target.value)}
               placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autoFocus
               style={{fontFamily:'Geist Mono, ui-monospace, Menlo, monospace'}} />
        <div style={{fontSize:11, color:'var(--text3)', marginTop:6}}>
          토큰 발급: <a href="https://github.com/settings/tokens/new" target="_blank" style={{color:'var(--text)'}}>github.com/settings/tokens/new</a> → scope <code style={{background:'var(--color-powder)', padding:'1px 6px', borderRadius:4}}>gist</code>만 체크
        </div>

        {gistId && (<>
          <label style={{marginTop:18}}>연결된 GIST</label>
          <div style={{fontSize:12, color:'var(--text2)', display:'flex', alignItems:'center', gap:8}}>
            <a href={url} target="_blank" style={{color:'var(--text)', textDecoration:'underline', fontFamily:'Geist Mono, ui-monospace, Menlo, monospace'}}>{gistId}</a>
            <span style={{color:'var(--text3)'}}>· 상태: {status}</span>
          </div>
        </>)}

        {msg && (
          <div style={{marginTop:14, fontSize:12, padding:'10px 12px', background:'var(--color-powder)', borderRadius:8, color:'var(--text)', fontFamily:'Geist Mono, ui-monospace, Menlo, monospace'}}>{msg}</div>
        )}

        <div className="modal-actions" style={{flexWrap:'wrap'}}>
          {gistId ? (<>
            <button className="btn ghost" onClick={pullManual} disabled={busy}>↓ 강제 다운로드</button>
            <button className="btn ghost" onClick={pushManual} disabled={busy}>↑ 강제 업로드</button>
            <button className="btn ghost" onClick={disconnect} disabled={busy} style={{color:'var(--color-ember)'}}>연결 해제</button>
            <button className="btn primary" onClick={onClose}>닫기</button>
          </>) : (<>
            <button className="btn ghost" onClick={onClose}>취소</button>
            <button className="btn primary" onClick={save} disabled={busy}>{busy ? '...' : '연결하고 업로드'}</button>
          </>)}
        </div>
      </div>
    </div>
  );
}
