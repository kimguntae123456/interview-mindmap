// ─── EpBadge ───
function EpBadge({ tag }) {
  const ep = findEpByTag(tag);
  const [tooltip, setTooltip] = React.useState(null);
  if (!ep) return <span className="ep-badge">[@{tag}]</span>;
  const emoji = getEpEmoji(ep.id);
  const handleMouseEnter = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    setTooltip({ x: rect.left + rect.width/2 - 160, y: rect.top - 8 });
  };
  const handleMouseLeave = () => setTooltip(null);
  return (
    <>
      <span className="ep-badge" onMouseEnter={handleMouseEnter} onMouseLeave={handleMouseLeave}>
        {emoji} {tag}
      </span>
      {tooltip && ReactDOM.createPortal(
        <EpTooltipPopup epId={ep.id} pos={{x: Math.max(8, tooltip.x), y: tooltip.y - 120}} />,
        document.body
      )}
    </>
  );
}

// ─── renderTextWithBadges ───
function renderTextWithBadges(text) {
  if (!text) return null;
  const parts = [];
  const regex = /\[@([^\]]+)\]/g;
  let lastIdx = 0;
  let match;
  while ((match = regex.exec(text)) !== null) {
    if (match.index > lastIdx) parts.push(text.slice(lastIdx, match.index));
    parts.push(<EpBadge key={match.index} tag={match[1]} />);
    lastIdx = match.index + match[0].length;
  }
  if (lastIdx < text.length) parts.push(text.slice(lastIdx));
  if (parts.length === 0) return text;
  return <>{parts}</>;
}

// ─── MentionDropdown ───
function MentionDropdown({ targetRef, onSelect, onClose, filter }) {
  const [activeIdx, setActiveIdx] = React.useState(0);
  const episodes = getEpisodes();
  const filtered = React.useMemo(() => {
    try {
      if (!filter) return episodes.filter(Boolean);
      const f = (filter || '').toLowerCase();
      return episodes.filter(Boolean).filter(function(ep) {
        var tag = (ep.tag || '').toLowerCase();
        var desc = (ep.desc || '').toLowerCase();
        return tag.includes(f) || desc.includes(f);
      });
    } catch(e) { console.error('MentionDropdown filter error:', e); return []; }
  }, [filter, episodes]);

  React.useEffect(() => { setActiveIdx(0); }, [filter]);

  React.useEffect(() => {
    var onKey = function(e) {
      if (e.isComposing || e.keyCode === 229) return;
      if (e.key === 'ArrowDown') { e.preventDefault(); setActiveIdx(function(i) { return Math.min(i+1, filtered.length-1); }); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); setActiveIdx(function(i) { return Math.max(i-1, 0); }); }
      else if (e.key === 'Enter') { e.preventDefault(); if (filtered[activeIdx]) onSelect(filtered[activeIdx]); }
      else if (e.key === 'Escape') { e.preventDefault(); onClose(); }
    };
    window.addEventListener('keydown', onKey, true);
    return function() { window.removeEventListener('keydown', onKey, true); };
  }, [activeIdx, filtered]);

  const pos = React.useMemo(() => {
    if (!targetRef || !targetRef.current) return { left: 100, top: 100 };
    const rect = targetRef.current.getBoundingClientRect();
    return { left: rect.left, top: rect.bottom + 4 };
  }, []);

  if (filtered.length === 0) return null;

  try {
    return ReactDOM.createPortal(
      <div className="mention-dropdown" style={{ left: pos.left, top: pos.top }}>
        {filtered.map((ep, i) => {
          if (!ep || !ep.id) return null;
          return (
            <div key={ep.id} className={"mention-item" + (i === activeIdx ? ' active' : '')}
                 onClick={() => onSelect(ep)}
                 onMouseEnter={() => setActiveIdx(i)}>
              <span className="ep-emoji">{getEpEmoji(ep.id) || '📌'}</span>
              <span className="ep-tag">{ep.tag || ''}</span>
              <span className="ep-desc">— {ep.desc || ''}</span>
            </div>
          );
        })}
      </div>,
      document.body
    );
  } catch(e) { console.error('MentionDropdown render error:', e); return null; }
}

// ─── MentionTextarea ───
function MentionTextarea({ value, onChange, placeholder, rows, style, className, autoResize }) {
  const [mentionState, setMentionState] = React.useState(null);
  const ref = React.useRef(null);

  // auto-resize
  React.useEffect(function() {
    if (!autoResize || !ref.current) return;
    var ta = ref.current;
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
  }, [value, autoResize]);

  const handleChange = (e) => {
    const newVal = e.target.value;
    onChange(e);
    const cursorPos = e.target.selectionStart;
    const textBefore = newVal.slice(0, cursorPos);
    const atIdx = textBefore.lastIndexOf('@');
    if (atIdx >= 0 && (atIdx === 0 || /\s/.test(textBefore[atIdx-1]))) {
      const filterText = textBefore.slice(atIdx + 1);
      if (!/\s/.test(filterText) || filterText.length === 0) {
        setMentionState({ startPos: atIdx, filter: filterText });
        return;
      }
    }
    setMentionState(null);
  };

  const handleKeyDown = (e) => {
    if (e.isComposing || e.keyCode === 229) return;
    if (mentionState && (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Enter')) {
      return;
    }
    if (e.key === 'Escape' && mentionState) {
      setMentionState(null);
    }
  };

  const handleSelect = (ep) => {
    if (!mentionState || !ref.current) return;
    const ta = ref.current;
    const before = value.slice(0, mentionState.startPos);
    const after = value.slice(ta.selectionStart);
    const insertText = '[@' + ep.tag + ']';
    const newValue = before + insertText + after;
    const syntheticEvent = { target: { value: newValue } };
    onChange(syntheticEvent);
    setMentionState(null);
    setTimeout(() => {
      const newPos = before.length + insertText.length;
      ta.setSelectionRange(newPos, newPos);
      ta.focus();
    }, 0);
  };

  const handleBlur = (e) => {
    setTimeout(() => setMentionState(null), 200);
  };

  return (
    <>
      <textarea ref={ref} className={className || "dp-textarea"} value={value || ''}
                placeholder={placeholder} rows={rows} style={style}
                onChange={handleChange} onKeyDown={handleKeyDown} onBlur={handleBlur} />
      {mentionState && (
        <MentionDropdown targetRef={ref} filter={mentionState.filter}
                         onSelect={handleSelect} onClose={()=>setMentionState(null)} />
      )}
    </>
  );
}

function SyncSettingsModal({ onClose }) {
  const [token, setToken] = React.useState(MMGist.getToken());
  const [gistId, setGistId] = React.useState(MMGist.getGistId());
  const [busy, setBusy] = React.useState(false);
  const [msg, setMsg] = React.useState('');
  const [status, setStatus] = React.useState(MMGist.getStatus());
  React.useEffect(() => MMGist.subscribe(s => setStatus(s)), []);
  const url = MMGist.gistUrl();

  const save = async () => {
    if (!token.trim()) { setMsg('토큰을 입력하세요.'); return; }
    MMGist.setToken(token.trim());
    setBusy(true); setMsg('연결 확인 중...');
    try {
      const res = await fetch('https://api.github.com/user', { headers: { Authorization: 'Bearer ' + token.trim() } });
      if (!res.ok) throw new Error(res.status + ' — 토큰이 유효하지 않습니다');
      const u = await res.json();
      setMsg('✓ ' + u.login + ' 계정으로 연결됨. ' + (gistId ? '기존 gist에서 동기화합니다.' : '첫 업로드 시 비공개 gist가 생성됩니다.'));
      await MMGist.init();
      if (!MMGist.getGistId()) {
        setMsg('비공개 gist 생성 중...');
        await MMGist.pushNow();
        setGistId(MMGist.getGistId());
        setMsg('✓ 비공개 gist 생성 + 업로드 완료');
      }
    } catch (e) { setMsg('✗ ' + e.message); }
    setBusy(false);
  };

  const pushManual = async () => {
    setBusy(true); setMsg('업로드 중...');
    try { await MMGist.pushNow(); setMsg('✓ 업로드 완료'); }
    catch (e) { setMsg('✗ ' + e.message); }
    setBusy(false);
  };
  const pullManual = async () => {
    if (!confirm('현재 이 기기의 데이터를 gist 데이터로 덮어씁니다. 계속할까요?')) return;
    setBusy(true); setMsg('다운로드 중...');
    const res = await MMGist.pullNow(true);
    if (res && res.applied) { setMsg('✓ 다운로드 완료 — 새로고침합니다'); setTimeout(() => window.location.reload(), 600); }
    else if (res && res.error) setMsg('✗ ' + res.error);
    else setMsg('변경 사항 없음');
    setBusy(false);
  };
  const disconnect = () => {
    if (!confirm('동기화를 끄고 토큰/gist 연결을 이 기기에서 제거합니다. (gist 자체는 GitHub에 남습니다.) 계속?')) return;
    MMGist.clearAll();
    setToken(''); setGistId(''); setMsg('연결 해제됨.');
  };

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()} style={{width:480}}>
        <h3>기기 간 동기화</h3>
        <div style={{fontSize:13, color:'var(--text2)', marginBottom:14, lineHeight:1.5}}>
          GitHub의 비공개 gist에 모든 데이터를 자동 백업합니다. 다른 기기에서도 같은 토큰을 입력하면 같은 gist를 공유합니다.
        </div>

        <label>GITHUB PERSONAL ACCESS TOKEN (gist 권한)</label>
        <input type="password" value={token} onChange={e=>setToken(e.target.value)}
               placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autoFocus
               style={{fontFamily:'Geist Mono, ui-monospace, Menlo, monospace'}} />
        <div style={{fontSize:11, color:'var(--text3)', marginTop:6}}>
          토큰 발급: <a href="https://github.com/settings/tokens/new" target="_blank" style={{color:'var(--text)'}}>github.com/settings/tokens/new</a> → scope <code style={{background:'var(--color-powder)', padding:'1px 6px', borderRadius:4}}>gist</code>만 체크
        </div>

        {gistId && (<>
          <label style={{marginTop:18}}>연결된 GIST</label>
          <div style={{fontSize:12, color:'var(--text2)', display:'flex', alignItems:'center', gap:8}}>
            <a href={url} target="_blank" style={{color:'var(--text)', textDecoration:'underline', fontFamily:'Geist Mono, ui-monospace, Menlo, monospace'}}>{gistId}</a>
            <span style={{color:'var(--text3)'}}>· 상태: {status}</span>
          </div>
        </>)}

        {msg && (
          <div style={{marginTop:14, fontSize:12, padding:'10px 12px', background:'var(--color-powder)', borderRadius:8, color:'var(--text)', fontFamily:'Geist Mono, ui-monospace, Menlo, monospace'}}>{msg}</div>
        )}

        <div className="modal-actions" style={{flexWrap:'wrap'}}>
          {gistId ? (<>
            <button className="btn ghost" onClick={pullManual} disabled={busy}>↓ 강제 다운로드</button>
            <button className="btn ghost" onClick={pushManual} disabled={busy}>↑ 강제 업로드</button>
            <button className="btn ghost" onClick={disconnect} disabled={busy} style={{color:'var(--color-ember)'}}>연결 해제</button>
            <button className="btn primary" onClick={onClose}>닫기</button>
          </>) : (<>
            <button className="btn ghost" onClick={onClose}>취소</button>
            <button className="btn primary" onClick={save} disabled={busy}>{busy ? '...' : '연결하고 업로드'}</button>
          </>)}
        </div>
      </div>
    </div>
  );
}

function ColorPickerPopover({ x, y, current, onPick, onClose }) {

    setTimeout(() => window.addEventListener('touchstart', onClick), 50);
    return () => {
      window.removeEventListener('keydown', onKey);
      window.removeEventListener('mousedown', onClick);
      window.removeEventListener('touchstart', onClick);
    };
  }, []);
  const W = 240;
  const pos = {
    left: Math.min(x, window.innerWidth - W - 12),
    top: Math.min(y, window.innerHeight - 280),
  };
  return (
    <div className="ctx-menu color-popover" style={{...pos, width:W, padding:10}} onClick={e=>e.stopPropagation()}>
      <div style={{fontSize:10, fontWeight:700, letterSpacing:'0.7px', textTransform:'uppercase', color:'var(--text2)', marginBottom:8}}>색상 선택</div>
      <div style={{display:'grid', gridTemplateColumns:'repeat(6, 1fr)', gap:6, marginBottom:10}}>
        {COLOR_PALETTE.map(c => (
          <button key={c} onClick={()=>{ onPick(c); onClose(); }}
            title={c}
            style={{width:28, height:28, borderRadius:'50%', background:c, cursor:'pointer',
                    border: (current||'').toLowerCase()===c.toLowerCase() ? '2px solid var(--text)' : '1px solid var(--border)',
                    padding:0}} />
        ))}
      </div>
      <div style={{display:'flex', gap:6, alignItems:'center', marginBottom:8}}>
        <input type="color" value={hex} onChange={e=>setHex(e.target.value)}
               style={{width:40, height:32, border:'1px solid var(--border)', borderRadius:6, padding:2, background:'var(--surface)'}} />
        <input type="text" value={hex} onChange={e=>setHex(e.target.value)}
               style={{flex:1, border:'1px solid var(--border)', borderRadius:4, padding:'6px 10px', fontSize:12, fontFamily:'Geist Mono, ui-monospace, Menlo, monospace', outline:'none', background:'var(--surface)', color:'var(--text)'}} />
        <button className="btn primary" style={{padding:'5px 10px', fontSize:11}} onClick={()=>{ onPick(hex); onClose(); }}>적용</button>
      </div>
      <div className="ctx-sep"></div>
      <div className="ctx-item" onClick={()=>{ onPick(null); onClose(); }}>↺ 기본 색상으로</div>
    </div>
  );
}

// ─── ThemeToggle ───
function ThemeToggle() {
  const [theme, setTheme] = React.useState(() => (window.MMTheme ? MMTheme.get() : 'light'));
  React.useEffect(() => {
    const onChange = (e) => setTheme(e.detail);
    window.addEventListener('mm-theme-change', onChange);
    return () => window.removeEventListener('mm-theme-change', onChange);
  }, []);
  const isDark = theme === 'dark';
  return (
    <button className="theme-toggle" title={isDark ? '라이트 모드로 전환' : '다크 모드로 전환'}
            onClick={() => MMTheme.toggle()} aria-label="테마 전환">
      {isDark ? '☾' : '☀'}
    </button>
  );
}

// ─── ChildCardsBlock — 리스트뷰에서 마인드맵 답변/꼬리질문 카드 표시 ───
const CHILD_TYPE_LABEL = { answer: '답변', tail: '꼬리질문', why: '왜?', opinion: '의견' };
const CHILD_TYPE_ORDER = ['tail', 'answer', 'why', 'opinion'];
function ChildCardsBlock({ q, state }) {
  const children = (state.customNodes || []).filter(n => n.type === 'answer' && (n.rootQId === q.id || n.parentId === q.id));
  const updateChild = (id, mut) => MMStore.update(s => {
    const c = s.customNodes.find(x => x.id === id); if (c) mut(c);
  });
  const removeChild = (id) => MMStore.update(s => {
    s.customNodes = s.customNodes.filter(x => x.id !== id);
    s.customEdges = (s.customEdges || []).filter(e => e.from !== id && e.to !== id);
  });
  const addChild = (kind) => {
    const cat = MM_DATA.categories.find(c => c.id === q.cat);
    const color = cat ? cat.color : '#0071e3';
    MMStore.update(s => {
      s.customNodes.push({ id: 'ans_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), type: 'answer', nodeType: kind, parentId: q.id, rootQId: q.id, label: '', color });
    });
  };
  const hasTail = !!(q.tail && q.tail.trim());
  return (
    <div className="qc-children">
      <div className="qc-children-head">
        <span>꼬리질문 · 연관 답변</span>
        <span style={{fontWeight:500, opacity:0.7}}>{children.length + (hasTail?1:0)}개</span>
      </div>
      <div className="qc-child-list">
        {hasTail && (
          <div className="qc-child-card" style={{borderLeftColor:'#ff9500'}}>
            <span className="qc-child-badge t-tail">예상 꼬리</span>
            <MentionTextarea className="qc-child-text" value={q.tail || ''} autoResize
                             placeholder="예상 꼬리질문..."
                             onChange={e=>MMStore.update(s=>{const qq=s.questions.find(x=>x.id===q.id); if(qq)qq.tail=e.target.value;})} />
            <button className="qc-child-del" title="꼬리질문 비우기" onClick={()=>MMStore.update(s=>{const qq=s.questions.find(x=>x.id===q.id); if(qq)qq.tail='';})}>×</button>
          </div>
        )}
        {children.length === 0 && !hasTail && (
          <div className="qc-child-empty">아직 연결된 답변/꼬리질문이 없습니다. 아래 버튼으로 추가하거나 마인드맵에서 + 가지를 만들어 보세요.</div>
        )}
        {children.map(cn => {
          const kind = cn.nodeType || 'answer';
          const accent = cn.color || '#0071e3';
          return (
            <div className="qc-child-card" key={cn.id} style={{borderLeftColor: accent}}>
              <span className={"qc-child-badge t-" + kind}>{CHILD_TYPE_LABEL[kind] || '답변'}</span>
              <MentionTextarea className="qc-child-text" value={cn.label || ''} autoResize
                               placeholder={(CHILD_TYPE_LABEL[kind]||'답변')+' 내용...'}
                               onChange={e=>updateChild(cn.id, c=>c.label=e.target.value)} />
              <button className="qc-child-del" title="삭제" onClick={()=>{ if(confirm('이 카드를 삭제할까요?')) removeChild(cn.id); }}>×</button>
            </div>
          );
        })}
      </div>
      <div className="qc-child-add">
        {CHILD_TYPE_ORDER.map(t => (
          <button key={t} onClick={()=>addChild(t)}>+ {CHILD_TYPE_LABEL[t]}</button>
        ))}
      </div>
    </div>
  );
}

// ─── 새롭게 바뀐 TableView (카드형 UI) ───
function TableView() {
  const [state, setState] = React.useState(MMStore.get());

  const [catFilter, setCatFilter] = React.useState('all');
  const [adding, setAdding] = React.useState(false);
  const [newRow, setNewRow] = React.useState({ cat: 'c1', q: '', kw: '' });

  const [addingCat, setAddingCat] = React.useState(false);
  const [newCat, setNewCat] = React.useState({ name: '', color: '#4a9eff' });
  const catColor = (id) => (state.catColors||{})[id] || MM_DATA.categories.find(c => c.id === id)?.color || '#999';

  React.useEffect(() => MMStore.subscribe(s => setState({...s})), []);

  const filtered = React.useMemo(() => {
    let qs = state.questions;
    if (catFilter !== 'all') qs = qs.filter(q => q.cat === catFilter);
    if (filter.trim()) {
      const t = filter.toLowerCase();
      qs = qs.filter(q =>
        q.q.toLowerCase().includes(t) ||
        (q.kw && q.kw.toLowerCase().includes(t)) ||
        q.answers.some(a => a && a.toLowerCase().includes(t)) ||
        ((q.scripts || []).some(sc => sc.content && sc.content.toLowerCase().includes(t))) ||
        (q.fullAnswer && q.fullAnswer.toLowerCase().includes(t))
      );
    }
    // 중요도 높은 질문을 최상단으로 정렬
    return [...qs].sort((a,b) => (b.priority==='high'?1:0) - (a.priority==='high'?1:0));
  }, [state.questions, catFilter, filter]);

  const update = (id, mut) => MMStore.update(s => {
    const q = s.questions.find(x => x.id === id); if (q) mut(q);
  });

  const addRow = () => {
    if (!newRow.q.trim()) return;
    MMStore.update(s => {
      s.questions.push({ id:'q_'+Date.now(), cat:newRow.cat, q:newRow.q, kw:newRow.kw, answers:[], tail:'', fullAnswer:'', scripts:[{ id:'sc_'+Date.now().toString(36), title:'기본 대본', content:'' }], priority:'normal' });
    });
    setNewRow({ cat:'c1', q:'', kw:'' }); setAdding(false);
  };

  const totalQ = state.questions.length;

  return (
    <>
      <div className="topbar">
        <div className="brand">면접 마인드맵</div>
        <div className="tabs">
          <button className="tab" onClick={()=>tabSwitch('mindmap')}>마인드맵</button>
          <button className="tab active">리스트 뷰</button>
          <button className="tab" onClick={()=>tabSwitch('episode')}>에피소드 관리</button>
        </div>

        <SyncIndicator />
        <ThemeToggle />
      </div>
      
      <div className="table-wrap">
        <div className="tbl-toolbar">
          <input className="search" placeholder="질문, 키워드, 대본 검색..." value={filter} onChange={e=>setFilter(e.target.value)} style={{width:240}} />
          <div className="filter-chip-group">
            <button className={"filter-chip" + (catFilter==='all'?' active':'')} onClick={()=>setCatFilter('all')}>전체</button>
            {MM_DATA.categories.map(c => (
              <button key={c.id} className={"filter-chip" + (catFilter===c.id?' active':'')}
                      onClick={()=>setCatFilter(catFilter===c.id?'all':c.id)}
                      onContextMenu={e=>{e.preventDefault();if(confirm(c.name+' 카테고리를 삭제할까요? (소속 질문은 유지됩니다)')){MM_DATA.categories.splice(MM_DATA.categories.indexOf(c),1);MMStore.update(s=>{});setState({...MMStore.get()});}}}>
                <span className="dot" style={{background:c.color}}></span>
                {c.name}
                <span className="cnt">{state.questions.filter(q=>q.cat===c.id).length}</span>
              </button>
            ))}
            {addingCat ? (
              <span style={{display:'inline-flex',gap:4,alignItems:'center'}}>
                <input style={{padding:'4px 8px',borderRadius:20,border:'1px solid var(--border)',background:'var(--surface)',color:'var(--text)',fontSize:12,width:100}} placeholder="이름" value={newCat.name} onChange={e=>setNewCat({...newCat,name:e.target.value})} onKeyDown={e=>{if(e.key==='Enter'){const nm=newCat.name.trim();if(!nm)return;MM_DATA.categories.push({id:'cc_'+Date.now(),name:nm,color:newCat.color});MMStore.update(s=>{});setNewCat({name:'',color:'#4a9eff'});setAddingCat(false);setState({...MMStore.get()});}}} autoFocus />
                <input type="color" value={newCat.color} onChange={e=>setNewCat({...newCat,color:e.target.value})} style={{width:24,height:24,border:'none',padding:0,cursor:'pointer',borderRadius:4}} />
                <button className="filter-chip" onClick={()=>{const nm=newCat.name.trim();if(!nm)return;MM_DATA.categories.push({id:'cc_'+Date.now(),name:nm,color:newCat.color});MMStore.update(s=>{});setNewCat({name:'',color:'#4a9eff'});setAddingCat(false);setState({...MMStore.get()});}}>확인</button>
                <button className="filter-chip" onClick={()=>setAddingCat(false)}>취소</button>
              </span>
            ) : (
              <button className="filter-chip" onClick={()=>setAddingCat(true)} style={{borderStyle:'dashed',opacity:0.6}}>+ 카테고리</button>
            )}
          </div>
          <div className="tbl-stats">{filledQ}/{totalQ} 완료</div>
        </div>

        {adding && (
          <div className="add-row-form" style={{background:'var(--surface)', padding:16, borderRadius:16, border:'1px solid var(--border)'}}>
            <select value={newRow.cat} onChange={e=>setNewRow({...newRow,cat:e.target.value})}>
              {MM_DATA.categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
            <input placeholder="새로운 면접 질문 입력..." value={newRow.q} onChange={e=>setNewRow({...newRow,q:e.target.value})}

          {filtered.map(q => {
            const isHigh = q.priority === 'high';
            
            return (
              <div key={q.id} className={`q-card ${isHigh ? 'priority-high' : ''}`}
                   style={q.color ? { borderLeft: '4px solid ' + q.color } : null}>

                {/* 1. 카드 헤더 */}
                <div className="q-card-head">
                  <span className="qc-id">{q.id.toUpperCase()}</span>
                  <button className="qc-cat-dot" title="카테고리 색상 변경"
                    style={{background: catColor(q.cat), border:'none', cursor:'pointer'}}
                    onClick={(e)=>{ const r=e.currentTarget.getBoundingClientRect(); setColorPicker({ x:r.left, y:r.bottom+6, target:{type:'cat', id:q.cat}, current: catColor(q.cat) }); }} />
                  <select className="qc-cat" value={q.cat} onChange={e=>update(q.id, qq=>qq.cat=e.target.value)}>
                    {MM_DATA.categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                  </select>
                  <button className="qc-cat-dot" title="이 질문 색상 변경"
                    style={{background: q.color || 'transparent', border:'1px dashed var(--border)', cursor:'pointer'}}
                    onClick={(e)=>{ const r=e.currentTarget.getBoundingClientRect(); setColorPicker({ x:r.left, y:r.bottom+6, target:{type:'q', id:q.id}, current: q.color || catColor(q.cat) }); }} />

                  <select className="qc-prio" data-prio={q.priority} value={q.priority} onChange={e=>update(q.id, qq=>qq.priority=e.target.value)}>
                    <option value="low">중요도 · 낮음</option>
                    <option value="normal">중요도 · 보통</option>
                    <option value="high">★ 핵심 질문</option>
                  </select>
                  <button className="qc-del" title="삭제" onClick={()=>{if(confirm('이 면접 질문을 완전히 삭제하시겠습니까?'))MMStore.update(s=>{s.questions=s.questions.filter(x=>x.id!==q.id);});}}>×</button>
                </div>

                {/* 2. 질문 텍스트 */}
                <div className="qc-question" contentEditable suppressContentEditableWarning
                     data-empty={!q.q}
                     onBlur={e=>update(q.id, qq=>qq.q=e.currentTarget.textContent)}>{q.q}</div>

                {/* 3. 답변 작성 패널 (Grid) */}
                <div className="q-card-body">
                  
                  {/* 왼쪽 패널: 키워드 & 개요 */}
                  <div className="qc-left">
                    <div>
                      <div className="qc-label">MAIN KEYWORD</div>
                      <input className="qc-kw-input" placeholder="답변을 관통하는 키워드" 
                             value={q.kw || ''} onChange={e=>update(q.id, qq=>qq.kw=e.target.value)} />
                    </div>
                    
                    <div>
                      <div className="qc-label">요약 (답변 구조)</div>
                      <div className="qc-ans-list">
                        {q.answers.map((a, ai) => (
                          <div className="qc-ans-item" key={ai}>
                            <span className="qc-ans-num">{ai+1}.</span>
                            <MentionTextarea className="qc-ans-input" value={a} placeholder="핵심 내용 요약 (@에피소드)" rows={1}
                                      onChange={e=>update(q.id, qq=>qq.answers[ai]=e.target.value)} />
                            <button className="qc-ans-del" onClick={()=>update(q.id, qq=>qq.answers.splice(ai,1))}>×</button>
                          </div>
                        ))}
                        <button className="qc-ans-add" onClick={()=>update(q.id, qq=>qq.answers.push(''))}>+ 개요 추가</button>
                      </div>
                    </div>
                  </div>

                  {/* 오른쪽 패널: 실전 대본 (다중 버전) */}
                  <div className="qc-right">
                    <div className="qc-label">실전 대본 (FULL SCRIPT)</div>
                    {(q.scripts || []).map((sc, si) => (
                      <div className="qc-script-block" key={sc.id || si}>
                        <div className="qc-script-head">
                          <input className="qc-script-title" value={sc.title || ''} placeholder={'버전 ' + (si+1)}
                                 onChange={e=>update(q.id, qq=>{ qq.scripts[si].title = e.target.value; })} />
                          <span className="qc-script-meta">{(sc.content||'').length}자</span>
                          {q.scripts.length > 1 && (
                            <button className="qc-script-del" title="이 버전 삭제" onClick={()=>{
                              if(!confirm('이 버전을 삭제할까요?')) return;
                              update(q.id, qq=>{ qq.scripts.splice(si,1); if (qq.scripts[0]) qq.fullAnswer = qq.scripts[0].content; });
                            }}>×</button>
                          )}
                        </div>
                        <MentionTextarea className="qc-script" value={sc.content || ''}
                                         placeholder="실제 면접에서 말하듯 대본 작성... (@로 에피소드 멘션)"
                                         onChange={e=>update(q.id, qq=>{
                                           qq.scripts[si].content = e.target.value;
                                           if (si === 0) qq.fullAnswer = e.target.value;
                                         })} />
                      </div>
                    ))}
                    <button className="qc-script-add" onClick={()=>update(q.id, qq=>{
                      qq.scripts = qq.scripts || [];
                      qq.scripts.push({ id: 'sc_'+Date.now().toString(36), title: '버전 ' + (qq.scripts.length+1), content: '' });
                    })}>+ 다른 버전 대본 추가</button>
                  </div>
                </div>

                {/* 4. 꼬리질문 / 답변 / 의견 등 자식 카드 */}
                <ChildCardsBlock q={q} state={state} />

              </div>
            );
          })}
        </div>

        {!adding && (
          <div style={{marginTop:32, textAlign:'center'}}>
            <button className="btn ghost" style={{fontSize:15, padding:'12px 24px', fontWeight:600}} onClick={()=>setAdding(true)}>+ 새 면접 질문 추가</button>
          </div>
        )}
      </div>

      {colorPicker && (
        <ColorPickerPopover x={colorPicker.x} y={colorPicker.y} current={colorPicker.current}
          onPick={(c) => {
            const t = colorPicker.target;
            MMStore.update(s => {
              if (t.type === 'cat') {
                s.catColors = s.catColors || {};
                if (c == null) delete s.catColors[t.id]; else s.catColors[t.id] = c;
              } else if (t.type === 'q') {
                const qq = s.questions.find(x => x.id === t.id);
                if (qq) { if (c == null) delete qq.color; else qq.color = c; }
              }
            });
          }}
          onClose={() => setColorPicker(null)} />
      )}
    </>
  );
}

// ─── EpisodeManagerView (에피소드 관리 탭) ───
const DEFAULT_SUBSECTIONS = [
  { key: 'situation', label: 'Situation', placeholder: '어떤 상황이었나요?' },
  { key: 'action',    label: 'Action',    placeholder: '어떻게 행동했나요?' },
  { key: 'result',    label: 'Result',    placeholder: '결과는 어땠나요?' },
  { key: 'takeaway',  label: 'Takeaway',  placeholder: '무엇을 배웠나요?' },
];
const EP_MODES = [
  { key: 'full', label: '완전형(대본)', placeholder: '실전 면접에서 말하듯 완전한 대본을 작성하세요...' },
  { key: 'brief', label: '축약형', placeholder: '핵심 키워드와 요약만 간결하게...' },
];

function EpisodeManagerView() {
  const [state, setState] = React.useState(MMStore.get());
  const [stars, setStars] = React.useState(() => MMStars.get());
  const [filter, setFilter] = React.useState('');

  React.useEffect(() => MMStore.subscribe(s => setState({...s})), []);
  React.useEffect(() => MMStars.subscribe(() => setStars(MMStars.get())), []);

  const tabSwitch = (tab) => { window.location.hash = '#' + tab; };

  const episodes = state.episodes || [];

  const filtered = React.useMemo(() => {
    if (!filter.trim()) return episodes;
    const t = filter.toLowerCase();
    return episodes.filter(ep => {
      if (ep.tag.toLowerCase().includes(t)) return true;
      if (ep.desc && ep.desc.toLowerCase().includes(t)) return true;
      const star = stars[ep.id] || {};
      if (DEFAULT_SUBSECTIONS.some(s => (star[s.key]||'').toLowerCase().includes(t))) return true;
      if ((star.fullScript||'').toLowerCase().includes(t)) return true;
      if ((star.briefScript||'').toLowerCase().includes(t)) return true;
      if ((star.subsections||[]).some(sub => (sub.title||'').toLowerCase().includes(t) || (sub.content||'').toLowerCase().includes(t))) return true;
      return false;
    });
  }, [episodes, filter, stars]);

  const usageDetail = (epTag) => {
    const re = new RegExp('\\[@' + epTag.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\]');
    var count = 0;
    var usedIn = [];
    state.questions.forEach(function(q) {
      var hit = false;
      if (re.test(q.q)) { count++; hit = true; }
      if (q.answers.some(function(a) { return a && re.test(a); })) { count++; hit = true; }
      if ((q.scripts||[]).some(function(sc) { return sc.content && re.test(sc.content); })) { count++; hit = true; }
      if (q.tail && re.test(q.tail)) { count++; hit = true; }
      if (hit) usedIn.push(q);
    });
    (state.customNodes||[]).forEach(function(cn) { if (cn.label && re.test(cn.label)) count++; });
    return { count: count, usedIn: usedIn };
  };

  const updateEp = (epId, mut) => MMStore.update(s => {
    const ep = (s.episodes||[]).find(e => e.id === epId); if (ep) mut(ep);
  });

  const addEp = () => {
    const newId = 'ep_' + Date.now().toString(36);
    MMStore.update(s => {
      s.episodes = s.episodes || [];
      s.episodes.push({ id: newId, tag: '새에피소드', desc: '한줄 설명', emoji: '📌' });
    });
    MMStars.setEntry(newId, { situation:'', action:'', result:'', takeaway:'', subsections: [] });
  };

  const removeEp = (epId) => {
    if (!confirm('이 에피소드를 삭제할까요? (대본의 [@태그]는 그대로 남습니다)')) return;
    MMStore.update(s => { s.episodes = (s.episodes||[]).filter(e => e.id !== epId); });
    MMStars.remove(epId);
  };

  const updateStarField = (epId, field, value) => {
    MMStars.update(epId, field, value);
  };
  const updateSub = (epId, idx, field, value) => {
    const cur = MMStars.get()[epId] || { subsections: [] };
    const subs = [...(cur.subsections || [])];
    if (!subs[idx]) subs[idx] = { title: '', content: '' };
    subs[idx] = { ...subs[idx], [field]: value };
    MMStars.setEntry(epId, { subsections: subs });
  };
  const addSub = (epId) => {
    const cur = MMStars.get()[epId] || { subsections: [] };
    const subs = [...(cur.subsections || []), { title: '소제목', content: '' }];
    MMStars.setEntry(epId, { subsections: subs });
  };
  const removeSub = (epId, idx) => {
    const cur = MMStars.get()[epId] || { subsections: [] };
    const subs = (cur.subsections || []).filter((_, i) => i !== idx);
    MMStars.setEntry(epId, { subsections: subs });
  };

  const totalEp = episodes.length;
  const filledEp = episodes.filter(ep => {
    const s = stars[ep.id] || {};
    if (DEFAULT_SUBSECTIONS.some(d => (s[d.key]||'').trim())) return true;
    if ((s.fullScript||'').trim() || (s.briefScript||'').trim()) return true;
    if ((s.subsections||[]).some(sub => (sub.content||'').trim())) return true;
    return false;
  }).length;

  return (
    <>
      <div className="topbar">
        <div className="brand">면접 마인드맵</div>
        <div className="tabs">
          <button className="tab" onClick={()=>tabSwitch('mindmap')}>마인드맵</button>
          <button className="tab" onClick={()=>tabSwitch('table')}>리스트 뷰</button>
          <button className="tab active">에피소드 관리</button>
        </div>
        <div className="tb-spacer"></div>
        <SyncIndicator />
        <ThemeToggle />
        <button className="btn primary" onClick={addEp}>+ 새 에피소드</button>
      </div>

      <div className="ep-wrap">
        <div className="ep-toolbar">
          <input className="search" placeholder="태그·설명·내용 검색..." value={filter} onChange={e=>setFilter(e.target.value)} style={{width:260}} />
          <div className="ep-stats">{filledEp}/{totalEp} 정리됨</div>
        </div>

        <div className="ep-list">
          {filtered.map(ep => {
            const star = stars[ep.id] || { situation:'', action:'', result:'', takeaway:'', fullScript:'', briefScript:'', subsections: [] };
            const usage = usageDetail(ep.tag);
            return (
              <div className="ep-card" key={ep.id}>
                <div className="ep-card-head">
                  <input className="ep-emoji-input" value={ep.emoji || ''} placeholder="📌"
                         onChange={e=>{const v=e.target.value; if([...v].length<=2) updateEp(ep.id, x=>x.emoji=v);}} />
                  <input className="ep-tag-input" value={ep.tag} placeholder="태그"
                         onChange={e=>updateEp(ep.id, x=>x.tag=e.target.value)} />
                  <input className="ep-desc-input" value={ep.desc || ''} placeholder="한줄 설명"
                         onChange={e=>updateEp(ep.id, x=>x.desc=e.target.value)} />
                  <button className="ep-card-del" title="에피소드 삭제" onClick={()=>removeEp(ep.id)}>×</button>
                </div>

                {/* 완전형(대본) / 축약형 */}
                <div style={{display:'flex', flexDirection:'column', gap:10, padding:'0'}}>
                  {EP_MODES.map(function(mode) {
                    return (
                      <div key={mode.key} style={{background:'var(--color-powder)', border:'1px solid var(--border)', borderRadius:12, padding:14}}>
                        <div className="qc-label" style={{margin:'0 0 6px 0', fontSize:11}}>{mode.label}</div>
                        <MentionTextarea value={star[mode.key === 'full' ? 'fullScript' : 'briefScript'] || ''}
                                         placeholder={mode.placeholder}
                                         onChange={function(e) { updateStarField(ep.id, mode.key === 'full' ? 'fullScript' : 'briefScript', e.target.value); }}
                                         rows={mode.key === 'full' ? 5 : 2}
                                         style={{minHeight: mode.key === 'full' ? 120 : 50, width:'100%', border:'1px solid var(--border)', borderRadius:4, padding:'9px 12px', fontSize:13, lineHeight:'1.5', outline:'none', background:'var(--surface)', resize:'vertical', fontFamily:'var(--font)', color:'var(--text)', boxShadow:'var(--shadow-inset)', letterSpacing:'0.1px'}} />
                      </div>
                    );
                  })}
                </div>

                <div className="ep-card-body">
                  {DEFAULT_SUBSECTIONS.map(sec => (
                    <div className="ep-section" key={sec.key}>
                      <div className="ep-section-head">
                        <div className="qc-label" style={{margin:0}}>{sec.label}</div>
                      </div>
                      <MentionTextarea value={star[sec.key] || ''} placeholder={sec.placeholder}
                                       onChange={e=>updateStarField(ep.id, sec.key, e.target.value)} rows={2} style={{minHeight:50}} />
                    </div>
                  ))}
                  {(star.subsections || []).map((sub, idx) => (
                    <div className="ep-section" key={'sub_'+idx}>
                      <div className="ep-section-head">
                        <input className="ep-sub-input" value={sub.title || ''} placeholder="소제목 (예: ㅇㅇㅇ)"
                               onChange={e=>updateSub(ep.id, idx, 'title', e.target.value)} />
                        <button className="ep-sub-del" title="이 소제목 삭제" onClick={()=>removeSub(ep.id, idx)}>×</button>
                      </div>
                      <MentionTextarea value={sub.content || ''} placeholder="내용 입력..."
                                       onChange={e=>updateSub(ep.id, idx, 'content', e.target.value)} rows={2} style={{minHeight:50}} />
                    </div>
                  ))}
                </div>

                <div className="ep-card-foot">
                  <button className="ep-add-sub" onClick={()=>addSub(ep.id)}>+ 소제목 추가</button>
                  <span className="ep-usage">대본·답변에서 {usage.count}회 사용됨</span>
                </div>

                {/* 사용된 질문 목록 */}
                {usage.usedIn.length > 0 && (
                  <div style={{borderTop:'1px solid var(--border)', paddingTop:10, marginTop:4}}>
                    <div className="qc-label" style={{margin:'0 0 6px 0', fontSize:10}}>사용된 질문</div>
                    <div style={{display:'flex', flexDirection:'column', gap:4}}>
                      {usage.usedIn.map(function(uq) {
                        var cat = MM_DATA.categories.find(function(c){return c.id===uq.cat;});
                        return (
                          <div key={uq.id} style={{display:'flex', alignItems:'center', gap:6, fontSize:12, color:'var(--text2)', cursor:'pointer', padding:'3px 6px', borderRadius:6, background:'var(--color-powder)', border:'1px solid var(--border)'}}
                               onClick={function(){window.location.hash='#table';}}>
                            {cat && React.createElement('span', {style:{width:8,height:8,borderRadius:'50%',background:cat.color,flexShrink:0}})}
                            <span style={{fontWeight:500, color:'var(--text)', flex:1, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{uq.q}</span>
                            <span style={{flexShrink:0, opacity:0.5, fontFamily:"'Geist Mono', monospace", fontSize:10}}>{uq.id.toUpperCase()}</span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>
            );
          })}
          {filtered.length === 0 && (
            <div style={{textAlign:'center', padding:'40px 0', color:'var(--text3)', fontSize:14}}>
              조건에 맞는 에피소드가 없습니다.
            </div>
          )}
        </div>
      </div>
    </>
  );
}

window.MindmapView = MindmapView;
window.TableView = TableView;
window.EpisodeManagerView = EpisodeManagerView;

const { useState, useEffect } = React;

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false, errorMsg: '' }; }
  componentDidCatch(err, info) {
    console.error('ErrorBoundary caught:', err, info);
    this.setState({ hasError: true, errorMsg: String(err && err.message || err) + '\n' + String(info && info.componentStack || '').slice(0, 500) });
  }
  render() {
    if (this.state.hasError) {
      var self = this;
      return React.createElement('div', {style:{padding:40,textAlign:'center'}},
        React.createElement('h2', null, '오류가 발생했습니다'),
        React.createElement('pre', {style:{textAlign:'left',fontSize:12,background:'#f5f5f5',padding:16,borderRadius:8,maxHeight:200,overflow:'auto',margin:'16px auto',maxWidth:600}}, this.state.errorMsg),
        React.createElement('button', {onClick:function(){self.setState({hasError:false,errorMsg:''}); window.location.hash='#table';}}, '리스트 뷰로 돌아가기'),
        ' ',
        React.createElement('button', {onClick:function(){self.setState({hasError:false,errorMsg:''}); window.location.hash='#mindmap';}}, '마인드맵으로 돌아가기')
      );
    }
    return this.props.children;
  }
}
ErrorBoundary.getDerivedStateFromError = function(err) { return { hasError: true, errorMsg: String(err && err.message || err) }; };

function App() {
  const [route, setRoute] = useState(() => {
    const h = window.location.hash.slice(1);
    return h.split('?')[0] || 'mindmap';
  });

  useEffect(() => {
    const onHash = () => {
      const h = window.location.hash.slice(1);
      setRoute(h.split('?')[0] || 'mindmap');
    };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  if (route === 'table') return <TableView />;
  if (route === 'episode') return <EpisodeManagerView />;
  return <MindmapView />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
