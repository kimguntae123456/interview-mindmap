<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>면접 마인드맵</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Pretendard',-apple-system,sans-serif;background:#0a0a0a;color:#ddd;overflow:hidden;height:100vh;touch-action:none;}
.toolbar{position:fixed;top:0;left:0;right:0;height:40px;background:#141414;border-bottom:1px solid #222;display:flex;align-items:center;padding:0 12px;z-index:100;gap:6px;}
.toolbar h1{font-size:13px;color:#4ecdc4;margin-right:8px;}
.tb{background:#1e1e1e;border:1px solid #2a2a2a;color:#ccc;padding:4px 10px;border-radius:5px;cursor:pointer;font-size:11px;}
.tb:hover{border-color:#4ecdc4;color:#4ecdc4;}
.zm{color:#666;min-width:44px;text-align:center;font-size:11px;}
.tright{margin-left:auto;display:flex;gap:5px;align-items:center;}
.sbox{background:#0a0a0a;border:1px solid #2a2a2a;color:#ddd;padding:4px 8px;border-radius:5px;font-size:11px;width:150px;}
.sbox:focus{outline:none;border-color:#4ecdc4;}
.wrap{position:fixed;top:40px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab;touch-action:none;}
.wrap.grabbing{cursor:grabbing;}
.cvs{transform-origin:0 0;position:absolute;will-change:transform;}
.cvs svg{position:absolute;top:0;left:0;overflow:visible;pointer-events:none;}

/* NODE BASE */
.nd{position:absolute;cursor:pointer;user-select:none;-webkit-user-select:none;}

/* ROOT */
.nd-root{background:#111;border:2px solid #4ecdc4;border-radius:16px;padding:14px 28px;font-size:16px;font-weight:700;color:#4ecdc4;text-align:center;white-space:nowrap;transform:translate(-50%,-50%);}

/* CATEGORY */
.nd-cat{border-radius:14px;padding:12px 20px;font-size:14px;font-weight:600;text-align:center;white-space:nowrap;border:2px solid;transform:translate(-50%,-50%);transition:all .25s;}
.nd-cat:hover{filter:brightness(1.2);}
.nd-cat.open{box-shadow:0 0 24px rgba(255,255,255,.06);}
.nd-cat .cc{font-size:10px;opacity:.4;margin-left:4px;}

/* QUESTION */
.nd-q{background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:12px 18px;font-size:14px;line-height:1.5;min-width:200px;max-width:300px;transition:border-color .2s, background .2s;transform:translate(-50%,-50%);}
.nd-q:hover{border-color:#555;background:#1e1e1e;}
.nd-q.pinned{border-color:#ff9f43;background:#1e1a14;box-shadow:0 0 12px rgba(255,159,67,.15);}
.nd-q.active{border-color:#4ecdc4;background:#162825;box-shadow:0 0 16px rgba(78,205,196,.15);}
.nd-q .qkw{font-size:11px;color:#4ecdc4;margin-top:4px;}
.nd-q .pin-icon{position:absolute;top:6px;right:8px;font-size:11px;opacity:.4;transition:opacity .15s;}
.nd-q.pinned .pin-icon{opacity:1;color:#ff9f43;}

/* EXPANDED SCRIPT PANEL — attached to question */
.nd-script{background:#141414;border:1px solid #2a2a2a;border-radius:10px;padding:14px 16px;font-size:12px;line-height:1.7;min-width:280px;max-width:380px;transform:translate(-50%,-50%);max-height:500px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.nd-script .scr-section{margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #1e1e1e;}
.nd-script .scr-section:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.nd-script .scr-label{font-size:10px;font-weight:700;letter-spacing:.4px;margin-bottom:4px;text-transform:uppercase;}
.nd-script .scr-text{white-space:pre-wrap;color:#ccc;font-size:12px;line-height:1.7;outline:none;border:1px solid transparent;border-radius:4px;padding:3px 6px;min-height:20px;}
.nd-script .scr-text:hover{border-color:#333;}
.nd-script .scr-text:focus{border-color:#4ecdc4;background:#1a1a1a;}
.nd-script .scr-text:empty::before{content:attr(data-ph);color:#444;font-style:italic;font-size:11px;}
.nd-script .scr-ans{margin:3px 0;padding:4px 8px;background:#1a1a1a;border-radius:6px;display:flex;align-items:flex-start;gap:6px;}
.nd-script .scr-ans-num{color:#4ecdc4;font-size:10px;font-weight:700;margin-top:2px;flex-shrink:0;}
.nd-script .scr-ans-text{flex:1;outline:none;border:1px solid transparent;border-radius:4px;padding:2px 4px;white-space:pre-wrap;font-size:12px;line-height:1.6;min-height:18px;}
.nd-script .scr-ans-text:hover{border-color:#333;}
.nd-script .scr-ans-text:focus{border-color:#4ecdc4;background:#111;}
.nd-script .scr-ans-text:empty::before{content:'답변 입력...';color:#444;font-style:italic;font-size:11px;}
.nd-script .scr-del{background:none;border:none;color:#555;cursor:pointer;font-size:10px;flex-shrink:0;margin-top:2px;}
.nd-script .scr-del:hover{color:#ff6b6b;}
.nd-script .scr-add-row{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;}
.nd-script .scr-add{background:none;border:1px dashed #333;border-radius:4px;padding:3px 8px;font-size:9px;color:#555;cursor:pointer;}
.nd-script .scr-add:hover{border-color:#4ecdc4;color:#4ecdc4;}

/* BRANCH (5-color, answer, tail) */
.nd-br{border-radius:8px;padding:10px 14px;font-size:12px;line-height:1.6;max-width:260px;min-width:140px;border-left:3px solid;background:#141414;transform:translate(-50%,-50%);position:relative;}
.nd-br .blab{font-size:9px;font-weight:700;letter-spacing:.4px;margin-bottom:4px;}
.nd-br .btx{outline:none;min-height:20px;border:1px solid transparent;border-radius:4px;padding:3px 6px;white-space:pre-wrap;font-size:12px;line-height:1.6;}
.nd-br .btx:hover{border-color:#333;}
.nd-br .btx:focus{border-color:#4ecdc4;background:#1a1a1a;}
.nd-br .btx:empty::before{content:attr(data-ph);color:#444;font-style:italic;font-size:11px;}
.nd-br .bdel{position:absolute;top:4px;right:6px;background:none;border:none;color:#555;cursor:pointer;font-size:10px;opacity:0;transition:opacity .15s;}
.nd-br:hover .bdel{opacity:1;}

/* ADD BUTTONS */
.nd-add{background:none;border:1px dashed #333;border-radius:6px;padding:5px 12px;font-size:10px;color:#555;white-space:nowrap;transform:translate(-50%,-50%);}
.nd-add:hover{border-color:#4ecdc4;color:#4ecdc4;}

/* COLORS */
.lbl-value{color:#6c9bff;} .lbl-success{color:#4ecdc4;} .lbl-fail{color:#ff6b6b;} .lbl-why{color:#ffd93d;} .lbl-method{color:#a8e6cf;} .lbl-answer{color:#999;} .lbl-tail{color:#ff9f43;}

/* EP */
.ep-panel{position:fixed;bottom:8px;left:8px;background:#141414;border:1px solid #222;border-radius:10px;padding:12px;z-index:90;width:340px;max-height:60vh;display:flex;flex-direction:column;}
.ep-panel.collapsed{width:auto;max-height:none;}
.ep-panel .ep-header{font-size:11px;color:#666;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.ep-panel .ep-header button{background:none;border:none;color:#4ecdc4;cursor:pointer;font-size:12px;padding:2px 6px;}
.ep-list{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;}
.ep-card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;padding:10px 12px;margin-bottom:6px;transition:border-color .2s;}
.ep-card:hover{border-color:#444;}
.ep-card .ep-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.ep-card .ep-tag{font-size:13px;font-weight:700;color:#c49bff;}
.ep-card .ep-desc{font-size:10px;color:#666;margin-left:6px;}
.ep-card .ep-cnt{font-size:10px;color:#888;background:#222;padding:2px 6px;border-radius:8px;}
.ep-card .ep-orgs{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:6px;}
.ep-card .ep-org{font-size:9px;padding:1px 6px;border-radius:6px;background:rgba(78,205,196,.1);color:#4ecdc4;border:1px solid rgba(78,205,196,.2);cursor:pointer;}
.ep-card .ep-org:hover{background:rgba(78,205,196,.2);}
.ep-card .ep-org-add{font-size:9px;padding:1px 6px;border-radius:6px;background:none;border:1px dashed #333;color:#555;cursor:pointer;}
.ep-card .ep-org-add:hover{border-color:#4ecdc4;color:#4ecdc4;}
.ep-card .ep-qs{display:flex;flex-direction:column;gap:4px;margin-top:6px;}
.ep-card .ep-qitem{font-size:12px;color:#ccc;padding:6px 10px;background:#111;border:1px solid #252525;border-radius:6px;cursor:pointer;display:flex;align-items:flex-start;gap:6px;line-height:1.5;}
.ep-card .ep-qitem:hover{color:#fff;background:#1e1e1e;border-color:#444;}
.ep-card .ep-qitem .ep-qdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.ep-card .ep-qcat{font-size:9px;color:#888;margin-top:2px;}
.ep-card .ep-del{background:none;border:none;color:#444;cursor:pointer;font-size:10px;padding:2px;}
.ep-card .ep-del:hover{color:#ff6b6b;}
.ep-toggle{font-size:10px;color:#666;cursor:pointer;text-align:center;padding:4px;}

.p-btn{position:fixed;bottom:8px;right:8px;background:#4ecdc4;color:#0a0a0a;border:none;width:32px;height:32px;border-radius:50%;font-size:13px;font-weight:700;cursor:pointer;z-index:100;}
.save-ind{position:fixed;top:48px;right:8px;padding:4px 10px;background:#4ecdc4;color:#0a0a0a;border-radius:5px;font-size:10px;font-weight:600;opacity:0;transition:opacity .3s;z-index:200;pointer-events:none;}
.save-ind.show{opacity:1;}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:300;justify-content:center;align-items:center;}
.modal.open{display:flex;}
.modal-box{background:#181818;border:1px solid #2a2a2a;border-radius:12px;padding:24px;max-width:440px;width:90%;}
.modal-box h3{font-size:14px;margin-bottom:10px;}
.mi{width:100%;padding:6px 10px;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:5px;color:#ddd;font-size:12px;margin-bottom:6px;}
.mi:focus{outline:none;border-color:#4ecdc4;}
.mbtn{display:flex;gap:6px;margin-top:10px;}
.mbtn button{padding:6px 14px;border-radius:5px;cursor:pointer;font-size:11px;border:1px solid #2a2a2a;background:#1e1e1e;color:#ddd;}
.mbtn .pri{background:#4ecdc4;color:#0a0a0a;border-color:#4ecdc4;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:#333;border-radius:2px;}
</style>
</head>

<div class="toolbar">
  <h1>면접 마인드맵</h1>
  <button class="tb" onclick="zoomBy(-.1)">−</button>

  <button class="tb" onclick="fitAll()">전체 보기</button>
  <button class="tb" onclick="closeAll()">모두 접기</button>

// STATE
let zoom=.5,panX=0,panY=0,isPan=false,psx=0,psy=0;
let openCats=new Set(); // multiple cats can be open
let activeQ=null;
let pinnedQs=new Set(); // pinned questions stay visible
const CX=4000,CY=4000;

// PERSIST
function load(){const s=localStorage.getItem('imm-v5');if(!s)return;try{const d=JSON.parse(s);if(d.qs)d.qs.forEach(sq=>{const q=QS.find(x=>x.id===sq.id);if(q)Object.assign(q,sq);else QS.push(sq);});if(d.eps)EPS=d.eps;if(d.cats)d.cats.forEach(sc=>{if(!CATS.find(x=>x.id===sc.id))CATS.push(sc);});if(d.pinnedQs)pinnedQs=new Set(d.pinnedQs);}catch(e){}}
function save(){localStorage.setItem('imm-v5',JSON.stringify({qs:QS,eps:EPS,cats:CATS,pinnedQs:[...pinnedQs]}));const el=document.getElementById('sI');el.classList.add('show');setTimeout(()=>el.classList.remove('show'),800);}
let sT;function ds(){clearTimeout(sT);sT=setTimeout(save,500);}

// PAN/ZOOM
const W=document.getElementById('W'),C=document.getElementById('C');
let rafId=null;
function apT(){if(rafId)return;rafId=requestAnimationFrame(()=>{C.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;document.getElementById('zd').textContent=Math.round(zoom*100)+'%';rafId=null;});}

// Mouse wheel zoom
W.addEventListener('wheel',e=>{e.preventDefault();const r=W.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;const oz=zoom;zoom=Math.max(.08,Math.min(3,zoom+(e.deltaY>0?-.05:.05)));panX=mx-(mx-panX)*(zoom/oz);panY=my-(my-panY)*(zoom/oz);apT();},{passive:false});

// Mouse pan
W.addEventListener('mousedown',e=>{if(e.button===0&&(e.target===W||e.target===C||e.target.tagName==='svg')){isPan=true;psx=e.clientX-panX;psy=e.clientY-panY;W.classList.add('grabbing');e.preventDefault();}});
window.addEventListener('mousemove',e=>{if(isPan){panX=e.clientX-psx;panY=e.clientY-psy;apT();}});
window.addEventListener('mouseup',()=>{if(isPan){isPan=false;W.classList.remove('grabbing');}});

// Touch pan/zoom (iPad)
let touches0=null,touchDist0=0,touchZoom0=0,touchPanX0=0,touchPanY0=0;
function getTouchDist(ts){const dx=ts[0].clientX-ts[1].clientX,dy=ts[0].clientY-ts[1].clientY;return Math.sqrt(dx*dx+dy*dy);}
function getTouchMid(ts){return{x:(ts[0].clientX+ts[1].clientX)/2,y:(ts[0].clientY+ts[1].clientY)/2};}

W.addEventListener('touchstart',e=>{
  if(e.target!==W&&e.target!==C&&e.target.tagName!=='svg')return;
  e.preventDefault();
  if(e.touches.length===1){
    isPan=true;psx=e.touches[0].clientX-panX;psy=e.touches[0].clientY-panY;
  }else if(e.touches.length===2){
    isPan=false;
    touchDist0=getTouchDist(e.touches);touchZoom0=zoom;
    const mid=getTouchMid(e.touches);
    touchPanX0=panX;touchPanY0=panY;
    touches0=mid;
  }
},{passive:false});

W.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1&&isPan){
    panX=e.touches[0].clientX-psx;panY=e.touches[0].clientY-psy;apT();
  }else if(e.touches.length===2&&touches0){
    const dist=getTouchDist(e.touches);
    const mid=getTouchMid(e.touches);
    const r=W.getBoundingClientRect();
    const mx=touches0.x-r.left,my=touches0.y-r.top;
    const oz=touchZoom0;
    zoom=Math.max(.08,Math.min(3,touchZoom0*(dist/touchDist0)));
    panX=mx-(mx-touchPanX0)*(zoom/oz)+(mid.x-touches0.x);
    panY=my-(my-touchPanY0)*(zoom/oz)+(mid.y-touches0.y);
    apT();
  }
},{passive:false});

W.addEventListener('touchend',e=>{isPan=false;touches0=null;},{passive:false});

function zoomBy(d){zoom=Math.max(.08,Math.min(3,zoom+d));apT();}
function fitAll(){const wr=W.getBoundingClientRect();zoom=Math.min(wr.width/3200,wr.height/3200,.55);panX=wr.width/2-CX*zoom;panY=wr.height/2-CY*zoom;apT();}
function closeAll(){openCats.clear();activeQ=null;render();}
function unpinAll(){pinnedQs.clear();ds();render();}

// LAYOUT + RENDER
let renderRAF=null;
function scheduleRender(){if(renderRAF)return;renderRAF=requestAnimationFrame(()=>{renderRAF=null;render();});}

function render(){
  const svg=document.getElementById('SVG');
  let paths='';
  // Remove old nodes efficiently
  const oldNodes=C.querySelectorAll('.nd');
  for(let i=oldNodes.length-1;i>=0;i--)oldNodes[i].remove();

  // Root
  mk('nd nd-root',CX,CY,'면접 마인드맵',()=>{openCats.clear();activeQ=null;render();});

  const catR=420;
  CATS.forEach((cat,ci)=>{
    const ang=(ci/CATS.length)*Math.PI*2-Math.PI/2;
    const cx=CX+Math.cos(ang)*catR;
    const cy=CY+Math.sin(ang)*catR;
    const isOpen=openCats.has(cat.id);
    const qCnt=QS.filter(q=>q.cat===cat.id).length;

    const catEl=mk('nd nd-cat'+(isOpen?' open':''),cx,cy,
      `${cat.icon} ${cat.name} <span class="cc">${qCnt}</span>`,
      ()=>{if(isOpen)openCats.delete(cat.id);else openCats.add(cat.id);activeQ=null;render();});
    catEl.style.background=isOpen?cat.color+'28':cat.color+'10';
    catEl.style.borderColor=isOpen?cat.color:cat.color+'44';
    catEl.style.color=cat.color;
    paths+=line(CX,CY,cx,cy,cat.color,isOpen?3:1.5,isOpen?.5:.15);

    if(!isOpen)return;

    const qs=QS.filter(q=>q.cat===cat.id);
    const isRight=Math.cos(ang)>=0;
    const qColX=cx+Math.cos(ang)*250;
    const qStartY=cy-(qs.length-1)*40;

    qs.forEach((q,qi)=>{
      const qx=qColX;
      const qy=qStartY+qi*80;
      const isAct=activeQ===q.id;
      const isPinned=pinnedQs.has(q.id);
      const showScript=isAct||isPinned;

      // Question node
      let qCls='nd nd-q';
      if(isPinned)qCls+=' pinned';
      if(isAct)qCls+=' active';

      const qEl=mk(qCls,qx,qy,
        `<span class="pin-icon">${isPinned?'📌':''}</span>`+
        q.q+(q.kw?`<div class="qkw">${q.kw}</div>`:''),
        ()=>{
          // Single click: toggle active
          if(activeQ===q.id)activeQ=null;
          else activeQ=q.id;
          render();
        });

      // Long press / double-tap to pin
      let longTimer=null;
      const startPin=()=>{longTimer=setTimeout(()=>{togglePin(q.id);longTimer=null;},500);};
      const cancelPin=()=>{if(longTimer){clearTimeout(longTimer);longTimer=null;}};
      qEl.addEventListener('touchstart',startPin,{passive:true});
      qEl.addEventListener('touchend',cancelPin,{passive:true});
      qEl.addEventListener('touchmove',cancelPin,{passive:true});
      qEl.addEventListener('dblclick',e=>{e.stopPropagation();togglePin(q.id);});

      paths+=line(cx,cy,qx,qy,cat.color,1,.2);

      // Show full script panel if active or pinned
      if(showScript){
        const brDir=isRight?1:-1;
        const scriptX=qx+brDir*360;
        const scriptY=qy;
        const scriptEl=mkScript(scriptX,scriptY,q,cat.color);
        paths+=line(qx,qy,scriptX,scriptY,isPinned?'#ff9f43':cat.color,1.5,.4);
      }
    });
  });

  svg.innerHTML=paths;
  renderEps();
}

function togglePin(qid){
  if(pinnedQs.has(qid))pinnedQs.delete(qid);
  else pinnedQs.add(qid);
  ds();
  render();
}

function mk(cls,x,y,html,onclick){
  const el=document.createElement('div');el.className=cls;
  el.style.left=x+'px';el.style.top=y+'px';
  el.innerHTML=html;
  if(onclick){
    el.onclick=e=>{e.stopPropagation();onclick();};
    el.ontouchend=e=>{/* allow click to handle */};
  }
  C.appendChild(el);return el;
}

// Full script panel — shows ALL content inline
function mkScript(x,y,q,catColor){
  const el=document.createElement('div');
  el.className='nd nd-script';
  el.style.left=x+'px';el.style.top=y+'px';
  el.onclick=e=>e.stopPropagation();
  el.onmousedown=e=>e.stopPropagation();
  el.ontouchstart=e=>e.stopPropagation();

  let html='';

  // Pin/unpin button at top
  const isPinned=pinnedQs.has(q.id);
  html+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">`;
  html+=`<span style="font-size:13px;font-weight:600;color:${catColor}">${q.q}</span>`;
  html+=`<button class="scr-add" style="border-color:${isPinned?'#ff9f43':'#333'};color:${isPinned?'#ff9f43':'#555'}" data-action="pin">${isPinned?'📌 핀 해제':'📌 핀 고정'}</button>`;
  html+=`</div>`;

  // Mindmap branches (value/success/fail/why/method)
  BINFO.forEach(b=>{
    if(q.mindmap[b.key]===undefined)return;
    html+=`<div class="scr-section">`;
    html+=`<div class="scr-label ${b.cls}">${b.label}</div>`;
    html+=`<div class="scr-text" contenteditable="true" data-ph="${b.ph}" data-bkey="${b.key}">${escHtml(q.mindmap[b.key]||'')}</div>`;
    html+=`</div>`;
  });

  // Answers — full text
  if(q.answers.length>0){
    html+=`<div class="scr-section">`;
    html+=`<div class="scr-label lbl-answer">답변</div>`;
    q.answers.forEach((a,ai)=>{
      html+=`<div class="scr-ans" data-ai="${ai}">`;
      html+=`<span class="scr-ans-num">${ai+1}</span>`;
      html+=`<div class="scr-ans-text" contenteditable="true" data-ai="${ai}">${escHtml(a)}</div>`;
      html+=`<button class="scr-del" data-ai="${ai}">✕</button>`;
      html+=`</div>`;
    });
    html+=`</div>`;
  }

  // Tail question
  if(q.tail){
    html+=`<div class="scr-section">`;
    html+=`<div class="scr-label lbl-tail">꼬리질문</div>`;
    html+=`<div class="scr-text" contenteditable="true" data-ph="꼬리질문..." data-field="tail">${escHtml(q.tail)}</div>`;
    html+=`</div>`;
  }

  // Add buttons
  html+=`<div class="scr-add-row">`;
  BINFO.forEach(b=>{
    if(q.mindmap[b.key]!==undefined)return;
    html+=`<button class="scr-add" style="color:${b.color};border-color:${b.color}55" data-addkey="${b.key}">+${b.label}</button>`;
  });
  html+=`<button class="scr-add" data-action="add-answer">+ 답변</button>`;
  if(!q.tail)html+=`<button class="scr-add" data-action="add-tail">+ 꼬리질문</button>`;
  html+=`</div>`;

  el.innerHTML=html;

  // Event delegation
  el.addEventListener('click',e=>{
    e.stopPropagation();
    const btn=e.target.closest('[data-action],[data-addkey]');
    if(!btn)return;
    if(btn.dataset.action==='pin'){togglePin(q.id);return;}
    if(btn.dataset.action==='add-answer'){q.answers.push('');ds();render();return;}
    if(btn.dataset.action==='add-tail'){q.tail='';ds();render();return;}
    if(btn.dataset.addkey){q.mindmap[btn.dataset.addkey]='';ds();render();return;}
  });

  // Delete answer buttons
  el.addEventListener('click',e=>{
    const del=e.target.closest('.scr-del');
    if(!del)return;
    e.stopPropagation();
    const ai=parseInt(del.dataset.ai);
    q.answers.splice(ai,1);ds();render();
  });

  // Content editable handlers
  el.querySelectorAll('.scr-text[data-bkey]').forEach(tx=>{
    tx.oninput=()=>{q.mindmap[tx.dataset.bkey]=tx.textContent;ds();};
  });
  el.querySelectorAll('.scr-text[data-field="tail"]').forEach(tx=>{
    tx.oninput=()=>{q.tail=tx.textContent;ds();};
  });
  el.querySelectorAll('.scr-ans-text').forEach(tx=>{
    tx.oninput=()=>{q.answers[parseInt(tx.dataset.ai)]=tx.textContent;ds();};
  });

  C.appendChild(el);return el;
}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function line(x1,y1,x2,y2,color,w,op){
  const mx=(x1+x2)/2,my=(y1+y2)/2;
  const dx=x2-x1,dy=y2-y1;
  const cx=mx-dy*.08,cy=my+dx*.08;
  return`<path d="M${x1},${y1} Q${cx},${cy} ${x2},${y2}" stroke="${color}" stroke-width="${w}" fill="none" opacity="${op}"/>`;
}

// EPS
function getLinkedQs(ep){
  const tag=ep.tag.toLowerCase();
  return QS.filter(q=>{
    const kw=(q.kw||'').toLowerCase();
    const ans=q.answers.join(' ').toLowerCase();
    const mm=Object.values(q.mindmap||{}).join(' ').toLowerCase();
    return kw.includes(tag)||ans.includes(tag)||mm.includes(tag);
  });
}

function renderEps(){
  const c=document.getElementById('epT');c.innerHTML='';
  // Sort by linked question count descending
  const sorted=[...EPS].map(ep=>({ep,qs:getLinkedQs(ep)})).sort((a,b)=>b.qs.length-a.qs.length);

  sorted.forEach(({ep,qs})=>{
    const card=document.createElement('div');card.className='ep-card';
    let html=`<div class="ep-top">`;
    html+=`<div><span class="ep-tag">${ep.tag}</span><span class="ep-desc">${ep.desc}</span></div>`;
    html+=`<div style="display:flex;align-items:center;gap:4px;"><span class="ep-cnt">${qs.length}회</span><button class="ep-del" data-epid="${ep.id}" title="삭제">✕</button></div>`;
    html+=`</div>`;

    // Org tags
    html+=`<div class="ep-orgs">`;
    (ep.orgs||[]).forEach((org,oi)=>{
      html+=`<span class="ep-org" data-epid="${ep.id}" data-oi="${oi}" title="클릭하여 삭제">${org}</span>`;
    });
    html+=`<button class="ep-org-add" data-epid="${ep.id}" data-action="add-org">+ 기관</button>`;
    html+=`</div>`;

    // Linked questions — ALWAYS show all
    html+=`<div class="ep-qs">`;
    if(qs.length===0){
      html+=`<div style="font-size:10px;color:#555;padding:4px 0;">연결된 질문 없음</div>`;
    }else{
      qs.forEach(q=>{
        const cat=CATS.find(ct=>ct.id===q.cat);
        const dotColor=cat?cat.color:'#666';
        const catName=cat?cat.name:'';
        html+=`<div class="ep-qitem" data-qid="${q.id}" data-catid="${q.cat}">`;
        html+=`<span class="ep-qdot" style="background:${dotColor}"></span>`;
        html+=`<div>${q.q}<div class="ep-qcat">${catName}</div></div>`;
        html+=`</div>`;
      });
    }
    html+=`</div>`;

    card.innerHTML=html;

    // Click question → navigate to it
    card.querySelectorAll('.ep-qitem').forEach(item=>{
      item.onclick=()=>{
        const qid=item.dataset.qid;
        const catid=item.dataset.catid;
        openCats.add(catid);
        activeQ=qid;
        render();
      };
    });

    // Delete episode
    card.querySelector('.ep-del').onclick=e=>{
      e.stopPropagation();
      if(confirm(`"${ep.tag}" 에피소드를 삭제하시겠습니까?`)){
        const idx=EPS.findIndex(x=>x.id===ep.id);
        if(idx>=0)EPS.splice(idx,1);
        save();renderEps();
      }
    };

    // Delete org tag
    card.querySelectorAll('.ep-org').forEach(orgEl=>{
      orgEl.onclick=e=>{
        e.stopPropagation();
        const oi=parseInt(orgEl.dataset.oi);
        ep.orgs.splice(oi,1);
        save();renderEps();
      };
    });

    // Add org tag
    card.querySelector('[data-action="add-org"]').onclick=e=>{
      e.stopPropagation();
      const org=prompt('기관명 입력 (예: 신보, 부동산원, 서금원)');
      if(org&&org.trim()){
        if(!ep.orgs)ep.orgs=[];
        ep.orgs.push(org.trim());
        save();renderEps();
      }
    };

    c.appendChild(card);
  });
}

let epCollapsed=false;
function toggleEpPanel(){
  epCollapsed=!epCollapsed;
  const panel=document.getElementById('epPanel');
  const list=document.getElementById('epT');
  const btn=document.getElementById('epToggle');
  if(epCollapsed){
    list.style.display='none';
    panel.classList.add('collapsed');
    btn.textContent='▲';
  }else{
    list.style.display='';
    panel.classList.remove('collapsed');
    btn.textContent='▼';
  }
}

function openEpAdd(){const m=document.getElementById('M1'),c=document.getElementById('MC1');c.innerHTML=`<h3 style="color:#c49bff">에피소드 추가</h3><input class="mi" id="et" placeholder="태그 (예: 서브웨이)"><input class="mi" id="ed" placeholder="설명 (예: 등록금 알바)"><input class="mi" id="eo" placeholder="기관 (쉼표 구분, 예: 신보,부동산원)"><div class="mbtn"><button onclick="document.getElementById('M1').classList.remove('open')">취소</button><button class="pri" onclick="const orgs=document.getElementById('eo').value.split(',').map(s=>s.trim()).filter(Boolean);EPS.push({id:'ep_'+Date.now(),tag:document.getElementById('et').value,desc:document.getElementById('ed').value,orgs:orgs});save();renderEps();document.getElementById('M1').classList.remove('open');">추가</button></div>`;m.classList.add('open');}
function openAddCat(){const m=document.getElementById('M1'),c=document.getElementById('MC1');const colors=['#4a9eff','#a78bfa','#f97316','#06b6d4','#ec4899','#14b8a6','#8b5cf6','#eab308','#ef4444','#f59e0b','#6366f1','#10b981','#e11d48','#0ea5e9','#84cc16'];const cSel=colors.map(cl=>`<span style="display:inline-block;width:24px;height:24px;border-radius:50%;background:${cl};cursor:pointer;border:2px solid transparent;margin:2px;" data-c="${cl}" onclick="this.parentNode.querySelectorAll('span').forEach(s=>s.style.borderColor='transparent');this.style.borderColor='#fff';document.getElementById('catCol').value='${cl}'"></span>`).join('');c.innerHTML=`<h3 style="color:#4ecdc4">카테고리 추가</h3><input class="mi" id="catName" placeholder="카테고리 이름 (예: 서금원)"><input class="mi" id="catIcon" placeholder="아이콘 이모지 (예: 🏛️)"><input type="hidden" id="catCol" value="${colors[0]}"><div style="margin:8px 0">${cSel}</div><div class="mbtn"><button onclick="document.getElementById('M1').classList.remove('open')">취소</button><button class="pri" onclick="const nm=document.getElementById('catName').value.trim();if(!nm){alert('이름을 입력하세요');return;}CATS.push({id:'cc_'+Date.now(),name:nm,icon:document.getElementById('catIcon').value||'📌',color:document.getElementById('catCol').value});save();render();document.getElementById('M1').classList.remove('open');">추가</button></div>`;m.classList.add('open');}
function openAddQ(){const m=document.getElementById('M1'),c=document.getElementById('MC1');c.innerHTML=`<h3>질문 추가</h3><select class="mi" id="ac">${CATS.map(ct=>`<option value="${ct.id}">${ct.icon} ${ct.name}</option>`).join('')}</select><input class="mi" id="aq" placeholder="질문"><input class="mi" id="ak" placeholder="키워드"><div class="mbtn"><button onclick="document.getElementById('M1').classList.remove('open')">취소</button><button class="pri" onclick="QS.push({id:'cq_'+Date.now(),cat:document.getElementById('ac').value,q:document.getElementById('aq').value,kw:document.getElementById('ak').value,answers:[],tail:'',mindmap:mm0()});save();openCats.add(document.getElementById('ac').value);render();document.getElementById('M1').classList.remove('open');">추가</button></div>`;m.classList.add('open');}
function doSearch(v){if(!v.trim()){activeQ=null;render();return;}const t=v.toLowerCase();const f=QS.find(q=>q.q.toLowerCase().includes(t)||q.kw?.toLowerCase().includes(t));if(f){openCats.add(f.cat);activeQ=f.id;render();}}
function xport(){const b=new Blob([JSON.stringify({questions:QS,episodes:EPS,categories:CATS,pinnedQs:[...pinnedQs]},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='interview-mindmap.json';a.click();}
function impJ(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.questions){QS.length=0;d.questions.forEach(q=>QS.push(q));}if(d.episodes)EPS=d.episodes;if(d.categories){CATS.length=0;d.categories.forEach(c=>CATS.push(c));}if(d.pinnedQs)pinnedQs=new Set(d.pinnedQs);save();render();}catch(err){alert('오류');}};r.readAsText(f);}
document.getElementById('M1').onclick=function(e){if(e.target===this)this.classList.remove('open');};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.modal.open').forEach(m=>m.classList.remove('open'));activeQ=null;render();}if(e.ctrlKey&&e.key==='f'){e.preventDefault();document.getElementById('sbox').focus();}});

load();render();setTimeout(fitAll,200);
