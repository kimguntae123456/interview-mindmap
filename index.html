  React.useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    const onClick = (e) => { if (!e.target.closest('.color-popover')) onClose(); };
    window.addEventListener('keydown', onKey);
    setTimeout(() => window.addEventListener('mousedown', onClick), 50);
    setTimeout(() => window.addEventListener('touchstart', onClick), 50);
    return () => {
      window.removeEventListener('keydown', onKey);
      window.removeEventListener('mousedown', onClick);
      window.removeEventListener('touchstart', onClick);
    };
  }, []);
  const W = 240;
  const pos = {
    left: Math.min(x, window.innerWidth - W - 12),
    top: Math.min(y, window.innerHeight - 280),
  };
  return (
    <div className="ctx-menu color-popover" style={{...pos, width:W, padding:10}} onClick={e=>e.stopPropagation()}>
      <div style={{fontSize:10, fontWeight:700, letterSpacing:'0.7px', textTransform:'uppercase', color:'var(--text2)', marginBottom:8}}>색상 선택</div>
      <div style={{display:'grid', gridTemplateColumns:'repeat(6, 1fr)', gap:6, marginBottom:10}}>
        {COLOR_PALETTE.map(c => (
          <button key={c} onClick={()=>{ onPick(c); onClose(); }}
            title={c}
            style={{width:28, height:28, borderRadius:'50%', background:c, cursor:'pointer',
                    border: (current||'').toLowerCase()===c.toLowerCase() ? '2px solid var(--text)' : '1px solid var(--border)',
                    padding:0}} />
        ))}
      </div>
      <div style={{display:'flex', gap:6, alignItems:'center', marginBottom:8}}>
        <input type="color" value={hex} onChange={e=>setHex(e.target.value)}
               style={{width:40, height:32, border:'1px solid var(--border)', borderRadius:6, padding:2, background:'var(--surface)'}} />
        <input type="text" value={hex} onChange={e=>setHex(e.target.value)}
               style={{flex:1, border:'1px solid var(--border)', borderRadius:4, padding:'6px 10px', fontSize:12, fontFamily:'Geist Mono, ui-monospace, Menlo, monospace', outline:'none', background:'var(--surface)', color:'var(--text)'}} />
        <button className="btn primary" style={{padding:'5px 10px', fontSize:11}} onClick={()=>{ onPick(hex); onClose(); }}>적용</button>
      </div>
      <div className="ctx-sep"></div>
      <div className="ctx-item" onClick={()=>{ onPick(null); onClose(); }}>↺ 기본 색상으로</div>
    </div>
  );
}

// ─── ThemeToggle ───
function ThemeToggle() {
  const [theme, setTheme] = React.useState(() => (window.MMTheme ? MMTheme.get() : 'light'));
  React.useEffect(() => {
    const onChange = (e) => setTheme(e.detail);
    window.addEventListener('mm-theme-change', onChange);
    return () => window.removeEventListener('mm-theme-change', onChange);
  }, []);
  const isDark = theme === 'dark';
  return (
    <button className="theme-toggle" title={isDark ? '라이트 모드로 전환' : '다크 모드로 전환'}
            onClick={() => MMTheme.toggle()} aria-label="테마 전환">
      {isDark ? '☾' : '☀'}
    </button>
  );
}

// ─── ChildCardsBlock — 리스트뷰에서 마인드맵 답변/꼬리질문 카드 표시 ───
const CHILD_TYPE_LABEL = { answer: '답변', tail: '꼬리질문', why: '왜?', opinion: '의견' };
const CHILD_TYPE_ORDER = ['tail', 'answer', 'why', 'opinion'];
function ChildCardsBlock({ q, state }) {
  const children = (state.customNodes || []).filter(n => n.type === 'answer' && (n.rootQId === q.id || n.parentId === q.id));
  const updateChild = (id, mut) => MMStore.update(s => {
    const c = s.customNodes.find(x => x.id === id); if (c) mut(c);
  });
  const removeChild = (id) => MMStore.update(s => {
    s.customNodes = s.customNodes.filter(x => x.id !== id);
    s.customEdges = (s.customEdges || []).filter(e => e.from !== id && e.to !== id);
  });
  const addChild = (kind) => {
    const cat = MM_DATA.categories.find(c => c.id === q.cat);
    const color = cat ? cat.color : '#0071e3';
    MMStore.update(s => {
      s.customNodes.push({ id: 'ans_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), type: 'answer', nodeType: kind, parentId: q.id, rootQId: q.id, label: '', color });
    });
  };
  const hasTail = !!(q.tail && q.tail.trim());
  return (
    <div className="qc-children">
      <div className="qc-children-head">
        <span>꼬리질문 · 연관 답변</span>
        <span style={{fontWeight:500, opacity:0.7}}>{children.length + (hasTail?1:0)}개</span>
      </div>
      <div className="qc-child-list">
        {hasTail && (
          <div className="qc-child-card" style={{borderLeftColor:'#ff9500'}}>
            <span className="qc-child-badge t-tail">예상 꼬리</span>
            <MentionTextarea className="qc-child-text" value={q.tail || ''} autoResize
                             placeholder="예상 꼬리질문..."
                             onChange={e=>MMStore.update(s=>{const qq=s.questions.find(x=>x.id===q.id); if(qq)qq.tail=e.target.value;})} />
            <button className="qc-child-del" title="꼬리질문 비우기" onClick={()=>MMStore.update(s=>{const qq=s.questions.find(x=>x.id===q.id); if(qq)qq.tail='';})}>×</button>
          </div>
        )}
        {children.length === 0 && !hasTail && (
          <div className="qc-child-empty">아직 연결된 답변/꼬리질문이 없습니다. 아래 버튼으로 추가하거나 마인드맵에서 + 가지를 만들어 보세요.</div>
        )}
        {children.map(cn => {
          const kind = cn.nodeType || 'answer';
          const accent = cn.color || '#0071e3';
          return (
            <div className="qc-child-card" key={cn.id} style={{borderLeftColor: accent}}>
              <span className={"qc-child-badge t-" + kind}>{CHILD_TYPE_LABEL[kind] || '답변'}</span>
              <MentionTextarea className="qc-child-text" value={cn.label || ''} autoResize
                               placeholder={(CHILD_TYPE_LABEL[kind]||'답변')+' 내용...'}
                               onChange={e=>updateChild(cn.id, c=>c.label=e.target.value)} />
              <button className="qc-child-del" title="삭제" onClick={()=>{ if(confirm('이 카드를 삭제할까요?')) removeChild(cn.id); }}>×</button>
            </div>
          );
        })}
      </div>
      <div className="qc-child-add">
        {CHILD_TYPE_ORDER.map(t => (
          <button key={t} onClick={()=>addChild(t)}>+ {CHILD_TYPE_LABEL[t]}</button>
        ))}
      </div>
    </div>
  );
}

// ─── 새롭게 바뀐 TableView (카드형 UI) ───
function TableView() {
  const [state, setState] = React.useState(MMStore.get());
  const [filter, setFilter] = React.useState('');
  const [catFilter, setCatFilter] = React.useState('all');
  const [adding, setAdding] = React.useState(false);
  const [newRow, setNewRow] = React.useState({ cat: 'c1', q: '', kw: '' });
  const [colorPicker, setColorPicker] = React.useState(null);
  const [addingCat, setAddingCat] = React.useState(false);
  const [newCat, setNewCat] = React.useState({ name: '', color: '#4a9eff' });
  const catColor = (id) => (state.catColors||{})[id] || MM_DATA.categories.find(c => c.id === id)?.color || '#999';

  React.useEffect(() => MMStore.subscribe(s => setState({...s})), []);

  const filtered = React.useMemo(() => {
    let qs = state.questions;
    if (catFilter !== 'all') qs = qs.filter(q => q.cat === catFilter);
    if (filter.trim()) {
      const t = filter.toLowerCase();
      qs = qs.filter(q =>
        q.q.toLowerCase().includes(t) ||
        (q.kw && q.kw.toLowerCase().includes(t)) ||
        q.answers.some(a => a && a.toLowerCase().includes(t)) ||
        ((q.scripts || []).some(sc => sc.content && sc.content.toLowerCase().includes(t))) ||
        (q.fullAnswer && q.fullAnswer.toLowerCase().includes(t))
      );
    }
    // 중요도 높은 질문을 최상단으로 정렬
    return [...qs].sort((a,b) => (b.priority==='high'?1:0) - (a.priority==='high'?1:0));
  }, [state.questions, catFilter, filter]);

  const update = (id, mut) => MMStore.update(s => {
    const q = s.questions.find(x => x.id === id); if (q) mut(q);
  });

  const addRow = () => {
    if (!newRow.q.trim()) return;
    MMStore.update(s => {
      s.questions.push({ id:'q_'+Date.now(), cat:newRow.cat, q:newRow.q, kw:newRow.kw, answers:[], tail:'', fullAnswer:'', scripts:[{ id:'sc_'+Date.now().toString(36), title:'기본 대본', content:'' }], priority:'normal' });
    });
    setNewRow({ cat:'c1', q:'', kw:'' }); setAdding(false);
  };

  const tabSwitch = (tab) => { window.location.hash = '#' + tab; };

  const totalQ = state.questions.length;
  const hasScript = (q) => (q.scripts || []).some(s => s.content && s.content.trim()) || !!q.fullAnswer;
  const filledQ = state.questions.filter(q => q.answers.length > 0 || hasScript(q)).length;

  return (
    <>
      <div className="topbar">
        <div className="brand">면접 마인드맵</div>
        <div className="tabs">
          <button className="tab" onClick={()=>tabSwitch('mindmap')}>마인드맵</button>
          <button className="tab active">리스트 뷰</button>
          <button className="tab" onClick={()=>tabSwitch('episode')}>에피소드 관리</button>
          <button className="tab" onClick={()=>tabSwitch('experience')}>경험 관리</button>
        </div>
        <div className="tb-spacer"></div>
        <SyncIndicator />
        <ThemeToggle />
      </div>
      
      <div className="table-wrap">
        <div className="tbl-toolbar">
          <input className="search" placeholder="질문, 키워드, 대본 검색..." value={filter} onChange={e=>setFilter(e.target.value)} style={{width:240}} />
          <div className="filter-chip-group">
            <button className={"filter-chip" + (catFilter==='all'?' active':'')} onClick={()=>setCatFilter('all')}>전체</button>
            {MM_DATA.categories.map(c => (
              <button key={c.id} className={"filter-chip" + (catFilter===c.id?' active':'')}
                      onClick={()=>setCatFilter(catFilter===c.id?'all':c.id)}
                      onContextMenu={e=>{e.preventDefault();if(confirm(c.name+' 카테고리를 삭제할까요? (소속 질문은 유지됩니다)')){MM_DATA.categories.splice(MM_DATA.categories.indexOf(c),1);MMStore.update(s=>{});setState({...MMStore.get()});}}}>
                <span className="dot" style={{background:c.color}}></span>
                {c.name}
                <span className="cnt">{state.questions.filter(q=>q.cat===c.id).length}</span>
              </button>
            ))}
            {addingCat ? (
              <span style={{display:'inline-flex',gap:4,alignItems:'center'}}>
                <input style={{padding:'4px 8px',borderRadius:20,border:'1px solid var(--border)',background:'var(--surface)',color:'var(--text)',fontSize:12,width:100}} placeholder="이름" value={newCat.name} onChange={e=>setNewCat({...newCat,name:e.target.value})} onKeyDown={e=>{if(e.key==='Enter'){const nm=newCat.name.trim();if(!nm)return;MM_DATA.categories.push({id:'cc_'+Date.now(),name:nm,color:newCat.color});MMStore.update(s=>{});setNewCat({name:'',color:'#4a9eff'});setAddingCat(false);setState({...MMStore.get()});}}} autoFocus />
                <input type="color" value={newCat.color} onChange={e=>setNewCat({...newCat,color:e.target.value})} style={{width:24,height:24,border:'none',padding:0,cursor:'pointer',borderRadius:4}} />
                <button className="filter-chip" onClick={()=>{const nm=newCat.name.trim();if(!nm)return;MM_DATA.categories.push({id:'cc_'+Date.now(),name:nm,color:newCat.color});MMStore.update(s=>{});setNewCat({name:'',color:'#4a9eff'});setAddingCat(false);setState({...MMStore.get()});}}>확인</button>
                <button className="filter-chip" onClick={()=>setAddingCat(false)}>취소</button>
              </span>
            ) : (
              <button className="filter-chip" onClick={()=>setAddingCat(true)} style={{borderStyle:'dashed',opacity:0.6}}>+ 카테고리</button>
            )}
          </div>
          <div className="tbl-stats">{filledQ}/{totalQ} 완료</div>
        </div>

        {adding && (
          <div className="add-row-form" style={{background:'var(--surface)', padding:16, borderRadius:16, border:'1px solid var(--border)'}}>
            <select value={newRow.cat} onChange={e=>setNewRow({...newRow,cat:e.target.value})}>
              {MM_DATA.categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
            <input placeholder="새로운 면접 질문 입력..." value={newRow.q} onChange={e=>setNewRow({...newRow,q:e.target.value})}
                   onKeyDown={e=>{if(e.key==='Enter')addRow();}} autoFocus />
            <button className="btn primary" onClick={addRow}>추가</button>
            <button className="btn ghost" onClick={()=>setAdding(false)}>취소</button>
          </div>
        )}

        {/* ── 카드 리스트 렌더링 영역 ── */}
        <div className="q-card-list">
          {filtered.map(q => {
            const isHigh = q.priority === 'high';
            
            return (
              <div key={q.id} className={`q-card ${isHigh ? 'priority-high' : ''}`}
                   style={q.color ? { borderLeft: '4px solid ' + q.color } : null}>

                {/* 1. 카드 헤더 */}
                <div className="q-card-head">
                  <span className="qc-id">{q.id.toUpperCase()}</span>
                  <button className="qc-cat-dot" title="카테고리 색상 변경"
                    style={{background: catColor(q.cat), border:'none', cursor:'pointer'}}
                    onClick={(e)=>{ const r=e.currentTarget.getBoundingClientRect(); setColorPicker({ x:r.left, y:r.bottom+6, target:{type:'cat', id:q.cat}, current: catColor(q.cat) }); }} />
                  <select className="qc-cat" value={q.cat} onChange={e=>update(q.id, qq=>qq.cat=e.target.value)}>
                    {MM_DATA.categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                  </select>
                  <button className="qc-cat-dot" title="이 질문 색상 변경"
                    style={{background: q.color || 'transparent', border:'1px dashed var(--border)', cursor:'pointer'}}
                    onClick={(e)=>{ const r=e.currentTarget.getBoundingClientRect(); setColorPicker({ x:r.left, y:r.bottom+6, target:{type:'q', id:q.id}, current: q.color || catColor(q.cat) }); }} />

                  <select className="qc-prio" data-prio={q.priority} value={q.priority} onChange={e=>update(q.id, qq=>qq.priority=e.target.value)}>
                    <option value="low">중요도 · 낮음</option>
                    <option value="normal">중요도 · 보통</option>
                    <option value="high">★ 핵심 질문</option>
                  </select>
                  <button className="qc-del" title="삭제" onClick={()=>{if(confirm('이 면접 질문을 완전히 삭제하시겠습니까?'))MMStore.update(s=>{s.questions=s.questions.filter(x=>x.id!==q.id); if(!Array.isArray(s.deletedQuestions)) s.deletedQuestions=[]; if(!s.deletedQuestions.includes(q.id)) s.deletedQuestions.push(q.id);});}}>×</button>
                </div>

                {/* 2. 질문 텍스트 */}
                <div className="qc-question" contentEditable suppressContentEditableWarning
                     data-empty={!q.q}
                     onBlur={e=>update(q.id, qq=>qq.q=e.currentTarget.textContent)}>{q.q}</div>

                {/* 3. 답변 작성 패널 (Grid) */}
                <div className="q-card-body">
                  
                  {/* 왼쪽 패널: 키워드 & 개요 */}
                  <div className="qc-left">
                    <div>
                      <div className="qc-label">MAIN KEYWORD</div>
                      <input className="qc-kw-input" placeholder="답변을 관통하는 키워드" 
                             value={q.kw || ''} onChange={e=>update(q.id, qq=>qq.kw=e.target.value)} />
                    </div>
                    
                    <div>
                      <div className="qc-label">요약 (답변 구조)</div>
                      <div className="qc-ans-list">
                        {q.answers.map((a, ai) => (
                          <div className="qc-ans-item" key={ai}>
                            <span className="qc-ans-num">{ai+1}.</span>
                            <MentionTextarea className="qc-ans-input" value={a} placeholder="핵심 내용 요약 (@에피소드)" rows={1}
                                      onChange={e=>update(q.id, qq=>qq.answers[ai]=e.target.value)} />
                            <button className="qc-ans-del" onClick={()=>update(q.id, qq=>qq.answers.splice(ai,1))}>×</button>
                          </div>
                        ))}
                        <button className="qc-ans-add" onClick={()=>update(q.id, qq=>qq.answers.push(''))}>+ 개요 추가</button>
                      </div>
                    </div>
                  </div>

                  {/* 오른쪽 패널: 실전 대본 (다중 버전) */}
                  <div className="qc-right">
                    <div className="qc-label">실전 대본 (FULL SCRIPT)</div>
                    {(q.scripts || []).map((sc, si) => (
                      <div className="qc-script-block" key={sc.id || si}>
                        <div className="qc-script-head">
                          <input className="qc-script-title" value={sc.title || ''} placeholder={'버전 ' + (si+1)}
                                 onChange={e=>update(q.id, qq=>{ qq.scripts[si].title = e.target.value; })} />
                          <span className="qc-script-meta">{(sc.content||'').length}자</span>
                          {q.scripts.length > 1 && (
                            <button className="qc-script-del" title="이 버전 삭제" onClick={()=>{
                              if(!confirm('이 버전을 삭제할까요?')) return;
                              update(q.id, qq=>{ qq.scripts.splice(si,1); if (qq.scripts[0]) qq.fullAnswer = qq.scripts[0].content; });
                            }}>×</button>
                          )}
                        </div>
                        <MentionTextarea className="qc-script" value={sc.content || ''}
                                         placeholder="실제 면접에서 말하듯 대본 작성... (@로 에피소드 멘션)"
                                         onChange={e=>update(q.id, qq=>{
                                           qq.scripts[si].content = e.target.value;
                                           if (si === 0) qq.fullAnswer = e.target.value;
                                         })} />
                      </div>
                    ))}
                    <button className="qc-script-add" onClick={()=>update(q.id, qq=>{
                      qq.scripts = qq.scripts || [];
                      qq.scripts.push({ id: 'sc_'+Date.now().toString(36), title: '버전 ' + (qq.scripts.length+1), content: '' });
                    })}>+ 다른 버전 대본 추가</button>
                  </div>
                </div>

                {/* 4. 꼬리질문 / 답변 / 의견 등 자식 카드 */}
                <ChildCardsBlock q={q} state={state} />

              </div>
            );
          })}
        </div>

        {!adding && (
          <div style={{marginTop:32, textAlign:'center'}}>
            <button className="btn ghost" style={{fontSize:15, padding:'12px 24px', fontWeight:600}} onClick={()=>setAdding(true)}>+ 새 면접 질문 추가</button>
          </div>
        )}
      </div>

      {colorPicker && (
        <ColorPickerPopover x={colorPicker.x} y={colorPicker.y} current={colorPicker.current}
          onPick={(c) => {
            const t = colorPicker.target;
            MMStore.update(s => {
              if (t.type === 'cat') {
                s.catColors = s.catColors || {};
                if (c == null) delete s.catColors[t.id]; else s.catColors[t.id] = c;
              } else if (t.type === 'q') {
                const qq = s.questions.find(x => x.id === t.id);
                if (qq) { if (c == null) delete qq.color; else qq.color = c; }
              }
            });
          }}
          onClose={() => setColorPicker(null)} />
      )}
    </>
  );
}

// ─── EpisodeManagerView (에피소드 관리 탭) ───
const DEFAULT_SUBSECTIONS = [
  { key: 'situation', label: 'Situation', placeholder: '어떤 상황이었나요?' },
  { key: 'action',    label: 'Action',    placeholder: '어떻게 행동했나요?' },
  { key: 'result',    label: 'Result',    placeholder: '결과는 어땠나요?' },
  { key: 'takeaway',  label: 'Takeaway',  placeholder: '무엇을 배웠나요?' },
];
const EP_MODES = [
  { key: 'full', label: '완전형(대본)', placeholder: '실전 면접에서 말하듯 완전한 대본을 작성하세요...' },
  { key: 'brief', label: '축약형', placeholder: '핵심 키워드와 요약만 간결하게...' },
];

function EpisodeCard({ ep, stars, updateEp, removeEp, updateScripts, usageDetail, onDragStart, onDragOver, onDragEnd, onDrop, epCategories }) {
  var star = stars[ep.id] || {};
  var scripts = star.scripts || [
    { id: 'sc_full', label: '완전형(대본)', content: '' },
    { id: 'sc_brief', label: '축약형', content: '' }
  ];
  var usage = usageDetail(ep.tag);
  var expandState = React.useState(false);
  var expanded = expandState[0];
  var setExpanded = expandState[1];

  var updateScript = function(idx, field, val) {
    var newScripts = scripts.map(function(s, i) {
      if (i === idx) { var copy = Object.assign({}, s); copy[field] = val; return copy; }
      return s;
    });
    updateScripts(ep.id, newScripts);
  };

  var removeScript = function(idx) {
    if (scripts.length <= 1) return;
    updateScripts(ep.id, scripts.filter(function(_, i) { return i !== idx; }));
  };

  var addScript = function() {
    var newScripts = scripts.concat([{ id: 'sc_' + Date.now().toString(36), label: '대본 ' + (scripts.length + 1), content: '' }]);
    updateScripts(ep.id, newScripts);
  };

  return (
    <div className="ep-card" draggable="true"
         onDragStart={function(e){ onDragStart(e, ep.id); }}
         onDragOver={function(e){ onDragOver(e, ep.id); }}
         onDragEnd={onDragEnd}
         onDrop={function(e){ onDrop(e, ep.id); }}>
      <div className="ep-card-head">
        <span className="ep-drag-handle" title="드래그하여 순서 변경">⠿</span>
        <input className="ep-emoji-input" value={ep.emoji || ''} placeholder={"\uD83D\uDCCC"}
               onChange={function(e){var v=e.target.value; if([...v].length<=2) updateEp(ep.id, function(x){x.emoji=v;});}} />
        <input className="ep-tag-input" value={ep.tag} placeholder="태그"
               onChange={function(e){updateEp(ep.id, function(x){x.tag=e.target.value;});}} />
        <button className="ep-card-del" title="삭제" onClick={function(){removeEp(ep.id);}}>×</button>
      </div>

      <div style={{display:'flex', gap:6, alignItems:'center'}}>
        <select style={{flex:'0 0 auto', padding:'4px 8px', fontSize:11, border:'1px solid var(--border)', borderRadius:6, background:'var(--surface)', color:'var(--text)', fontFamily:'var(--font)', outline:'none'}}
                value={ep.epCat || ''} onChange={function(e){updateEp(ep.id, function(x){x.epCat=e.target.value;});}}>
          <option value="">미분류</option>
          {(epCategories||[]).map(function(c){ return React.createElement('option', {key:c, value:c}, c); })}
        </select>
        <input className="ep-desc-input" style={{flex:1}} value={ep.desc || ''} placeholder="한줄 설명"
               onChange={function(e){updateEp(ep.id, function(x){x.desc=e.target.value;});}} />
      </div>

      {/* 모든 대본 동시 표시 */}
      <div className="ep-scripts">
        {scripts.map(function(sc, idx) {
          return (
            <div className="ep-script-block" key={sc.id || idx} data-label={sc.label || ''}>
              <div className="ep-script-label">
                <input value={sc.label || ''} placeholder={'대본 ' + (idx+1)}
                       onChange={function(e){ updateScript(idx, 'label', e.target.value); }} />
                <span className="ep-sc-chars">{(sc.content||'').length}자</span>
                {scripts.length > 1 && (
                  <button title="삭제" onClick={function(){ if(confirm('이 대본을 삭제할까요?')) removeScript(idx); }}>×</button>
                )}
              </div>
              <MentionTextarea value={sc.content || ''} placeholder={(sc.label||'대본') + ' 작성...'} autoResize
                               onChange={function(e){ updateScript(idx, 'content', e.target.value); }} />
            </div>
          );
        })}
        <button className="ep-add-script" onClick={addScript}>+ 대본 추가</button>
      </div>

      {/* 사용 횟수 + 질문 pill */}
      <div className="ep-card-foot">
        <span className="ep-usage">{usage.count}회</span>
        {usage.usedIn.length > 0 && (
          <div className="ep-used-pills">
            {usage.usedIn.map(function(uq) {
              var cat = MM_DATA.categories.find(function(c){return c.id===uq.cat;});
              return React.createElement('span', {
                key: uq.id, className: 'ep-used-pill',
                onClick: function(){ window.location.hash='#table'; },
                title: uq.q
              },
                cat && React.createElement('span', {className:'ep-used-dot', style:{background:cat.color}}),
                uq.q
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

function EpisodeManagerView() {
  var stState = React.useState(MMStore.get());
  var state = stState[0]; var setState = stState[1];
  var stStars = React.useState(function() { return MMStars.get(); });
  var stars = stStars[0]; var setStars = stStars[1];
  var stFilter = React.useState('');
  var filter = stFilter[0]; var setFilter = stFilter[1];
  var stCatFilter = React.useState('all');
  var catFilter = stCatFilter[0]; var setCatFilter = stCatFilter[1];
  var stDrag = React.useState(null);
  var dragId = stDrag[0]; var setDragId = stDrag[1];
  var stOver = React.useState(null);
  var overId = stOver[0]; var setOverId = stOver[1];
  var stAddingCat = React.useState(false);
  var addingCat = stAddingCat[0]; var setAddingCat = stAddingCat[1];
  var stNewCat = React.useState('');
  var newCatName = stNewCat[0]; var setNewCatName = stNewCat[1];

  React.useEffect(function() { return MMStore.subscribe(function(s) { setState({...s}); }); }, []);
  React.useEffect(function() { return MMStars.subscribe(function() { setStars(MMStars.get()); }); }, []);

  var tabSwitch = function(tab) { window.location.hash = '#' + tab; };
  var episodes = state.episodes || [];

  // 에피소드 카테고리
  var epCategories = React.useMemo(function() {
    try { return JSON.parse(localStorage.getItem('mm-ep-categories')) || []; } catch(e) { return []; }
  }, [state]);
  var saveEpCats = function(cats) {
    localStorage.setItem('mm-ep-categories', JSON.stringify(cats));
    MMStore.update(function(s){}); // trigger re-render
  };
  var addEpCat = function(name) {
    if (!name.trim()) return;
    var cats = epCategories.slice();
    if (cats.indexOf(name.trim()) < 0) cats.push(name.trim());
    saveEpCats(cats);
  };
  var removeEpCat = function(name) {
    saveEpCats(epCategories.filter(function(c){ return c !== name; }));
  };

  var filtered = React.useMemo(function() {
    var eps = episodes;
    if (catFilter !== 'all') {
      eps = eps.filter(function(ep) {
        if (catFilter === '') return !ep.epCat || ep.epCat === '';
        return ep.epCat === catFilter;
      });
    }
    if (!filter.trim()) return eps;
    var t = filter.toLowerCase();
    return eps.filter(function(ep) {
      if (ep.tag.toLowerCase().includes(t)) return true;
      if (ep.desc && ep.desc.toLowerCase().includes(t)) return true;
      var star = stars[ep.id] || {};
      var scs = star.scripts || [];
      if (scs.some(function(sc) { return (sc.content||'').toLowerCase().includes(t); })) return true;
      if ((star.fullScript||'').toLowerCase().includes(t)) return true;
      if ((star.briefScript||'').toLowerCase().includes(t)) return true;
      return false;
    });
  }, [episodes, filter, stars, catFilter]);

  var usageDetailFn = function(epTag) {
    var t = epTag.trim();
    var mentionPat = '[@' + t + ']';
    var atPat = '@' + t;
    var usedIn = [];
    var allQ = state.questions || [];
    // customNodes(답변 노드)를 질문별로 매핑
    var cnByQ = {};
    (state.customNodes || []).forEach(function(cn) {
      var rootQ = cn.rootQId || cn.parentId;
      if (rootQ) { if (!cnByQ[rootQ]) cnByQ[rootQ] = []; cnByQ[rootQ].push(cn); }
    });
    // @멘션 검색: [@태그] 또는 @태그
    var hasMention = function(text) {
      return text && (text.includes(mentionPat) || text.includes(atPat));
    };
    // plain text 검색: 답변 텍스트에 태그명 포함
    var hasPlainTag = function(text) {
      return text && text.includes(t);
    };
    allQ.forEach(function(q) {
      // 1) customNodes(답변 노드) label에서 @멘션 검색
      var nodes = cnByQ[q.id] || [];
      var found = nodes.some(function(cn) { return hasMention(cn.label); });
      // 2) answers 배열에서 @멘션 검색
      if (!found) found = (q.answers || []).some(function(a) { return hasMention(a); });
      // 3) scripts 내용에서 @멘션 검색
      if (!found) found = (q.scripts || []).some(function(sc) { return sc && hasMention(sc.content); });
      // 4) fullAnswer, tail에서 @멘션 검색
      if (!found) found = hasMention(q.fullAnswer) || hasMention(q.tail);
      // 5) fallback: answers에 태그명 plain text 포함 여부
      if (!found) found = (q.answers || []).some(function(a) { return hasPlainTag(a); });
      // 6) fallback: customNodes label에 태그명 plain text
      if (!found) found = nodes.some(function(cn) { return hasPlainTag(cn.label); });
      if (found) usedIn.push(q);
    });
    return { count: usedIn.length, usedIn: usedIn };
  };

  var updateEp = function(epId, mut) {
    MMStore.update(function(s) { var ep = (s.episodes||[]).find(function(e){return e.id===epId;}); if (ep) mut(ep); });
  };

  var addEp = function() {
    var newId = 'ep_' + Date.now().toString(36);
    MMStore.update(function(s) {
      s.episodes = s.episodes || [];
      s.episodes.push({ id: newId, tag: '새에피소드', desc: '한줄 설명', emoji: '\uD83D\uDCCC', epCat: (catFilter !== 'all' ? catFilter : '') });
    });
    MMStars.setEntry(newId, { scripts: [
      { id: 'sc_full', label: '완전형(대본)', content: '' },
      { id: 'sc_brief', label: '축약형', content: '' }
    ]});
  };

  var removeEp = function(epId) {
    if (!confirm('이 에피소드를 삭제할까요?')) return;
    MMStore.update(function(s) { s.episodes = (s.episodes||[]).filter(function(e){return e.id!==epId;}); });
    MMStars.remove(epId);
  };

  var updateScripts = function(epId, scripts) {
    MMStars.setEntry(epId, { scripts: scripts });
  };

  // drag & drop handlers
  var onDragStart = function(e, id) {
    setDragId(id);
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(function() {
      var el = e.target.closest('.ep-card');
      if (el) el.classList.add('dragging');
    }, 0);
  };
  var onDragOver = function(e, id) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    setOverId(id);
  };
  var onDragEnd = function(e) {
    document.querySelectorAll('.ep-card.dragging').forEach(function(el) { el.classList.remove('dragging'); });
    setDragId(null); setOverId(null);
  };
  var onDrop = function(e, targetId) {
    e.preventDefault();
    if (!dragId || dragId === targetId) { onDragEnd(e); return; }
    MMStore.update(function(s) {
      var eps = s.episodes || [];
      var fromIdx = eps.findIndex(function(x) { return x.id === dragId; });
      var toIdx = eps.findIndex(function(x) { return x.id === targetId; });
      if (fromIdx < 0 || toIdx < 0) return;
      var item = eps.splice(fromIdx, 1)[0];
      eps.splice(toIdx, 0, item);
    });
    onDragEnd(e);
  };

  var totalEp = episodes.length;
  var filledEp = episodes.filter(function(ep) {
    var s = stars[ep.id] || {};
    var scs = s.scripts || [];
    if (scs.some(function(sc) { return (sc.content||'').trim(); })) return true;
    return !!((s.fullScript||'').trim() || (s.briefScript||'').trim());
  }).length;

  return (
    <>
      <div className="topbar">
        <div className="brand">면접 마인드맵</div>
        <div className="tabs">
          <button className="tab" onClick={function(){tabSwitch('mindmap');}}>마인드맵</button>
          <button className="tab" onClick={function(){tabSwitch('table');}}>리스트 뷰</button>
          <button className="tab active">에피소드 관리</button>
          <button className="tab" onClick={function(){tabSwitch('experience');}}>경험 관리</button>
        </div>
        <div className="tb-spacer"></div>
        <SyncIndicator />
        <ThemeToggle />
        <button className="btn primary" onClick={addEp}>+ 새 에피소드</button>
      </div>

      <div className="ep-wrap">
        <div className="ep-toolbar">
          <input className="search" placeholder="태그·설명·내용 검색..." value={filter} onChange={function(e){setFilter(e.target.value);}} style={{width:220}} />
          <div className="ep-stats">{filledEp}/{totalEp} 정리됨</div>
        </div>
        <div style={{display:'flex', gap:6, flexWrap:'wrap', marginBottom:16, alignItems:'center'}}>
          <button className={"filter-chip" + (catFilter==='all'?' active':'')} onClick={function(){setCatFilter('all');}}>전체</button>
          <button className={"filter-chip" + (catFilter===''?' active':'')} onClick={function(){setCatFilter(catFilter===''?'all':'');}}>미분류</button>
          {epCategories.map(function(c) {
            return React.createElement('button', {
              key: c, className: 'filter-chip' + (catFilter===c?' active':''),
              onClick: function(){ setCatFilter(catFilter===c?'all':c); },
              onContextMenu: function(e){ e.preventDefault(); if(confirm(c+' 카테고리를 삭제할까요?')) removeEpCat(c); }
            }, c, React.createElement('span', {className:'cnt'}, episodes.filter(function(ep){return ep.epCat===c;}).length));
          })}
          {addingCat ? React.createElement('span', {style:{display:'inline-flex', gap:4, alignItems:'center'}},
            React.createElement('input', {
              style:{padding:'4px 8px', borderRadius:20, border:'1px solid var(--border)', background:'var(--surface)', color:'var(--text)', fontSize:12, width:100},
              placeholder:'카테고리명', value:newCatName, autoFocus:true,
              onChange:function(e){setNewCatName(e.target.value);},
              onKeyDown:function(e){if(e.key==='Enter'){addEpCat(newCatName);setNewCatName('');setAddingCat(false);} if(e.key==='Escape')setAddingCat(false);}
            }),
            React.createElement('button', {className:'filter-chip', onClick:function(){addEpCat(newCatName);setNewCatName('');setAddingCat(false);}}, '확인'),
            React.createElement('button', {className:'filter-chip', onClick:function(){setAddingCat(false);}}, '취소')
          ) : React.createElement('button', {
            className:'filter-chip', style:{borderStyle:'dashed', opacity:0.6},
            onClick:function(){setAddingCat(true);}
          }, '+ 카테고리')}
        </div>

        <div className="ep-grid">
          {filtered.map(function(ep) {
            return React.createElement(EpisodeCard, {
              key: ep.id, ep: ep, stars: stars,
              updateEp: updateEp, removeEp: removeEp,
              updateScripts: updateScripts,
              usageDetail: usageDetailFn,
              onDragStart: onDragStart, onDragOver: onDragOver,
              onDragEnd: onDragEnd, onDrop: onDrop,
              epCategories: epCategories
            });
          })}
          {filtered.length === 0 && (
            <div style={{textAlign:'center', padding:'40px 0', color:'var(--text3)', fontSize:14, gridColumn:'1/-1'}}>
              조건에 맞는 에피소드가 없습니다.
            </div>
          )}
        </div>
      </div>
    </>
  );
}

// ─── ExperienceManagerView (경험 관리 탭) ───
function ExperienceManagerView() {
  var stState = React.useState(MMStore.get());
  var state = stState[0]; var setState = stState[1];
  var stFilter = React.useState('');
  var filter = stFilter[0]; var setFilter = stFilter[1];
  var stTypeFilter = React.useState('all');
  var typeFilter = stTypeFilter[0]; var setTypeFilter = stTypeFilter[1];
  var stCollapsed = React.useState({});
  var collapsed = stCollapsed[0]; var setCollapsed = stCollapsed[1];

  React.useEffect(function() { return MMStore.subscribe(function(s) { setState({...s}); }); }, []);

  var tabSwitch = function(tab) { window.location.hash = '#' + tab; };
  var experiences = state.experiences || [];

  var updateExp = function(exId, mut) {
    MMStore.update(function(s) {
      var ex = (s.experiences||[]).find(function(e){return e.id===exId;});
      if (ex) mut(ex);
    });
  };

  var addExp = function() {
    var newId = 'ex_' + Date.now().toString(36);
    MMStore.update(function(s) {
      s.experiences = s.experiences || [];
      s.experiences.push({ id: newId, type: '활동', title: '새 경험', period: '', summary: '', body: '', followups: [] });
    });
  };

  var removeExp = function(exId) {
    if (!confirm('이 경험을 삭제할까요?')) return;
    MMStore.update(function(s) { s.experiences = (s.experiences||[]).filter(function(e){return e.id!==exId;}); });
  };

  var addFollowup = function(exId) {
    updateExp(exId, function(ex) {
      ex.followups = ex.followups || [];
      ex.followups.push({ id: 'fu_'+Date.now().toString(36), q: '', a: '' });
    });
  };

  var updateFollowup = function(exId, fuId, field, value) {
    updateExp(exId, function(ex) {
      var fu = (ex.followups||[]).find(function(f){return f.id===fuId;});
      if (fu) fu[field] = value;
    });
  };

  var removeFollowup = function(exId, fuId) {
    updateExp(exId, function(ex) { ex.followups = (ex.followups||[]).filter(function(f){return f.id!==fuId;}); });
  };

  var toggleBody = function(exId) {
    setCollapsed(function(c) { var n = {...c}; n[exId] = !n[exId]; return n; });
  };

  var filtered = React.useMemo(function() {
    var list = experiences;
    if (typeFilter !== 'all') list = list.filter(function(ex){ return ex.type === typeFilter; });
    if (!filter.trim()) return list;
    var t = filter.toLowerCase();
    return list.filter(function(ex) {
      if ((ex.title||'').toLowerCase().includes(t)) return true;
      if ((ex.summary||'').toLowerCase().includes(t)) return true;
      if ((ex.body||'').toLowerCase().includes(t)) return true;
      if ((ex.followups||[]).some(function(f){ return (f.q||'').toLowerCase().includes(t) || (f.a||'').toLowerCase().includes(t); })) return true;
      return false;
    });
  }, [experiences, filter, typeFilter]);

  var totalFu = experiences.reduce(function(s,ex){ return s + (ex.followups||[]).length; }, 0);

  var crossFu = state.crossFollowups || [];

  var addCrossFu = function() {
    MMStore.update(function(s) {
      s.crossFollowups = s.crossFollowups || [];
      s.crossFollowups.push({ id:'cf_'+Date.now().toString(36), q:'', a:'' });
    });
  };
  var updateCrossFu = function(fuId, field, value) {
    MMStore.update(function(s) {
      var fu = (s.crossFollowups||[]).find(function(f){return f.id===fuId;});
      if (fu) fu[field] = value;
    });
  };
  var removeCrossFu = function(fuId) {
    MMStore.update(function(s) { s.crossFollowups = (s.crossFollowups||[]).filter(function(f){return f.id!==fuId;}); });
  };

  var types = ['all', '자소서', '인턴', '활동'];

  // ── 자소서 캔버스 모드 상태 ──
  var stPositions = React.useState(function() {
    try { return JSON.parse(localStorage.getItem('mm-exp-positions')) || {}; } catch(e) { return {}; }
  });
  var positions = stPositions[0]; var setPositions = stPositions[1];
  var stSelected = React.useState(null);
  var selected = stSelected[0]; var setSelected = stSelected[1];
  var dragRef = React.useRef(null);

  var savePositions = function(nextMap) {
    try { localStorage.setItem('mm-exp-positions', JSON.stringify(nextMap)); } catch(e) {}
  };

  var defaultPos = function(idx) { return { x: 40 + (idx % 3) * 320, y: 40 + Math.floor(idx / 3) * 220 }; };

  var startDragKey = function(e, key, fallback) {
    if (e.target.closest('button, input, textarea, .exp-node-open')) return;
    e.preventDefault(); e.stopPropagation();
    var startX = e.clientX, startY = e.clientY;
    var startPos = positions[key] || fallback;
    dragRef.current = { key: key, moved: false, x: startPos.x, y: startPos.y };
    var onMove = function(ev) {
      var dx = ev.clientX - startX, dy = ev.clientY - startY;
      if (!dragRef.current.moved && Math.abs(dx) + Math.abs(dy) > 4) dragRef.current.moved = true;
      var nx = startPos.x + dx, ny = startPos.y + dy;
      dragRef.current.x = nx; dragRef.current.y = ny;
      setPositions(function(p) { var n = Object.assign({}, p); n[key] = { x: nx, y: ny }; return n; });
    };
    var onUp = function() {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      if (dragRef.current && dragRef.current.moved) {
        setPositions(function(p) { savePositions(p); return p; });
      }
      dragRef.current = null;
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  };
  var startNodeDrag = function(e, exId, idx) { startDragKey(e, exId, defaultPos(idx)); };

  var defaultChildPos = function(parentPos, i, total) {
    var angle = (i / Math.max(total,1)) * Math.PI * 2 - Math.PI/2;
    var r = 200;
    return { x: parentPos.x + 140 + Math.cos(angle) * r - 75, y: parentPos.y + 55 + Math.sin(angle) * r - 18 };
  };

  var resetPositions = function() {
    if (!confirm('자소서 노드 위치를 초기화할까요?')) return;
    setPositions({});
    try { localStorage.removeItem('mm-exp-positions'); } catch(e) {}
  };

  var renderExpCard = function(ex) {
    var isCol = !!collapsed[ex.id];
    return (
      <div key={ex.id} className="exp-card" data-exp-id={ex.id}>
        <div className="exp-card-head">
          <span className="exp-type" data-type={ex.type}>{ex.type}</span>
          <input className="exp-title-input" value={ex.title || ''} onChange={function(e){ var v=e.target.value; updateExp(ex.id, function(x){x.title=v;}); }} />
          {ex.period && <span className="exp-period">{ex.period}</span>}
          <button className="exp-card-del" title="삭제" onClick={function(){removeExp(ex.id);}}>×</button>
        </div>
        <input className="exp-summary" placeholder="한 줄 요약 (선택)" value={ex.summary || ''} onChange={function(e){ var v=e.target.value; updateExp(ex.id, function(x){x.summary=v;}); }} style={{fontSize:12, fontFamily:'inherit'}} />
        <div className="exp-section-label">
          <span>자소서 본문 / 경험 내용</span>
          <button className="exp-toggle" onClick={function(){toggleBody(ex.id);}}>{isCol ? '펼치기' : '접기'}</button>
        </div>
        {!isCol && (
          <div className="exp-body" contentEditable suppressContentEditableWarning
            onBlur={function(e){ var v=e.currentTarget.innerText; updateExp(ex.id, function(x){x.body=v;}); }}>{ex.body || ''}</div>
        )}
        <div className="exp-section-label">
          <span>예상 꼬리질문</span>
          <span className="exp-fu-count">{(ex.followups||[]).length}</span>
        </div>
        <div className="exp-fu-list">
          {(ex.followups||[]).map(function(fu){ return (
            <div key={fu.id} className="exp-fu-item">
              <input className="exp-fu-q" placeholder="Q. 예상되는 꼬리질문" value={fu.q || ''} onChange={function(e){ updateFollowup(ex.id, fu.id, 'q', e.target.value); }} />
              <textarea className="exp-fu-a" placeholder="A. 답변 메모 (선택)" value={fu.a || ''} rows={2}
                onChange={function(e){ updateFollowup(ex.id, fu.id, 'a', e.target.value); var el=e.target; el.style.height='auto'; el.style.height=el.scrollHeight+'px'; }}
                ref={function(el){ if(el){ el.style.height='auto'; el.style.height=el.scrollHeight+'px'; } }} />
              <button className="exp-fu-del" title="삭제" onClick={function(){removeFollowup(ex.id, fu.id);}}>×</button>
            </div>
          ); })}
          <button className="exp-add-fu" onClick={function(){addFollowup(ex.id);}}>+ 꼬리질문 추가</button>
        </div>
      </div>
    );
  };

  var selectedEx = selected ? experiences.find(function(e){return e.id===selected;}) : null;

  return (
    <>
      <div className="topbar">
        <div className="brand">면접 마인드맵</div>
        <div className="tabs">
          <button className="tab" onClick={function(){tabSwitch('mindmap');}}>마인드맵</button>
          <button className="tab" onClick={function(){tabSwitch('table');}}>리스트 뷰</button>
          <button className="tab" onClick={function(){tabSwitch('episode');}}>에피소드 관리</button>
          <button className="tab active">경험 관리</button>
        </div>
        <div className="tb-spacer"></div>
        <SyncIndicator />
        <ThemeToggle />
        <button className="btn primary" onClick={addExp}>+ 새 경험</button>
      </div>

      <div className="exp-wrap">
        <div className="exp-toolbar">
          <input className="search" style={{maxWidth:300}} placeholder="제목·본문·꼬리질문 검색..." value={filter} onChange={function(e){setFilter(e.target.value);}} />
          <div className="tabs" style={{gap:4}}>
            {types.map(function(t){ return (
              <button key={t} className={'tab' + (typeFilter===t?' active':'')} style={{padding:'4px 10px',fontSize:11}} onClick={function(){setTypeFilter(t);}}>{t==='all'?'전체':t}</button>
            ); })}
          </div>
          <div className="exp-stats">{filtered.length}/{experiences.length} · 꼬리질문 {totalFu} · 통합 {crossFu.length}</div>
        </div>

        {typeFilter === 'all' && (
          <div className="exp-grid" style={{marginBottom:18}}>
            <div className="exp-card" style={{borderColor:'var(--text)', background:'linear-gradient(180deg, var(--color-powder), var(--surface))'}}>
              <div className="exp-card-head">
                <span className="exp-type" data-type="자소서" style={{background:'#fee2e2', color:'#991b1b', borderColor:'#fca5a5'}}>통합</span>
                <span style={{flex:1, fontFamily:'var(--font-display)', fontSize:18, fontWeight:400, letterSpacing:'-0.02em'}}>여러 경험을 아우르는 꼬리질문</span>
              </div>
              <div className="exp-section-label"><span>융합형 예상 질문</span><span className="exp-fu-count">{crossFu.length}</span></div>
              <div className="exp-fu-list">
                {crossFu.map(function(fu){ return (
                  <div key={fu.id} className="exp-fu-item">
                    <input className="exp-fu-q" placeholder="Q. 융합형 꼬리질문" value={fu.q || ''} onChange={function(e){ updateCrossFu(fu.id, 'q', e.target.value); }} />
                    <textarea className="exp-fu-a" placeholder="A. 답변 메모 (선택)" value={fu.a || ''} rows={2}
                      onChange={function(e){ updateCrossFu(fu.id, 'a', e.target.value); var el=e.target; el.style.height='auto'; el.style.height=el.scrollHeight+'px'; }}
                      ref={function(el){ if(el){ el.style.height='auto'; el.style.height=el.scrollHeight+'px'; } }} />
                    <button className="exp-fu-del" title="삭제" onClick={function(){removeCrossFu(fu.id);}}>×</button>
                  </div>
                ); })}
                <button className="exp-add-fu" onClick={addCrossFu}>+ 통합 꼬리질문 추가</button>
              </div>
            </div>
          </div>
        )}

        {typeFilter === '자소서' ? (
          <div className="exp-canvas-wrap">
            <div className="exp-canvas-hint">
              <span>💡 노드를 드래그해서 자유롭게 배치하세요. 카드를 클릭하면 본문과 꼬리질문 편집창이 열립니다.</span>
              <button className="btn" onClick={resetPositions}>위치 초기화</button>
            </div>
            <div className="exp-canvas">
              <svg className="exp-canvas-svg" width="3000" height="2000">
                {filtered.map(function(ex, idx) {
                  var ppos = positions[ex.id] || defaultPos(idx);
                  var pcx = ppos.x + 140, pcy = ppos.y + 55;
                  var fus = ex.followups || [];
                  return fus.map(function(fu, fi) {
                    var cpos = positions['fu:'+fu.id] || defaultChildPos(ppos, fi, fus.length);
                    var ccx = cpos.x + 75, ccy = cpos.y + 18;
                    var mx = (pcx + ccx) / 2, my = (pcy + ccy) / 2;
                    return <path key={fu.id} d={"M "+pcx+" "+pcy+" Q "+mx+" "+pcy+" "+ccx+" "+ccy} stroke="var(--text3)" strokeWidth="1.5" fill="none" strokeDasharray="3,4" opacity="0.6" />;
                  });
                })}
              </svg>
              {filtered.map(function(ex, idx) {
                var pos = positions[ex.id] || defaultPos(idx);
                var fus = ex.followups || [];
                return (
                  <React.Fragment key={ex.id}>
                    <div className="exp-node"
                      style={{left:pos.x, top:pos.y}}
                      onPointerDown={function(e){ startNodeDrag(e, ex.id, idx); }}
                      onClick={function(){ if (!dragRef.current || !dragRef.current.moved) setSelected(ex.id); }}>
                      <span className="exp-type" data-type={ex.type}>{ex.type}</span>
                      <div className="exp-node-title">{ex.title}</div>
                      {ex.summary && <div className="exp-node-summary">{ex.summary}</div>}
                      <div className="exp-node-meta">
                        <span>꼬리질문 {fus.length}</span>
                        <span className="exp-node-open">열기 ↗</span>
                      </div>
                    </div>
                    {fus.map(function(fu, fi) {
                      var cpos = positions['fu:'+fu.id] || defaultChildPos(pos, fi, fus.length);
                      return (
                        <div key={fu.id} className="exp-subnode"
                          style={{left:cpos.x, top:cpos.y}}
                          onPointerDown={function(e){ startDragKey(e, 'fu:'+fu.id, defaultChildPos(pos, fi, fus.length)); }}
                          onClick={function(){ if (!dragRef.current || !dragRef.current.moved) setSelected(ex.id); }}
                          title={fu.q + (fu.a ? '\n\n→ '+fu.a : '')}>
                          <span className="exp-subnode-q">{fu.q || '(빈 꼬리질문)'}</span>
                          <button className="exp-subnode-del" title="삭제" onPointerDown={function(e){ e.stopPropagation(); }} onClick={function(e){ e.stopPropagation(); if(confirm('이 꼬리질문을 삭제할까요?')) removeFollowup(ex.id, fu.id); }}>×</button>
                        </div>
                      );
                    })}
                  </React.Fragment>
                );
              })}
              {filtered.length === 0 && <div style={{padding:40, textAlign:'center', color:'var(--text3)', fontSize:13}}>자소서 카드가 없습니다.</div>}
            </div>
          </div>
        ) : (
          <div className="exp-grid">
            {filtered.map(renderExpCard)}
            {filtered.length === 0 && <div style={{padding:40, textAlign:'center', color:'var(--text3)', fontSize:13}}>일치하는 경험이 없습니다.</div>}
          </div>
        )}
      </div>

      {selectedEx && (
        <div className="exp-modal-backdrop" onClick={function(){setSelected(null);}}>
          <div className="exp-modal" onClick={function(e){e.stopPropagation();}}>
            <button className="exp-modal-close" onClick={function(){setSelected(null);}}>×</button>
            {renderExpCard(selectedEx)}
          </div>
        </div>
      )}
    </>
  );
}

window.MindmapView = MindmapView;
window.TableView = TableView;
window.EpisodeManagerView = EpisodeManagerView;
window.ExperienceManagerView = ExperienceManagerView;

const { useState, useEffect } = React;

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false, errorMsg: '' }; }
  componentDidCatch(err, info) {
    console.error('ErrorBoundary caught:', err, info);
    this.setState({ hasError: true, errorMsg: String(err && err.message || err) + '\n' + String(info && info.componentStack || '').slice(0, 500) });
  }
  render() {
    if (this.state.hasError) {
      var self = this;
      return React.createElement('div', {style:{padding:40,textAlign:'center'}},
        React.createElement('h2', null, '오류가 발생했습니다'),
        React.createElement('pre', {style:{textAlign:'left',fontSize:12,background:'#f5f5f5',padding:16,borderRadius:8,maxHeight:200,overflow:'auto',margin:'16px auto',maxWidth:600}}, this.state.errorMsg),
        React.createElement('button', {onClick:function(){self.setState({hasError:false,errorMsg:''}); window.location.hash='#table';}}, '리스트 뷰로 돌아가기'),
        ' ',
        React.createElement('button', {onClick:function(){self.setState({hasError:false,errorMsg:''}); window.location.hash='#mindmap';}}, '마인드맵으로 돌아가기')
      );
    }
    return this.props.children;
  }
}
ErrorBoundary.getDerivedStateFromError = function(err) { return { hasError: true, errorMsg: String(err && err.message || err) }; };

var _scrollPos = {};
function saveScroll(route) {
  var sel = route === 'table' ? '.table-wrap' : route === 'episode' ? '.ep-wrap' : route === 'experience' ? '.exp-wrap' : null;
  if (!sel) return;
  var el = document.querySelector(sel);
  if (el) _scrollPos[route] = el.scrollTop;
}
function restoreScroll(route) {
  var sel = route === 'table' ? '.table-wrap' : route === 'episode' ? '.ep-wrap' : route === 'experience' ? '.exp-wrap' : null;
  if (!sel || !_scrollPos[route]) return;
  var pos = _scrollPos[route];
  requestAnimationFrame(function() {
    var el = document.querySelector(sel);
    if (el) el.scrollTop = pos;
  });
}

function App() {
  const [route, setRoute] = useState(() => {
    const h = window.location.hash.slice(1);
    return h.split('?')[0] || 'mindmap';
  });
  const [excOpen, setExcOpen] = useState(false);
  const [excCount, setExcCount] = useState(() => ExcerptStore.get().length);
  var prevRoute = React.useRef(route);

  useEffect(() => {
    const onHash = () => {
      const h = window.location.hash.slice(1);
      var next = h.split('?')[0] || 'mindmap';
      saveScroll(prevRoute.current);
      prevRoute.current = next;
      setRoute(next);
    };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  useEffect(() => {
    restoreScroll(route);
  }, [route]);

  useEffect(() => {
    return ExcerptStore.subscribe(() => setExcCount(ExcerptStore.get().length));
  }, []);

  var view;
  if (route === 'table') view = <TableView />;
  else if (route === 'episode') view = <EpisodeManagerView />;
  else if (route === 'experience') view = <ExperienceManagerView />;
  else view = <MindmapView />;

  return <>
    {view}
    <SelectionPopover />
    <ExcerptPanel open={excOpen} onClose={() => setExcOpen(false)} />
    <button className="excerpt-toggle" onClick={() => setExcOpen(!excOpen)}
            style={{position:'fixed', bottom:20, right:20, zIndex:350, width:48, height:48, borderRadius:'50%', background:'var(--text)', color:'var(--bg)', border:'none', cursor:'pointer', fontSize:20, boxShadow:'0 2px 12px rgba(0,0,0,0.2)', display:'flex', alignItems:'center', justifyContent:'center'}}
            title="발췌 모음">
      📋
      {excCount > 0 && <span className="excerpt-badge">{excCount}</span>}
    </button>
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
