<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  /* ElevenLabs tokens */
  --color-eggshell: #fdfcfc;
  --color-powder: #f5f3f1;
  --color-chalk: #e5e5e5;
  --color-fog: #b1b0b0;
  --color-gravel: #777169;
  --color-slate: #a59f97;
  --color-cinder: #2a2724;
  --color-obsidian: #000000;
  --color-signal-blue: #0447ff;
  --color-ember: #ff4704;

  --bg: #fdfcfc;
  --surface: #ffffff;
  --text: #000000;
  --text2: #777169;
  --text3: #a59f97;
  --text4: #b1b0b0;
  --border: #e5e5e5;
  --border-s: #e5e5e5;
  --blue: #000000;
  --accent: #0447ff;
  --danger: #ff4704;
  --warning: #ff4704;
  --success: #000000;
  --priority: #ff4704;
  --font: 'Inter', 'Pretendard Variable', -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
  --font-display: 'Cormorant Garamond', 'Libre Baskerville', Georgia, 'Times New Roman', serif;
  --shadow-hairline: rgba(0,0,0,0.4) 0px 0px 1px 0px, rgba(0,0,0,0.04) 0px 2px 4px 0px;
  --shadow-inset: rgba(0,0,0,0.075) 0px 0px 0px 0.5px inset;
  --radius-card: 16px;
  --radius-pill: 9999px;
  --radius-sm: 4px;
  --radius-panel: 20px;
}

/* ─── Dark mode ─── */
html[data-theme="dark"] {
  --bg: #0e0d0c;
  --surface: #1a1817;
  --text: #f5f3f1;
  --text2: #a59f97;
  --text3: #777169;
  --text4: #57534f;
  --border: #2a2724;
  --border-s: #2a2724;
  --blue: #f5f3f1;
  --accent: #6b8aff;
  --danger: #ff7a4d;
  --priority: #ff7a4d;
  --shadow-hairline: rgba(0,0,0,0.6) 0px 0px 1px 0px, rgba(0,0,0,0.3) 0px 2px 4px 0px;
  --shadow-inset: rgba(255,255,255,0.04) 0px 0px 0px 0.5px inset;
  --color-powder: #25221f;
  --color-chalk: #2a2724;
  --color-eggshell: #0e0d0c;
  --color-ember: #ff7a4d;
  --color-signal-blue: #6b8aff;
}
html[data-theme="dark"] .grid-bg {
  background-image: radial-gradient(circle, rgba(255,255,255,0.06) 0.5px, transparent 0.5px);
}
html[data-theme="dark"] .modal-bg { background: rgba(0,0,0,0.55); }
html[data-theme="dark"] meta[name="theme-color"] { /* placeholder */ }
html[data-theme="dark"] .btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
html[data-theme="dark"] .tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
html[data-theme="dark"] .filter-chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }
html[data-theme="dark"] .node-root { background: var(--text); color: var(--bg); }
html[data-theme="dark"] .node-cat.expanded { background: var(--text); color: var(--bg); border-color: var(--text); }
html[data-theme="dark"] .ep-badge { background: var(--text); color: var(--bg); }
html[data-theme="dark"] .qc-cat-dot { box-shadow: 0 0 0 1px var(--surface); }
html[data-theme="dark"] .ans-type-badge.type-answer { background: var(--surface); color: var(--text); border-color: var(--text); }
html[data-theme="dark"] .qc-child-badge.t-answer { background: var(--surface); color: var(--text); border-color: var(--text); }
html[data-theme="dark"] .ep-card-del:hover, html[data-theme="dark"] .qc-del:hover { background: var(--text); color: var(--bg); border-color: var(--text); }
html[data-theme="dark"] .qc-child-add button:hover { background: var(--text); color: var(--bg); border-color: var(--text); }
html[data-theme="dark"] .ep-add-sub:hover, html[data-theme="dark"] .qc-script-add:hover, html[data-theme="dark"] .qc-ans-add:hover { background: var(--surface); }
html[data-theme="dark"] .toast { background: var(--text); color: var(--bg); }
html[data-theme="dark"] .connect-banner { background: var(--text); color: var(--bg); }
html[data-theme="dark"] .connect-banner button { border-color: rgba(14,13,12,0.4); color: var(--bg); }

/* 테마 토글 버튼 */
.theme-toggle {
  width: 36px; height: 36px; border: 1px solid var(--border); background: var(--surface);
  border-radius: 50%; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  font-size: 15px; color: var(--text); transition: background .15s, transform .2s; font-family: var(--font);
  padding: 0;
}
.theme-toggle:hover { background: var(--color-powder); }
.theme-toggle:active { transform: scale(0.95); }

html, body { height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:var(--font); font-size:14px; font-weight:400; letter-spacing:0.1px; line-height:1.43; -webkit-font-smoothing:antialiased; font-feature-settings:"kern" 1; }
#root { height:100%; display:flex; flex-direction:column; }

/* ─── Topbar ─── */
.topbar {
  position:fixed; top:0; left:0; right:0; z-index:100;
  display:flex; align-items:center; gap:10px;
  padding:0 24px; height:56px;
  background:var(--bg);
  border-bottom:1px solid var(--border);
}
.brand { font-family:var(--font-display); font-size:22px; font-weight:300; letter-spacing:-0.02em; color:var(--text); margin-right:12px; white-space:nowrap; }
.tabs { display:flex; gap:6px; background:transparent; border-radius:0; padding:0; }
.tab { border:1px solid var(--border); background:transparent; padding:6px 14px; border-radius:18px; font-size:13px; font-weight:500; color:var(--text); cursor:pointer; transition:all .15s; font-family:var(--font); letter-spacing:0.1px; }
.tab.active { background:var(--text); color:var(--bg); border-color:var(--text); }
.tab:hover:not(.active) { background:var(--color-powder); }

.search { border:1px solid var(--border); background:var(--surface); border-radius:var(--radius-pill); padding:7px 16px; font-size:13px; width:220px; outline:none; color:var(--text); font-family:var(--font); transition:border-color .15s; box-shadow:var(--shadow-inset); }
.search:focus { border-color:var(--text); }
.search::placeholder { color:var(--text3); }
.tb-spacer { flex:1; }

.btn { border:1px solid var(--border); padding:7px 16px; border-radius:var(--radius-pill); font-size:13px; font-weight:500; cursor:pointer; transition:all .15s; font-family:var(--font); white-space:nowrap; letter-spacing:0.1px; }
.btn.primary { background:var(--text); color:var(--bg); border-color:var(--text); box-shadow:rgba(0,0,0,0.06) 0 0 0 1px, rgba(0,0,0,0.04) 0 1px 2px 0, rgba(0,0,0,0.04) 0 2px 4px 0; }
.btn.primary:hover { background:#1a1a1a; }
.btn.ghost { background:var(--surface); color:var(--text); }
.btn.ghost:hover { background:var(--color-powder); }

/* ─── Legend ─── */
.legend {
  position:fixed; bottom:20px; left:20px; z-index:50;
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:14px 18px; font-size:12px; color:var(--text2);
  box-shadow:var(--shadow-hairline);
}
.legend h4 { font-size:10px; font-weight:700; letter-spacing:0.7px; text-transform:uppercase; color:var(--text2); margin-bottom:8px; }
.legend .row { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
.kbd { display:inline-block; background:var(--color-powder); border:1px solid var(--border); border-radius:4px; padding:2px 7px; font-size:11px; font-weight:500; color:var(--text); min-width:36px; text-align:center; font-family:'Geist Mono',ui-monospace,Menlo,monospace; }

/* ─── Canvas ─── */
.canvas-wrap {
  flex:1; position:relative; overflow:hidden; cursor:grab; margin-top:56px;
  background:var(--bg);
  touch-action: none;
  -webkit-user-select: none; user-select: none;
}
.canvas-wrap.grabbing { cursor:grabbing; }
.canvas-wrap.connect-mode { cursor:crosshair; }
.grid-bg {
  position:absolute; inset:0;
  background-image:radial-gradient(circle, rgba(0,0,0,0.05) 0.5px, transparent 0.5px);
  background-size:32px 32px;
  pointer-events:none;
}
.canvas { position:absolute; top:0; left:0; transform-origin:0 0; width:0; height:0; }

/* ─── Edges SVG ─── */
.edges { position:absolute; top:0; left:0; pointer-events:none; overflow:visible; }
.edges path { pointer-events:none; }
.edges .edge.hit { stroke:transparent; stroke-width:16; fill:none; pointer-events:stroke; cursor:pointer; }

/* ─── Nodes ─── */
.node { position:absolute; transform:translate(-50%,-50%); cursor:pointer; user-select:none; touch-action:none; transition:transform .15s ease, border-color .2s, background .2s; }
.node:hover { z-index:10; }
.node.dragging { transition:none !important; z-index:100; opacity:0.9; }

/* Root */
.node-root {
  background:var(--text); color:var(--bg); border-radius:var(--radius-pill);
  padding:14px 36px;
  font-family:var(--font-display); font-size:24px; font-weight:300; letter-spacing:-0.02em;
  white-space:nowrap; z-index:5;
  animation:float 6s ease-in-out infinite;
}
@keyframes float { 0%,100%{transform:translate(-50%,-50%) translateY(0)} 50%{transform:translate(-50%,-50%) translateY(-3px)} }

/* Category — pill, monogram-style */
.node-cat {
  border-radius:var(--radius-pill); padding:9px 20px;
  font-size:13px; font-weight:500; letter-spacing:0.1px;
  white-space:nowrap; display:flex; align-items:center; gap:8px;
  border:1px solid var(--border); background:var(--surface); color:var(--text);
  z-index:4; transition:all .2s ease;
  box-shadow:var(--shadow-hairline);
}
.node-cat.collapsed { background:var(--surface); }
.node-cat.expanded { background:var(--text); color:var(--bg); border-color:var(--text); }
.cat-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.cat-cnt { font-size:11px; font-weight:500; opacity:0.6; margin-left:2px; letter-spacing:0.5px; }
.node-cat:hover { filter:none; transform-origin:center; }
.node-cat.collapsed:hover { background:var(--color-powder); }

/* Question */
.node-q {
  width:260px; background:var(--surface); border:1px solid var(--border);
  border-radius:16px; padding:16px 18px; z-index:3;
  transition:border-color .15s, opacity .2s;
  box-shadow:var(--shadow-hairline);
}
.node-q:hover { border-color:var(--text); }
.node-q.active { border-color:var(--text); border-width:2px; }
.node-q.dimmed { opacity:0.35; }
.node-q.priority-high { border-left:4px solid var(--color-ember); }
.node-q.connecting-source { border-color:var(--color-signal-blue); }

.q-id { font-family:var(--font); font-size:10px; font-weight:700; letter-spacing:0.7px; text-transform:uppercase; color:var(--text2); margin-bottom:6px; display:flex; align-items:center; gap:6px; }
.q-prio { font-size:9px; background:var(--color-ember); color:var(--bg); border-radius:var(--radius-pill); padding:2px 8px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; }
.q-text { font-size:14px; font-weight:500; line-height:1.4; color:var(--text); margin-bottom:10px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; letter-spacing:0.1px; }
.q-meta { display:flex; flex-wrap:wrap; gap:4px; }
.q-stat { font-size:10px; padding:2px 9px; border-radius:var(--radius-pill); font-weight:500; border:1px solid var(--border); }
.q-stat.kw { background:var(--color-powder); color:var(--text); border-color:transparent; }
.q-stat.has { background:transparent; color:var(--text); }
.q-stat.tail { background:transparent; color:var(--color-ember); border-color:var(--color-ember); }
.q-stat.script { background:var(--text); color:var(--bg); border-color:var(--text); }

.node-handles { position:absolute; top:4px; right:6px; display:none; gap:4px; }
.node:hover .node-handles { display:flex; }
.handle { width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; cursor:pointer; background:rgba(0,0,0,0.04); color:var(--text2); transition:background .15s; }
.handle:hover { background:rgba(0,0,0,0.08); }
.handle.del { color:var(--danger); }
.handle.del:hover { background:rgba(255,59,48,0.1); }
.handle.add-ans { color:var(--success); font-weight:700; font-size:14px; }
.handle.add-ans:hover { background:rgba(52,199,89,0.12); }

/* 리사이즈 핸들 */
.resize-handle {
  position:absolute; bottom:2px; right:2px; width:14px; height:14px;
  cursor:nwse-resize; opacity:0; transition:opacity .15s;
  display:flex; align-items:center; justify-content:center;
}
.resize-handle::after {
  content:''; display:block; width:8px; height:8px;
  border-right:2px solid var(--text3); border-bottom:2px solid var(--text3);
}
.node:hover .resize-handle { opacity:0.6; }
.resize-handle:hover { opacity:1 !important; }

/* Answer/Custom nodes */
.node-answer {
  width:220px; background:var(--surface); border:1px solid var(--border);
  border-radius:16px; padding:14px 16px; z-index:3;
  border-left:4px solid;
  transition:border-color .2s, opacity .2s;
  box-shadow:var(--shadow-hairline);
}
.node-answer:hover { border-color:var(--text); }
.ans-type-badge {
  font-size:10px; font-weight:700; padding:2px 9px; border-radius:var(--radius-pill);
  display:inline-block; margin-bottom:8px; letter-spacing:0.7px; text-transform:uppercase; border:1px solid;
}
.ans-type-badge.type-answer { background:var(--surface); color:var(--text); border-color:var(--text); }
.ans-type-badge.type-tail { background:var(--color-ember); color:var(--bg); border-color:var(--color-ember); }
.ans-type-badge.type-why { background:var(--color-signal-blue); color:var(--bg); border-color:var(--color-signal-blue); }
.ans-type-badge.type-opinion { background:var(--surface); color:var(--text2); border-color:var(--border); }
.ans-text {
  font-size:13px; line-height:1.45; color:var(--text); font-weight:500;
  outline:none; min-height:18px; padding:2px 0; letter-spacing:0.1px;
}
.ans-text:focus { background:var(--color-powder); border-radius:6px; }
.ans-text[data-empty="true"]::before { content:'내용을 입력하세요...'; color:var(--text3); font-style:italic; }
.node-custom { background:var(--surface); border:2px solid; border-radius:16px; padding:14px 16px; max-width:200px; font-size:13px; font-weight:500; z-index:3; box-shadow:var(--shadow-hairline); }

/* ─── Zoom Controls ─── */
.zoom-ctrl {
  position:fixed; bottom:20px; right:20px; z-index:50;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:8px;
  box-shadow:var(--shadow-hairline);
}
.zoom-ctrl button { width:36px; height:36px; border:none; background:transparent; border-radius:50%; font-size:18px; cursor:pointer; color:var(--text); transition:background .15s; display:flex; align-items:center; justify-content:center; font-family:var(--font); }
.zoom-ctrl button:hover { background:var(--color-powder); }
.zd { font-size:11px; font-weight:500; color:var(--text2); padding:2px 0; font-family:'Geist Mono',ui-monospace,Menlo,monospace; }

/* ─── Minimap ─── */
.minimap {
  position:fixed; bottom:20px; right:72px; z-index:50;
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:8px; cursor:pointer; transition:right .3s;
  box-shadow:var(--shadow-hairline);
}
.minimap.with-panel { right:440px; }
.minimap canvas { border-radius:10px; display:block; }
.minimap .vp { position:absolute; border:1.5px solid var(--text); border-radius:3px; pointer-events:none; opacity:0.6; }
.minimap .label { font-size:10px; font-weight:700; letter-spacing:0.7px; text-transform:uppercase; color:var(--text2); text-align:center; margin-top:4px; }

/* ─── Detail Panel ─── */
.detail-panel {
  position:fixed; top:56px; right:0; bottom:0; width:420px; z-index:90;
  background:var(--bg); border-left:1px solid var(--border);
  display:flex; flex-direction:column; overflow-y:auto;
  animation:slideIn .25s ease;
}
@keyframes slideIn { from{transform:translateX(100%)} to{transform:translateX(0)} }

.dp-head { display:flex; align-items:center; gap:8px; padding:20px 24px 12px; flex-shrink:0; }
.dp-cat-pill { font-size:12px; font-weight:600; padding:4px 12px; border-radius:var(--radius-pill); display:flex; align-items:center; gap:6px; }
.dp-cat-pill .dot { width:6px; height:6px; border-radius:50%; }
.dp-id { font-size:11px; font-weight:600; letter-spacing:0.06em; color:var(--text3); }
.dp-close { margin-left:auto; width:28px; height:28px; border:none; background:rgba(0,0,0,0.04); border-radius:50%; font-size:18px; cursor:pointer; color:var(--text2); display:flex; align-items:center; justify-content:center; transition:background .15s; }
.dp-close:hover { background:rgba(0,0,0,0.08); }

.dp-q { font-family:var(--font-display); font-size:28px; font-weight:300; letter-spacing:-0.02em; line-height:1.15; padding:12px 24px 18px; outline:none; border-bottom:1px solid var(--border); color:var(--text); }

.dp-body { padding:16px 24px 32px; flex:1; }
.dp-section { margin-bottom:20px; }
.dp-label { font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--text3); margin-bottom:8px; }

.dp-priority { display:flex; gap:6px; }
.prio-btn { border:1px solid var(--border); background:var(--surface); border-radius:var(--radius-pill); padding:6px 14px; font-size:12px; font-weight:500; cursor:pointer; transition:all .15s; font-family:var(--font); color:var(--text); letter-spacing:0.1px; }
.prio-btn.active { color:var(--bg); border-color:var(--text); background:var(--text); }
.prio-btn.low.active { background:var(--text3); border-color:var(--text3); }
.prio-btn.normal.active { background:var(--text); border-color:var(--text); }
.prio-btn.high.active { background:var(--color-ember); border-color:var(--color-ember); }

.dp-keyword-input { width:100%; border:1px solid var(--border); border-radius:4px; padding:9px 14px; font-size:14px; outline:none; font-family:var(--font); color:var(--text); background:var(--surface); transition:border-color .15s; box-shadow:var(--shadow-inset); letter-spacing:0.1px; }
.dp-keyword-input:focus { border-color:var(--text); }
.dp-keyword-input::placeholder { color:var(--text3); }

.dp-textarea { width:100%; border:1px solid var(--border); border-radius:4px; padding:10px 14px; font-size:14px; line-height:1.55; outline:none; resize:vertical; font-family:var(--font); color:var(--text); background:var(--surface); min-height:100px; transition:border-color .15s; box-shadow:var(--shadow-inset); letter-spacing:0.1px; }
.dp-textarea:focus { border-color:var(--text); }
.dp-textarea::placeholder { color:var(--text3); }

.ans-block { position:relative; margin-bottom:10px; }
.ans-num { font-size:11px; font-weight:600; color:var(--text3); margin-bottom:4px; }
.ans-del { position:absolute; top:0; right:0; background:none; border:none; color:var(--danger); cursor:pointer; font-size:16px; opacity:0.5; }

/* ─── Toast ─── */
.toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--text); color:var(--bg); padding:10px 24px; border-radius:var(--radius-pill); font-size:14px; font-weight:500; opacity:0; transition:all .3s; pointer-events:none; z-index:200; box-shadow:rgba(0,0,0,0.06) 0 0 0 1px, rgba(0,0,0,0.04) 0 1px 2px 0, rgba(0,0,0,0.04) 0 2px 4px 0; letter-spacing:0.1px; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* ─── Connect Banner ─── */
.connect-banner { position:fixed; top:68px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:8px 20px; border-radius:var(--radius-pill); font-size:13px; font-weight:500; z-index:100; display:flex; align-items:center; gap:12px; box-shadow:var(--shadow-hairline); letter-spacing:0.1px; }

.connect-banner button:hover { background:rgba(253,252,252,0.15); }

/* ─── Context Menu ─── */
.ctx-menu { position:fixed; z-index:200; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:4px; min-width:160px; box-shadow:var(--shadow-hairline); }

/* ─── Modal ─── */
.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.25); backdrop-filter:blur(8px); z-index:300; display:flex; align-items:center; justify-content:center; }

.modal label { display:block; font-size:10px; font-weight:700; letter-spacing:0.7px; text-transform:uppercase; color:var(--text2); margin-bottom:8px; margin-top:14px; }
.modal input, .modal select { width:100%; border:1px solid var(--border); border-radius:4px; padding:10px 14px; font-size:14px; outline:none; font-family:var(--font); color:var(--text); background:var(--surface); transition:border-color .15s; box-shadow:var(--shadow-inset); letter-spacing:0.1px; }
.modal input:focus, .modal select:focus { border-color:var(--text); }
.modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:24px; }
.modal textarea { width:100%; border:1px solid var(--border); border-radius: 4px; padding:10px 14px; font-size:14px; line-height:1.5; outline:none; resize:vertical; font-family:var(--font); color:var(--text); background:var(--surface); min-height:80px; transition:border-color .15s; box-shadow:var(--shadow-inset); letter-spacing:0.1px; }
.modal textarea:focus { border-color:var(--text); }

/* ─── Mention dropdown ─── */
.mention-dropdown { position: fixed; z-index: 500; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 4px; max-height: 260px; overflow-y: auto; min-width: 260px; box-shadow: var(--shadow-hairline); }
.mention-item { padding: 9px 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 13px; letter-spacing: 0.1px; }
.mention-item:hover, .mention-item.active { background: var(--color-powder); }
.mention-item .ep-emoji { font-size: 16px; }
.mention-item .ep-tag { font-weight: 600; color: var(--text); }
.mention-item .ep-desc { color: var(--text2); font-size: 12px; }

/* ─── Episode badge ─── */
.ep-badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; cursor: pointer; background: var(--text); color: var(--bg); white-space: nowrap; position: relative; letter-spacing: 0.1px; }

/* ─── Episode tooltip ─── */
.ep-tooltip { position: fixed; z-index: 600; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; max-width: 340px; pointer-events: none; box-shadow: var(--shadow-hairline); }

/* ─── List View (이전 Table View를 대체한 카드형 UI) ─── */

/* 에피소드 관리 뷰 */

/* 경험 관리 뷰 */
.exp-wrap { flex:1; overflow-y:auto; padding:72px 28px 28px; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
.exp-toolbar { display:flex; align-items:center; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
.exp-stats { font-size:13px; font-weight:500; color:var(--text2); margin-left:auto; white-space:nowrap; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; }

.exp-section-label { font-size: 10px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text2); margin-top: 4px; display: flex; align-items: center; gap: 8px; }
.exp-section-label .exp-toggle { background:transparent; border:1px solid var(--border); border-radius: 999px; padding: 2px 10px; font-size:10px; cursor:pointer; color: var(--text3); font-family: var(--font); }

<script>
// Theme bootstrap (FOUC 방지) — body 렌더 전에 적용
(function(){
  try {
    var saved = localStorage.getItem('mm-theme');
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var theme = saved || (prefersDark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
    var meta = document.getElementById('meta-theme-color');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#0e0d0c' : '#fdfcfc');
  } catch(e) {}
  window.MMTheme = {
    get: function(){ return document.documentElement.getAttribute('data-theme') || 'light'; },
    set: function(t){
      document.documentElement.setAttribute('data-theme', t);
      try { localStorage.setItem('mm-theme', t); } catch(e){}
      var meta = document.getElementById('meta-theme-color');
      if (meta) meta.setAttribute('content', t === 'dark' ? '#0e0d0c' : '#fdfcfc');
      window.dispatchEvent(new CustomEvent('mm-theme-change', { detail: t }));
    },
    toggle: function(){ this.set(this.get() === 'dark' ? 'light' : 'dark'); }
  };
})();
</script>

    { id:'ex1', type:'\uC790\uC18C\uC11C', title:'\uBB38\uD56D1. \uC9C0\uC6D0\uB3D9\uAE30 & \uC131\uC7A5 \uBC29\uD5A5', period:'', summary:'\uC131\uC7A5 \uAE30\uD68C / \uD6C4\uAE30\uB2E8\uACC4 \uC2A4\uCF00\uC77C\uC5C5 \uC804\uBB38\uAC00', body:`[1-1] \uC0B0\uC5C5\uC740\uD589\uC5D0 \uC9C0\uC6D0\uD55C \uB3D9\uAE30\uB294? (\uD68C\uC0AC \uC120\uD0DD \uAE30\uC900 \uD3EC\uD568)\n\n\uC800\uB294 \uC131\uC7A5\uD560 \uAE30\uD68C\uAC00 \uB9CE\uC740 \uACF3\uC5D0\uC11C \uC77C\uD558\uACE0 \uC2F6\uC2B5\uB2C8\uB2E4.\n\n\uD559\uBD80 \uC2DC\uC808\uBD80\uD130 \uAE30\uC5C5\uC5D0 \uC790\uAE08\uC744 \uC5F0\uACB0\uD558\uB294 \uC77C\uC5D0 \uAD00\uC2EC\uC774 \uC788\uC5C8\uACE0, \uADF8 \uC5F0\uC7A5\uC120\uC5D0\uC11C \uB2F9\uD589 \uC778\uD134\uC5D0 \uC9C0\uC6D0\uD588\uC2B5\uB2C8\uB2E4. \uB2E4\uB9CC \uB2F9\uC2DC\uC5D0\uB294 \uC0B0\uC5C5\uC740\uD589\uC774 \uB2E4\uB978 \uAE08\uC735\uAE30\uAD00\uACFC \uC5B4\uB5BB\uAC8C \uB2E4\uB978\uC9C0\uAE4C\uC9C0\uB294 \uAE4A\uC774 \uC0DD\uAC01\uD574\uBCF4\uC9C0 \uBABB\uD588\uC2B5\uB2C8\uB2E4.\n\n\uC778\uD134 \uADFC\uBB34 \uC911 \uD300\uC7A5\uB2D8\uAED8 \uC0B0\uC5C5\uC740\uD589\uC758 \uD5A5\uD6C4 \uC804\uB9DD\uC744 \uC5EC\uCB64\uBCF8 \uC801\uC774 \uC788\uC2B5\uB2C8\uB2E4. "\uC0C8\uB85C\uC6B4 \uC704\uAE30\uAC00 \uACC4\uC18D \uC0DD\uAE30\uB294 \uD55C, \uD574\uC57C \uD560 \uC77C\uC740 \uB354\uC6B1 \uB9CE\uC544\uC9C8 \uAC83"\uC774\uB77C\uB294 \uB9D0\uC500\uC774 \uC624\uB798 \uB0A8\uC558\uC2B5\uB2C8\uB2E4. \uC0B0\uC5C5\uC740\uD589\uC740 \uC2DC\uC911\uC740\uD589\uC774\uB098 \uD0C0 \uAE30\uAD00\uC774 \uB300\uC2E0\uD560 \uC218 \uC5C6\uB294 \uC815\uCC45\uAE08\uC735\uC758 \uC5ED\uD560\uC744 \uB9E1\uC544\uC654\uACE0, \uADF8 \uC5ED\uD560\uC740 \uC2DC\uB300\uC5D0 \uB9DE\uCDB0 \uACC4\uC18D \uD655\uC7A5\uB418\uC5B4 \uC654\uC2B5\uB2C8\uB2E4. \uBA38\uBB3C\uB7EC \uC788\uC9C0 \uC54A\uB294 \uC870\uC9C1\uC774\uAE30\uC5D0 \uC804\uBB38\uC131\uC744 \uD0A4\uC6B8 \uAE30\uD68C\uB3C4 \uD568\uAED8 \uB298\uC5B4\uB09C\uB2E4\uB294 \uAC83\uC744 \uADF8\uB54C \uAE68\uB2EC\uC558\uC2B5\uB2C8\uB2E4.\n\n\uC120\uBC30\uB2D8\uB4E4\uACFC \uD568\uAED8 \uC77C\uD558\uBA70 \uADF8 \uAE68\uB2EC\uC74C\uC740 \uD655\uC2E0\uC774 \uB410\uC2B5\uB2C8\uB2E4. \uD55C \uC2A4\uD0C0\uD2B8\uC5C5\uC758 \uC131\uC7A5\uC744 \uC704\uD574 \uC5B4\uB5A4 \uBD80\uC11C\uB294 \uD22C\uC790\uC790\uC640 \uAE30\uC5C5\uC744 \uC5F0\uACB0\uD558\uACE0, \uB610 \uB2E4\uB978 \uBD80\uC11C\uB294 \uD380\uB4DC\uB97C \uC870\uC131\uD574 \uC790\uAE08\uC744 \uACF5\uAE09\uD588\uC2B5\uB2C8\uB2E4. \uAC01 \uBD80\uC11C\uC758 \uC5ED\uD560\uC740 \uB2EC\uB790\uC9C0\uB9CC \uBAA8\uB450\uAC00 \uAE30\uC5C5 \uC131\uC7A5\uC774\uB77C\uB294 \uD558\uB098\uC758 \uBAA9\uD45C\uB97C \uD5A5\uD574 \uC6C0\uC9C1\uC774\uACE0 \uC788\uC5C8\uC2B5\uB2C8\uB2E4. \uAD6C\uC131\uC6D0 \uBAA8\uB450\uAC00 \uAC01\uC790\uC758 \uC5ED\uD560\uC5D0 \uC790\uBD80\uC2EC\uC744 \uB290\uB07C\uBA70 \uCEE4\uB9AC\uC5B4\uB97C \uC313\uC544\uAC00\uB294 \uBAA8\uC2B5\uC740 \uD070 \uC601\uAC10\uC744 \uC8FC\uC5C8\uC2B5\uB2C8\uB2E4.\n\n\uC800 \uB610\uD55C \uBCC0\uD654\uC5D0 \uB9DE\uCDB0 \uC0C8\uB85C\uC6B4 \uC5ED\uD560\uC744 \uB9E1\uC544\uAC00\uBA70, \uC804\uBB38\uC131\uC744 \uD0A4\uC6B0\uB294 \uD589\uC6D0\uC774 \uB418\uACA0\uC2B5\uB2C8\uB2E4.\n\n\n[1-2] \uC785\uD589 \uD6C4 \uC5B4\uB5A4 \uBD84\uC57C\uC5D0\uC11C \uC5B4\uB5A4 \uC804\uBB38\uAC00\uB85C \uC131\uC7A5\uD558\uACE0 \uC2F6\uC740\uAC00?\n\n\uC800\uB294 \uD6C4\uAE30 \uB2E8\uACC4 \uAE30\uC5C5\uC758 \uC2A4\uCF00\uC77C\uC5C5\uC744 \uB4B7\uBC1B\uCE68\uD558\uB294 \uC804\uBB38\uAC00\uB85C \uC131\uC7A5\uD558\uACE0 \uC2F6\uC2B5\uB2C8\uB2E4.\n\n\uC6B0\uC218\uD55C \uAE30\uC5C5\uC870\uCC28 \uC131\uC7A5\uC758 \uB9C8\uC9C0\uB9C9 \uD55C \uAC78\uC74C\uC744 \uC55E\uB450\uACE0 \uD070 \uBCBD\uC5D0 \uBD80\uB52A\uD799\uB2C8\uB2E4. \uCD08\uAE30\uC640 \uB2EC\uB9AC, \uBCF8\uACA9\uC801\uC778 \uD655\uC7A5\uC744 \uC55E\uB454 \uAE30\uC5C5\uC740 \uB354 \uD070 \uC790\uAE08\uACFC \uD6C4\uC18D \uD22C\uC790\uAC00 \uB3D9\uC2DC\uC5D0 \uD544\uC694\uD574\uC9D1\uB2C8\uB2E4. \uADF8\uB7EC\uB098 \uD22C\uC790 \uADDC\uBAA8\uAC00 \uCEE4\uC9C8\uC218\uB85D \uCC38\uC5EC\uD560 \uC790\uAE08 \uC8FC\uCCB4\uAC00 \uC904\uC5B4, \uD55C \uBC88 \uD750\uB984\uC774 \uB04A\uAE30\uBA74 \uC131\uC7A5\uC138\uB3C4 \uB454\uD654\uB429\uB2C8\uB2E4. \uC774 \uACF5\uBC31\uC744 \uBA54\uC6B0\uB294 \uC77C\uC740 \uC0B0\uC5C5\uC740\uD589\uC5D0\uC11C\uB9CC \uD560 \uC218 \uC788\uACE0, \uADF8\uB9CC\uD07C \uB354 \uD070 \uBC30\uC6C0\uC744 \uC5BB\uC744 \uC218 \uC788\uB2E4\uACE0 \uC0DD\uAC01\uD569\uB2C8\uB2E4.\n\n\uC785\uD589 \uD6C4, \uAE30\uC5C5\uC744 \uD68D\uC77C\uC801\uC73C\uB85C \uC2EC\uC0AC\uD558\uC9C0 \uC54A\uACE0 \uD604\uC7AC \uB193\uC778 \uC131\uC7A5 \uAD6D\uBA74\uBD80\uD130 \uC77D\uC5B4\uB0B4\uACA0\uC2B5\uB2C8\uB2E4. \uAE30\uC5C5\uB9C8\uB2E4 \uB9C9\uD788\uB294 \uC9C0\uC810\uC774 \uB2E4\uB974\uBBC0\uB85C, \uC774\uB97C \uC815\uD655\uD788 \uAD6C\uBD84\uD574 \uC54C\uB9DE\uC740 \uC9C0\uC6D0\uBC29\uC2DD\uC744 \uC81C\uC548\uD558\uACA0\uC2B5\uB2C8\uB2E4. \uD2B9\uD788 \uD6C4\uAE30 \uB2E8\uACC4\uC5D0\uC11C\uB294 \uD604\uC7AC \uD544\uC694\uD55C \uC790\uAE08\uB9CC\uC774 \uC544\uB2C8\uB77C, \uB2E4\uC74C \uB77C\uC6B4\uB4DC\uB85C \uC774\uC5B4\uC9C8 \uAC00\uB2A5\uC131\uAE4C\uC9C0 \uD568\uAED8 \uC810\uAC80\uD558\uACA0\uC2B5\uB2C8\uB2E4.`, followups:[] },

    { id:'ex2', type:'\uC790\uC18C\uC11C', title:'\uBB38\uD56D2. \uD544\uC694 \uC5ED\uB7C9 & \uAC1C\uBC1C \uACBD\uD5D8 & \uBD80\uC871 \uC5ED\uB7C9', period:'', summary:'\uAE30\uC5C5 \uBD84\uC11D\uB825 / \uC0B0\uC5C5 \uC774\uD574\uB3C4 / \uAE00\uB85C\uBC8C \uBCF4\uC644', body:`[2-1] \uC0B0\uC5C5\uC740\uD589 \uC9C1\uC6D0\uC73C\uB85C \uAC00\uC7A5 \uD544\uC694\uD55C \uC5ED\uB7C9\uC740?\n\n'\uAE30\uC5C5 \uBD84\uC11D\uB825'\uACFC '\uC0B0\uC5C5 \uC774\uD574\uB3C4'\n\n\n[2-2] \uADF8 \uC5ED\uB7C9\uC744 \uD0A4\uC6B0\uAE30 \uC704\uD574 \uD55C \uACBD\uD5D8\uC740?\n\n\uCCAB\uC9F8\uB85C, \uAE30\uC5C5\uC744 \uB2E4\uAC01\uB3C4\uB85C \uBCF4\uB294 \uBD84\uC11D\uB825\uC785\uB2C8\uB2E4. \uBCF4\uC99D\uAE30\uAD00\uC5D0\uC11C 3\uAC1C\uC6D4\uAC04 \uADFC\uBB34\uD558\uBA70, \uCC98\uC74C\uC5D0\uB294 \uC7AC\uBB34\uC81C\uD45C\uC640 \uC2E0\uC6A9\uC815\uBCF4\uB9CC \uBCF4\uBA74 \uCDA9\uBD84\uD558\uB2E4\uACE0 \uC0DD\uAC01\uD588\uC2B5\uB2C8\uB2E4. \uADF8\uB7EC\uB098 \uC5F0\uC7A5 \uC2EC\uC0AC\uB97C \uBC18\uBCF5\uD558\uBA70 \uC22B\uC790\uB9CC\uC73C\uB85C\uB294 \uAE30\uC5C5\uC744 \uC124\uBA85\uD560 \uC218 \uC5C6\uB2E4\uB294 \uC810\uC744 \uBC30\uC6E0\uC2B5\uB2C8\uB2E4. \uB9E4\uCD9C\uC774 0\uC6D0\uC778 \uAE30\uC5C5\uB3C4 \uACE7\uBC14\uB85C \uBD80\uC2E4\uB85C \uB2E8\uC815\uD560 \uAC83\uC774 \uC544\uB2C8\uB77C \uD68C\uACC4 \uAE30\uC900\uACFC \uC0AC\uC5C5 \uD2B9\uC131\uC744 \uD568\uAED8 \uBD10\uC57C \uD588\uACE0, \uBC95\uC778\uB4F1\uAE30\uC640 \uC8FC\uC8FC\uBA85\uBD80\uB97C \uB300\uC870\uD558\uBA70 \uB300\uD45C\uC774\uC0AC\uC640 \uC2E4\uC81C \uACBD\uC601\uC790\uAC00 \uB2E4\uB97C \uC218 \uC788\uB2E4\uB294 \uC810\uB3C4 \uD655\uC778\uD588\uC2B5\uB2C8\uB2E4. \uC774\uD6C4\uC5D0\uB294 \uC790\uB8CC\uB97C \uC218\uB3D9\uC801\uC73C\uB85C \uBC1B\uC544\uB4E4\uC774\uC9C0 \uC54A\uACE0, \uC774\uC0C1\uC774 \uBCF4\uC774\uBA74 \uB300\uD45C\uB2D8\uACFC \uC9C1\uC811 \uD1B5\uD654\uD558\uAC70\uB098 \uCCB4\uB0A9 \uC5EC\uBD80\uAE4C\uC9C0 \uD655\uC778\uD558\uBA70 \uB05D\uAE4C\uC9C0 \uC810\uAC80\uD588\uC2B5\uB2C8\uB2E4. \uC774 \uACBD\uD5D8\uC744 \uD1B5\uD574 \uAE30\uC5C5\uC744 \uC5EC\uB7EC \uAC01\uB3C4\uC5D0\uC11C \uC0C1\uD669\uC5D0 \uB9DE\uAC8C \uD574\uC11D\uD558\uB294 \uC5ED\uB7C9\uC744 \uD0A4\uC6B8 \uC218 \uC788\uC5C8\uC2B5\uB2C8\uB2E4.\n\n\uB458\uC9F8\uB85C, \uC0B0\uC5C5 \uC804\uBC18\uC5D0 \uB300\uD55C \uC774\uD574\uB3C4\uC785\uB2C8\uB2E4. \uB2F9\uD589 \uC778\uD134\uC73C\uB85C 3\uAC1C\uC6D4\uAC04 \uADFC\uBB34\uD558\uBA70 \uB125\uC2A4\uD2B8\uB77C\uC6B4\uB4DC\uC5D0 \uCC38\uC5EC\uD574 30\uC5EC \uAC1C \uC2A4\uD0C0\uD2B8\uC5C5\uC758 \uD53C\uCE6D\uC744 \uB4E4\uC5C8\uC2B5\uB2C8\uB2E4. \uC774\uB54C \uAE30\uC5C5\uC758 \uC131\uC7A5 \uAC00\uB2A5\uC131\uC744 \uBA3C\uC800 \uD310\uB2E8\uD558\uACE0, \uC2EC\uC0AC\uC5ED\uB2D8\uC758 \uC9C8\uC758\uC751\uB2F5\uACFC \uBE44\uAD50\uD574\uBCF4\uBA70 \uC0B0\uC5C5\uB9C8\uB2E4 \uC911\uC694\uD558\uAC8C \uBD10\uC57C \uD560 \uAE30\uC900\uC774 \uB2E4\uB974\uB2E4\uB294 \uC810\uC744 \uBC30\uC6E0\uC2B5\uB2C8\uB2E4. \uADF8 \uB4A4\uB85C\uB294 \uAC1C\uBCC4 \uAE30\uC5C5\uC744 \uB118\uC5B4 \uC0B0\uC5C5 \uC804\uCCB4\uB97C \uD568\uAED8 \uBCF4\uB824 \uD588\uC2B5\uB2C8\uB2E4. \uBC18\uB3C4\uCCB4 \uACF5\uC815\uACFC M&A \uAD00\uB828 \uC5F0\uC218\uC5D0 \uCC38\uAC00\uD574 \uC2DC\uC7A5\uC758 \uC8FC\uC694 \uD2B8\uB80C\uB4DC\uB97C \uD30C\uC545\uD588\uACE0, LP\uBCC4 \uCD9C\uC790\uC0AC\uC5C5 \uC815\uB9AC\uC640 \uAE30\uC0AC \uC2A4\uD06C\uB7A9\uC744 \uD1B5\uD574 \uD604\uC7AC \uC5B4\uB5A4 \uC0B0\uC5C5\uC774 \uC8FC\uBAA9\uBC1B\uB294\uC9C0, \uC815\uCC45 \uCD08\uC810\uC774 \uD5A5\uD6C4 \uC5B4\uB514\uC5D0 \uB9DE\uCDB0\uC838\uC57C \uD558\uB294\uC9C0 \uC0B4\uD3C8\uC2B5\uB2C8\uB2E4.\n\n\n[2-3] \uBD80\uC871\uD55C \uC5ED\uB7C9\uACFC \uBCF4\uC644 \uACC4\uD68D\uC740?\n\n\uC81C\uAC00 \uBD80\uC871\uD558\uB2E4\uACE0 \uC0DD\uAC01\uD558\uB294 \uC5ED\uB7C9\uC740 \uAE00\uB85C\uBC8C \uC5ED\uB7C9\uC785\uB2C8\uB2E4.\n\n\uC785\uD589 \uD6C4 \uBC18\uB144 \uC548\uC5D0 OPIc AL \uB4F1\uAE09\uC744 \uCDE8\uB4DD\uD558\uB294 \uAC83\uC744 \uCCAB \uBC88\uC9F8 \uBAA9\uD45C\uB85C \uC0BC\uACA0\uC2B5\uB2C8\uB2E4. \uC2E0\uC785 \uD589\uC6D0\uC73C\uB85C\uC11C \uBC14\uC05C \uB098\uB0A0\uC744 \uBCF4\uB0B4\uACA0\uC9C0\uB9CC, \uD1F4\uADFC \uD6C4\uC5D0\uB3C4 \uAFB8\uC900\uD788 \uC2DC\uAC04\uC744 \uD22C\uC790\uD558\uC5EC \uBE44\uC988\uB2C8\uC2A4 \uD68C\uD654\uC758 \uAE30\uBCF8\uAE30\uB97C \uBC18\uB4DC\uC2DC \uAC16\uCD94\uACA0\uC2B5\uB2C8\uB2E4. \uB098\uC544\uAC00 \uC77C\uBCF8\uC5B4 \uD559\uC6D0\uC744 \uB2E4\uB2C8\uBA70 JLPT N1 \uCDE8\uB4DD\uC744 \uC7A5\uAE30 \uBAA9\uD45C\uB85C \uC0BC\uC544, \uC81C2\uC678\uAD6D\uC5B4\uAE4C\uC9C0 \uAC16\uCD98 \uC778\uC7AC\uB85C \uC131\uC7A5\uD574 \uB098\uAC00\uACA0\uC2B5\uB2C8\uB2E4.\n\n\uC774\uC678\uC5D0\uB3C4 \uC778\uD134 \uB2F9\uC2DC \uD574\uC678\uCC44 \uBC1C\uD589 OJT\uB098 \uC120\uBC15\uAE08\uC735 \uC5F0\uC218 \uB4F1\uC5D0 \uC9C1\uC811 \uC2E0\uCCAD\uD558\uC5EC \uCC38\uC5EC\uD55C \uB9CC\uD07C, \uC785\uD589 \uD6C4\uC5D0\uB3C4 \uAE30\uD68C\uB97C \uB193\uCE58\uC9C0 \uC54A\uACE0 \uAE00\uB85C\uBC8C \uC5C5\uBB34 \uC5ED\uB7C9\uC744 \uB113\uD600\uAC00\uACA0\uC2B5\uB2C8\uB2E4.`, followups:[] },

    { id:'ex3', type:'\uC790\uC18C\uC11C', title:'\uBB38\uD56D3. \uC911\uC694 \uAC00\uCE58 & \uC801\uC6A9', period:'', summary:'\uC9C1\uC5C5\uC801 \uC0AC\uBA85\uAC10 / \uC758\uBBF8 \uCC3E\uAE30', body:`[3-1] \uBCF8\uC778\uC774 \uC911\uC694\uD558\uAC8C \uC0DD\uAC01\uD558\uB294 \uAC00\uCE58\uB294?\n\n'\uB0B4\uAC00 \uD558\uB294 \uC77C\uC758 \uAC00\uCE58\uB97C \uC544\uB294 \uC0AC\uBA85\uAC10'\n\n\n[3-2] \uADF8 \uAC00\uCE58\uB97C \uC911\uC694\uD558\uAC8C \uC0DD\uAC01\uD558\uB294 \uC774\uC720\uC640 \uC77C\uC0C1 \uC801\uC6A9\uC740?\n\n\uC800\uB294 \uC9C1\uC5C5\uC801 \uC0AC\uBA85\uAC10\uC774 \uC9C1\uC7A5\uC778\uC73C\uB85C\uC11C\uC758 \uC5ED\uB7C9 \uAC1C\uBC1C\uACFC \uC131\uACFC \uB2EC\uC131\uC5D0 \uC788\uC5B4 \uAC00\uC7A5 \uC911\uC694\uD55C \uAC00\uCE58\uB77C\uACE0 \uC0DD\uAC01\uD569\uB2C8\uB2E4. \uB0B4\uAC00 \uD558\uB294 \uC77C\uC774 \uC5B4\uB5A4 \uC758\uBBF8\uB97C \uC9C0\uB2C8\uB294\uC9C0 \uC54E\uC73C\uB85C\uC368 \uC5C5\uBB34\uC758 \uBCF4\uB78C\uC744 \uB290\uB07C\uACE0, \uC5C5\uBB34 \uC5ED\uB7C9 \uACC4\uBC1C\uC758 \uAC15\uB825\uD55C \uB3D9\uAE30\uAC00 \uB418\uAE30 \uB54C\uBB38\uC785\uB2C8\uB2E4.\n\n\uBD80\uB3D9\uC0B0 \uAE30\uAD00 \uC778\uD134 \uB2F9\uC2DC, \uB2E8\uC21C \uC2A4\uCE94\uACFC \uC11C\uB958 \uCD9C\uB825 \uC5C5\uBB34\uB97C \uBC18\uBCF5\uD558\uBA70 \uD765\uBBF8\uB97C \uB290\uB07C\uC9C0 \uBABB\uD588\uB358 \uC801\uC774 \uC788\uC2B5\uB2C8\uB2E4. \uD558\uC9C0\uB9CC \uC81C\uAC00 \uC815\uB9AC\uD55C \uC790\uB8CC\uAC00 \uD1A0\uC9C0 \uBCF4\uC0C1\uC561 \uC0B0\uC815\uACFC \uACF5\uC2DC \uC5C5\uBB34\uC758 \uAE30\uCD08 \uC790\uB8CC\uB85C \uD65C\uC6A9\uB41C\uB2E4\uB294 \uC810\uC744 \uC54C\uAC8C \uB41C \uD6C4 \uC5C5\uBB34 \uD6A8\uB2A5\uAC10\uC744 \uB290\uAF08\uC2B5\uB2C8\uB2E4. \uC544\uBB34\uB9AC \uB2E8\uC21C\uD574 \uBCF4\uC774\uB294 \uC5C5\uBB34\uB77C\uB3C4 \uACF5\uC801 \uAC00\uCE58\uC5D0 \uAE30\uC5EC\uD558\uACE0 \uC788\uC5C8\uB358 \uAC83\uC785\uB2C8\uB2E4.\n\n\uC911\uC18C\uAE30\uC5C5 \uBCF4\uC99D\uC11C \uC5F0\uC7A5 \uC5C5\uBB34\uB97C \uB9E1\uC558\uC744 \uB54C\uB3C4 \uC77C\uC774 \uB9CE\uC544 \uC9C0\uCE60 \uB54C\uAC00 \uC788\uC5C8\uC9C0\uB9CC, \uD55C \uAC74 \uD55C \uAC74\uC774 \uAE30\uC5C5\uC758 \uC0C8\uB85C\uC6B4 \uB3C4\uC804\uC744 \uC9C0\uC6D0\uD55C\uB2E4\uB294 \uC758\uBBF8\uB97C \uB5A0\uC62C\uB9AC\uBA70 \uB2E4\uC2DC \uD798\uC744 \uB0BC \uC218 \uC788\uC5C8\uC2B5\uB2C8\uB2E4. \uC774\uCC98\uB7FC \uC800\uB294 \uB2E8\uC21C\uD55C \uC77C\uC5D0\uC11C\uB3C4 \uC758\uBBF8\uB97C \uCC3E\uACE0 \uC2A4\uC2A4\uB85C \uB3D9\uAE30\uB97C \uBD80\uC5EC\uD558\uBA70, \uB9E1\uC740 \uBC14\uC5D0 \uCD5C\uC120\uC744 \uB2E4\uD558\uACE0\uC790 \uB178\uB825\uD558\uACE0 \uC788\uC2B5\uB2C8\uB2E4.\n\n\uD55C\uAD6D\uC0B0\uC5C5\uC740\uD589\uC740 \uACBD\uC81C \uC804\uBC18\uC5D0 \uD070 \uC601\uD5A5\uB825\uC744 \uB07C\uCE58\uB294 \uAE30\uAD00\uC785\uB2C8\uB2E4. \uC81C\uAC00 \uD558\uB294 \uC77C\uC774 \uB9E4\uC6B0 \uAC00\uCE58 \uC788\uC74C\uC744 \uBBFF\uACE0, \uC81C \uC5C5\uBB34\uB97C \uC9C4\uC2EC\uC73C\uB85C \uC790\uB791\uC2A4\uB7EC\uC6CC\uD558\uB294 \uC9C1\uC7A5\uC778\uC73C\uB85C\uC11C \uC0AC\uBA85\uAC10\uC744 \uAC00\uC9C0\uACE0 \uADFC\uBB34\uD560 \uAC83\uC785\uB2C8\uB2E4.`, followups:[] },

    { id:'ex4', type:'\uC790\uC18C\uC11C', title:'\uBB38\uD56D4. \uBCC0\uD654 \uC2DC\uB3C4 \uACBD\uD5D8', period:'', summary:'PC Off\uC81C / \uD504\uB85C\uC138\uC2A4 \uAC1C\uC120 / 100\uC5EC \uAC74 \uC5F0\uC7A5', body:`[4-1] \uD504\uB808\uC784\uC744 \uD0C8\uD53C\uD574 \uC0C8\uB85C\uC6B4 \uBCC0\uD654\uB97C \uC2DC\uB3C4\uD55C \uACBD\uD5D8\uC740?\n\n'\uD1F4\uADFC \uC804 \uBC18\uBCF5\uB418\uB358 \uC2E4\uC218\uB97C \uD504\uB85C\uC138\uC2A4 \uBCC0\uD654\uB85C \uADF9\uBCF5\uD55C \uACBD\uD5D8'\n\n\n[4-2] \uBCC0\uD654\uAC00 \uD544\uC694\uD588\uB358 \uC774\uC720\uC640 \uBCF8\uC778\uC758 \uC5ED\uD560\u00B7\uD589\uB3D9\uC740?\n\n\uBCF4\uC99D\uAE30\uAD00 \uADFC\uBB34 \uB2F9\uC2DC, 'PC Off\uC81C'\uB85C \uC778\uD574 \uD1F4\uADFC \uC9C1\uC804\uC5D0 \uC5C5\uBB34\uC6A9 PC\uAC00 \uC790\uB3D9 \uC885\uB8CC\uB418\uC5C8\uC2B5\uB2C8\uB2E4. \uC774\uB85C \uC778\uD574 \uC5C5\uBB34 \uB9C8\uAC10 \uC9C1\uC804\uC5D0 \uBCF4\uC99D\uB8CC \uB0A9\uBD80 \uC5C5\uBB34\uAC00 \uBAB0\uB9AC\uBA74\uC11C \uAE09\uD558\uAC8C \uCC98\uB9AC\uD574\uC57C \uD558\uB294 \uC0C1\uD669\uC774 \uBC18\uBCF5\uB418\uC5C8\uC2B5\uB2C8\uB2E4. \uD2B9\uD788 \uB2F9\uC77C \uACB0\uC7AC\uAC00 \uD544\uC218\uC600\uAE30\uC5D0 \uCD08\uC870\uD568\uC73C\uB85C \uC2E4\uC218\uB97C \uD558\uAE30\uB3C4 \uD588\uC2B5\uB2C8\uB2E4.\n\n\uC774\uB97C \uD574\uACB0\uD558\uAE30 \uC704\uD574 \uCCAB\uC9F8\uB85C, \uC624\uD6C4 3\uC2DC\uBD80\uD130 \uBCF4\uB958 \uC911\uC778 \uBCF4\uC99D\uB8CC \uB0A9\uBD80 \uC11C\uB958 3\uC885\uC744 \uBBF8\uB9AC \uC900\uBE44\uD588\uC2B5\uB2C8\uB2E4. \uB458\uC9F8\uB85C, \uACB0\uC7AC \uC694\uCCAD\uCC3D\uC744 \uD654\uBA74\uC5D0 \uBBF8\uB9AC \uB744\uC6CC\uB193\uC544 \uC989\uC2DC \uC785\uB825\uD560 \uC218 \uC788\uB3C4\uB85D \uB300\uBE44\uD558\uB294 \uD55C\uD3B8, \uB300\uD45C\uB2D8\uB4E4\uAED8 \uC870\uAE30 \uB0A9\uBD80 \uBC29\uBC95\uC744 \uBB38\uC790\uB85C \uC548\uB0B4\uD558\uC5EC \uB9C8\uAC10 \uC2DC\uAC04\uB300\uC5D0 \uBAB0\uB9AC\uB294 \uAC74\uC218\uB97C \uC904\uC600\uC2B5\uB2C8\uB2E4.\n\n\uADF8 \uACB0\uACFC 100\uC5EC \uAC1C \uC5C5\uCCB4\uC758 \uBCF4\uC99D\uC11C\uB97C \uCC28\uC9C8\uC5C6\uC774 \uC5F0\uC7A5\uD560 \uC218 \uC788\uC5C8\uC2B5\uB2C8\uB2E4.\n\n\n[4-3] \uADF8 \uACBD\uD5D8\uC5D0\uC11C \uC5BB\uC740 \uAD50\uD6C8\uC740?\n\n\uC81C\uAC00 \uC5BB\uC740 \uAD50\uD6C8\uC740 \uACBD\uD5D8\uC744 \uD1B5\uD55C \uD559\uC2B5\uACFC \uC131\uC7A5\uC774 \uBB34\uC5C7\uBCF4\uB2E4 \uC911\uC694\uD558\uB2E4\uB294 \uAC83\uC785\uB2C8\uB2E4. \uC2E4\uC81C\uB85C \uC120\uBC30\uB2D8\uB4E4\uAED8\uC11C\uB3C4 \uBC18\uBCF5\uB418\uB294 \uBB38\uC81C\uB9C8\uB2E4 \uBCF8\uC778\uB9CC\uC758 \uB178\uD558\uC6B0\uB85C \uD6A8\uC728\uC801\uC73C\uB85C \uB300\uCC98\uD558\uACE0 \uACC4\uC168\uC2B5\uB2C8\uB2E4.\n\n\uC2E0\uC785\uD589\uC6D0\uC73C\uB85C\uC11C \uB9C8\uC8FC\uD560 \uC5EC\uB7EC \uC5B4\uB824\uC6C0 \uB610\uD55C \uC120\uBC30\uB2D8\uB4E4\uC758 \uC9C0\uB3C4\uC640 \uC18C\uC911\uD55C \uACBD\uD5D8\uC744 \uC591\uBD84 \uC0BC\uC544 \uCDA9\uBD84\uD788 \uAC1C\uC120\uD574 \uB098\uAC08 \uC218 \uC788\uB2E4\uACE0 \uBBFF\uC2B5\uB2C8\uB2E4. \uB298 \uBC30\uC6B0\uACE0\uC790 \uD558\uB294 \uC790\uC138\uB85C \uC131\uC2E4\uD788 \uC784\uD558\uBA70, \uC800\uB9CC\uC758 \uC804\uBB38\uC801\uC778 \uD398\uC774\uC2A4\uB97C \uCC3E\uC544\uAC00\uACA0\uC2B5\uB2C8\uB2E4.`, followups:[] },

    { id:'ex5', type:'\uC790\uC18C\uC11C', title:'\uBB38\uD56D5. \uAC00\uC7A5 \uC5F4\uC815\uC744 \uC3DF\uC740 \uD65C\uB3D9', period:'', summary:'\uC11C\uBE0C\uC6E8\uC774 / \uB9E4\uB2C8\uC800 \uBC1C\uD0C1 / \uB4F1\uB85D\uAE08 \uB9C8\uB828', body:`[5-1] \uAC00\uC7A5 \uC5F4\uC815\uC744 \uC3DF\uC558\uB358 \uD65C\uB3D9\uC740?\n\n'\uB4F1\uB85D\uAE08\uC744 \uC704\uD574 \uC2DC\uC791\uD574, \uB9E4\uB2C8\uC800\uB85C \uC778\uC815\uBC1B\uC740 \uCCAB \uC544\uB974\uBC14\uC774\uD2B8'\n\n\n[5-2] \uADF8 \uD65C\uB3D9\uC758 \uAD6C\uCCB4\uC801 \uB0B4\uC6A9\uACFC \uC131\uACFC\uB294?\n\n\uD559\uAE30 \uB4F1\uB85D\uAE08\uC744 \uC2A4\uC2A4\uB85C \uB9C8\uB828\uD558\uACA0\uB2E4\uB294 \uBAA9\uD45C\uB85C \uC0CC\uB4DC\uC704\uCE58 \uB9E4\uC7A5\uC5D0\uC11C \uC8FC 5\uC77C \uADFC\uBB34\uB97C \uC2DC\uC791\uD588\uC2B5\uB2C8\uB2E4. \uCC98\uC74C \uC811\uD558\uB294 \uBE0C\uB79C\uB4DC\uC778 \uB370\uB2E4 \uC810\uC2EC\uB9C8\uB2E4 \uBB38 \uBC16\uAE4C\uC9C0 \uC904\uC774 \uC11C\uB294 \uACF3\uC774\uB77C \uC801\uC751\uC774 \uD798\uB4E4\uC5C8\uC2B5\uB2C8\uB2E4. \uD558\uC9C0\uB9CC \uD560 \uC218 \uC788\uB294 \uC77C\uBD80\uD130 \uD558\uB098\uC529 \uB354 \uB9E1\uACE0\uC790 \uD588\uC2B5\uB2C8\uB2E4. \uC8FC\uBB38, \uBE75 \uC370\uAE30, \uC124\uAC70\uC9C0\uAE4C\uC9C0 \uAC00\uB2A5\uD55C \uC5C5\uBB34\uB97C \uBAA8\uB450 \uB9E1\uC544 \uCC98\uB9AC\uD588\uACE0, \uD53C\uD06C\uC2DC\uAC04\uC5D0\uB294 \uAC00\uC7A5 \uBC14\uC05C \uC704\uCE58\uC5D0 \uC790\uC9C4\uD574 \uB4E4\uC5B4\uAC14\uC2B5\uB2C8\uB2E4. \uADFC\uBB34 \uC678 \uC2DC\uAC04\uC5D0\uB3C4 \uBA54\uB274\uC640 \uC791\uC5C5 \uC21C\uC11C\uB97C \uBC18\uBCF5 \uC5F0\uC2B5\uD558\uBA70 \uC219\uB828\uB3C4\uB97C \uB192\uC600\uACE0, \uADF8 \uACB0\uACFC \uC0AC\uC7A5\uB2D8\uC758 \uC2E0\uB8B0\uB97C \uC5BB\uC5B4 \uB9E4\uB2C8\uC800\uB85C \uBC1C\uD0C1\uB418\uC5C8\uC2B5\uB2C8\uB2E4. \uC774\uD6C4 1\uB144\uAC04 \uADFC\uBB34\uB97C \uC774\uC5B4\uAC00\uBA70 \uB4F1\uB85D\uAE08\uC744 \uC804\uC561 \uB9C8\uB828\uD560 \uC218 \uC788\uC5C8\uC2B5\uB2C8\uB2E4.\n\n\n[5-3] \uADF8 \uD65C\uB3D9\uC774 \uBCF8\uC778\uC758 \uC0B6\uC5D0 \uC900 \uC601\uD5A5\uC740?\n\n\uC774 \uACBD\uD5D8\uC744 \uD1B5\uD574, \uC800\uB294 \uACB0\uACFC\uB97C \uB9CC\uB4E4\uAE30 \uC704\uD574 \uD544\uC694\uD55C \uAC83\uC740 \uC7AC\uB2A5\uBCF4\uB2E4 \uD0DC\uB3C4\uB77C\uB294 \uAC83\uC744 \uAE68\uB2EC\uC558\uC2B5\uB2C8\uB2E4. \uAC15\uC758\uAC00 \uB05D\uB098\uBA74 \uACE7\uC7A5 \uB9E4\uC7A5\uC73C\uB85C \uCD9C\uADFC\uD588\uACE0 \uC7A0\uC774 \uBD80\uC871\uD55C \uB0A0\uC774 \uB298\uBA70 \uC26C\uC6B4 \uC77C\uC744 \uCC3E\uC544\uBCFC\uAE4C \uD558\uB294 \uC0DD\uAC01\uC774 \uB4E4\uAE30\uB3C4 \uD588\uC9C0\uB9CC, \uB9E1\uC740 \uC77C\uC744 \uB05D\uAE4C\uC9C0 \uD574\uB0B4\uB294 \uACFC\uC815\uC5D0\uC11C \uC2A4\uC2A4\uB85C\uC5D0 \uB300\uD55C \uAE30\uC900\uC774 \uB192\uC544\uC84C\uC2B5\uB2C8\uB2E4. \uC774\uD6C4 \uC5B4\uB5A4 \uC77C\uC774\uB4E0 \uC8FC\uC5B4\uC9C4 \uB9CC\uD07C\uB9CC \uD558\uB294 \uAC83\uC774 \uC544\uB2C8\uB77C \uC2A4\uC2A4\uB85C \uAE30\uC900\uC744 \uB04C\uC5B4\uC62C\uB9AC\uB294 \uC2B5\uAD00\uC774 \uC790\uB9AC\uC7A1\uAC8C \uB418\uC5C8\uC2B5\uB2C8\uB2E4. \uC774\uB7EC\uD55C \uD0DC\uB3C4\uB97C \uBC14\uD0D5\uC73C\uB85C \uC785\uD589 \uC774\uD6C4\uC5D0\uB3C4 \uAFB8\uC900\uD788 \uC131\uACFC\uB97C \uB9CC\uB4E4\uC5B4\uB0B4\uACA0\uC2B5\uB2C8\uB2E4.`, followups:[] },

    { id:'ex6', type:'\uC778\uD134', title:'\uD55C\uAD6D\uC0B0\uC5C5\uC740\uD589 \uC815\uCC45\uD380\uB4DC\uAE08\uC735\uC2E4', period:'2025.05.26 ~ 2025.08.29', summary:'\uC6B4\uC6A9\uC0AC \uC120\uC815 \uC9C0\uC6D0\u00B7\uC815\uCC45\uD380\uB4DC \uCD9C\uC790\uC0AC\uC5C5 \uBCF4\uC870 / \uB125\uC2A4\uD2B8\uB77C\uC6B4\uB4DC 30\uC5EC \uC0AC \uD53C\uCE6D', body:`\uB2F4\uB2F9\uC5C5\uBB34: \uC6B4\uC6A9\uC0AC \uC120\uC815 \uC9C0\uC6D0 \uBC0F \uAD00\uB828 \uC790\uB8CC \uC870\uC0AC \uB4F1 \uC815\uCC45\uD380\uB4DC \uCD9C\uC790\uC0AC\uC5C5 \uBCF4\uC870.\n\n\uB125\uC2A4\uD2B8\uB77C\uC6B4\uB4DC\uC5D0 \uCC38\uC5EC\uD574 30\uC5EC \uAC1C \uC2A4\uD0C0\uD2B8\uC5C5\uC758 \uD53C\uCE6D\uC744 \uB4E4\uC73C\uBA70 \uC0B0\uC5C5\uBCC4 \uD3C9\uAC00 \uAE30\uC900\uC758 \uCC28\uC774\uB97C \uD559\uC2B5. \uBC18\uB3C4\uCCB4 \uACF5\uC815\u00B7M&A \uC5F0\uC218\uC5D0 \uCC38\uAC00\uD574 \uC2DC\uC7A5 \uD2B8\uB80C\uB4DC\uB97C \uD30C\uC545. LP\uBCC4 \uCD9C\uC790\uC0AC\uC5C5 \uC815\uB9AC\uC640 \uAE30\uC0AC \uC2A4\uD06C\uB7A9\uC744 \uD1B5\uD574 \uC815\uCC45 \uCD08\uC810\uC744 \uC810\uAC80.`, followups:[] },

    { id:'ex_kab', type:'\uC778\uD134', title:'\uD55C\uAD6D\uBD80\uB3D9\uC0B0\uC6D0', period:'', summary:'\uD1A0\uC9C0 \uBCF4\uC0C1\u00B7\uACF5\uC2DC \uAE30\uCD08\uC790\uB8CC \uC815\uB9AC / \uB2E8\uC21C\uC5C5\uBB34 \uC18D \uACF5\uC801 \uAC00\uCE58 \uC778\uC9C0', body:`\uB2F4\uB2F9\uC5C5\uBB34: \uB2E8\uC21C \uC2A4\uCE94\uACFC \uC11C\uB958 \uCD9C\uB825 \uC5C5\uBB34.\n\n\uCD08\uAE30\uC5D0\uB294 \uD765\uBBF8\uB97C \uB290\uB07C\uC9C0 \uBABB\uD588\uC73C\uB098, \uC81C\uAC00 \uC815\uB9AC\uD55C \uC790\uB8CC\uAC00 \uD1A0\uC9C0 \uBCF4\uC0C1\uC561 \uC0B0\uC815\uACFC \uACF5\uC2DC \uC5C5\uBB34\uC758 \uAE30\uCD08 \uC790\uB8CC\uB85C \uD65C\uC6A9\uB41C\uB2E4\uB294 \uC810\uC744 \uC54C\uAC8C \uB41C \uD6C4 \uC5C5\uBB34 \uD6A8\uB2A5\uAC10\uC744 \uB290\uB08C. \uB2E8\uC21C\uD574 \uBCF4\uC774\uB294 \uC5C5\uBB34\uB77C\uB3C4 \uACF5\uC801 \uAC00\uCE58\uC5D0 \uAE30\uC5EC\uD55C\uB2E4\uB294 \uC810\uC744 \uCCB4\uAC10 \u2014 \uC9C1\uC5C5\uC801 \uC0AC\uBA85\uAC10\uC758 \uCD9C\uBC1C\uC810.`, followups:[] },

    { id:'ex7', type:'\uC778\uD134', title:'\uC2E0\uC6A9\uBCF4\uC99D\uAE30\uAE08 \uC601\uC5C5\uC810', period:'2024.09.04 ~ 2024.11.29', summary:'\uC911\uAE30 \uBCF4\uC99D \uC5F0\uC7A5\u00B7\uAC31\uC2E0 / PC Off\uC81C \uD504\uB85C\uC138\uC2A4 \uAC1C\uC120', body:`\uB2F4\uB2F9\uC5C5\uBB34: \uC911\uC18C\uAE30\uC5C5 \uBCF4\uC99D \uC5F0\uC7A5\u00B7\uAC31\uC2E0 \uAD00\uB828 \uC870\uAC74\uBCC0\uACBD \uC5C5\uBB34 \uC218\uD589.\n\n\uC22B\uC790\uB9CC\uC73C\uB85C \uAE30\uC5C5\uC744 \uC124\uBA85\uD560 \uC218 \uC5C6\uB2E4\uB294 \uC810\uC744 \uBC30\uC6C0. \uB9E4\uCD9C 0\uC6D0 \uAE30\uC5C5\uB3C4 \uD68C\uACC4 \uAE30\uC900\uACFC \uC0AC\uC5C5 \uD2B9\uC131\uC744 \uD568\uAED8 \uBCF4\uACE0, \uBC95\uC778\uB4F1\uAE30\uC640 \uC8FC\uC8FC\uBA85\uBD80\uB97C \uB300\uC870\uD558\uBA70 \uC2E4\uC81C \uACBD\uC601\uC790\uB97C \uD655\uC778. \uC774\uC0C1\uC774 \uBCF4\uC774\uBA74 \uB300\uD45C\uC640 \uC9C1\uC811 \uD1B5\uD654\uD558\uAC70\uB098 \uCCB4\uB0A9 \uC5EC\uBD80\uAE4C\uC9C0 \uB05D\uAE4C\uC9C0 \uC810\uAC80.\n\nPC Off\uC81C\uB85C \uB9C8\uAC10 \uC9C1\uC804 \uBCF4\uC99D\uB8CC \uB0A9\uBD80\uAC00 \uBAB0\uB9AC\uB294 \uBB38\uC81C\uB97C, \uC624\uD6C4 3\uC2DC\uBD80\uD130 \uC11C\uB958 \uC0AC\uC804 \uC900\uBE44\u00B7\uACB0\uC7AC\uCC3D \uC0AC\uC804 \uB178\uCD9C\u00B7\uB300\uD45C\uB4E4\uAED8 \uC870\uAE30 \uB0A9\uBD80 \uBB38\uC790 \uC548\uB0B4\uB85C \uD574\uACB0\uD574 100\uC5EC \uAC1C \uC5C5\uCCB4 \uBCF4\uC99D\uC11C\uB97C \uCC28\uC9C8 \uC5C6\uC774 \uC5F0\uC7A5.`, followups:[] },

    { id:'ex8', type:'\uD65C\uB3D9', title:'\uD76C\uB9DD\uC774\uC74C \uC11C\uD3EC\uD130\uC988', period:'2020.07.31 ~ 2021.02.17', summary:'\uC9C0\uC5ED \uC6B0\uC218\uAE30\uC5C5 \uD64D\uBCF4 / \uACBD\uC9C4\uB300\uD68C \uAE08\uC0C1', body:`\uC9C0\uC5ED \uC6B0\uC218\uAE30\uC5C5 \uD0D0\uBC29 \uD6C4\uAE30 \uD64D\uBCF4 \uCEE8\uD150\uCE20 \uBC0F \uAC1C\uC120 \uC544\uC774\uB514\uC5B4 \uC81C\uC548. \uC9C0\uC5ED \uC6B0\uC218 \uAE30\uC5C5 \uD64D\uBCF4 \uD65C\uB3D9\uC744 \uD1B5\uD574 \uAD6C\uC778 \uBBF8\uC2A4\uB9E4\uCE58 \uD574\uC18C.\n\n\uACBD\uC9C4\uB300\uD68C\uC5D0\uC11C \uD604\uD669 \uBD84\uC11D \uBC0F \uAC1C\uC120 \uBC29\uD5A5 \uC81C\uC548\uD558\uC5EC \uAE08\uC0C1 \uC218\uC0C1.`, followups:[] },

    { id:'q105',cat:'c13', q:'산업은행 지원 동기는?', kw:'위기/진화/사명/파급력', answers:['위기 속에서 더 강해지는 기관, 함께 새 해답 만들고 싶음.','업무·기능이 시대마다 진화하는 조직.','시대적 사명 — 구조조정·첨단산업 육성 등 가장 무거운 책임.','기간산업 대체불가 파급력, 장기자금 조달 차별화.'], tail:'시중은행 아닌 이유?' },
    { id:'q106',cat:'c13', q:'왜 산업은행인가?', kw:'위기/진화', answers:['국가 위기마다 업무·기능 확장하며 함께 성장.','시장실패 보완+산업정책 지원+신시장 창출+위기시 시장안정자.','70년대 중화학→80년대 부품소재→90년대 첨단/해외진출→2000년대 구조조정·벤처→2015~ 혁신성장→최근 탄소중립·디지털전환.'], tail:'' },
    { id:'q107',cat:'c13', q:'산업은행 강점/약점과 보완은?', kw:'신속재정/조직DNA/자금조달/모험자본/종합지원', answers:['[강점1 신속한 재정정책] 재정정책은 직접적이나 신속성↓, 산은은 정부 기조에 맞춰 즉시 집행 가능.','[강점2 조직 DNA] 위기를 통해 습득한 무형자산 — 정책금융 노하우+협업문화 내재.','[강점3 자금조달능력] 국채와 동일 신용등급 → 저렴하게 재원 조달.','[강점4 모험자본] 민간 감당 어려운 위험구간 공급, 딥테크 신호효과로 민간 후속투자 촉진.','[강점5 종합적 지원] 독립적 지원이 아닌 유기적 패키지 — M&A는 자문+주선+투자+인수금융, 벤처는 딜소싱+엑셀+스케일업+엑시트까지.','[약점1 제너럴리스트] 한 산업·금융기법 장기 전문성 한계 → 산업 전반 시야가 넓은 제너럴리스트 역량으로 전환.','[약점2 재무건전성] 부실채권/구조조정 지분 악화 — 정책금융 특성상 불가피, 바젤3 LCR(단기)·NSFR(장기)로 철저 관리.'], tail:'' },
    { id:'q108',cat:'c13', q:'산은의 리스크 관리는?', kw:'LCR/NSFR/BIS', answers:['LCR(유동성커버리지): 스트레스 시 고유동성자산 확보.','NSFR(순안정자금조달): 장기 유동성 비율.','BIS 13% 이상 권고 — 미달 시 대출여력 급감.','수익성 ROA 1% 미만 — 정책금융 특성상 불가피.'], tail:'' },
    { id:'q109',cat:'c13', q:'산업은행 개선점·유의해야 할 점은?', kw:'산업전문인력/연명X/고부가가치전환', answers:['[산업 전문 인력] 첨단산업 육성 핵심과제, 기술 난도 급상승 — 이공계 전문성 갖춘 평가 인력 확충.','[연명X] 성장성 없고 자구노력 적은 업체 공급 감소 — 한계기업 자연 퇴출되도록 선별적 지원.','[고부가가치 전환] 혁신 스타트업도 좋지만 기존 전통 기간산업의 기술혁신으로 고부가가치화도 중요 — 인프라·R&D 장려.','시장실패 보완 → mission-oriented 정책금융 전환.','정권 무관한 자율성, 공공성·수익성 균형.','온랜딩 — 자산규모 배분으로 지역은행 저조, 특수목적 기금 필요.'], tail:'' },
    { id:'q111',cat:'c13', q:'산업은행의 자금조달 방법은?', kw:'산금채/정부출자', answers:['정부 직접 조달 또는 산금채 발행.','자본금 45조원 이내, 정부 51% 이상 출자.','첨단전략산업기금채권은 정부보증채.'], tail:'' },
    { id:'q112',cat:'c13', q:'공정성 vs 수익성?', kw:'정책금융본질', answers:['정책금융기관 본질은 공정성·공공성 우선.','다만 수익성 확보가 지속가능한 정책지원의 토대.','균형이 핵심.'], tail:'' },
    { id:'q113',cat:'c13', q:'구조조정 현황과 원칙은?', kw:'HMM/석유화학/3원칙', answers:['HMM: 출자전환으로 35% 지분, 블록딜로 시장충격 최소화하며 매각 추진.','석유화학: 대주주 책임/이해관계자 고통분담/지속가능 정상화.','구조조정 3원칙 — ①대주주 책임 ②이해관계자 고통분담 ③지속가능 정상화.','자기자본 15% 초과 지분 보유 시 위험가중치 1250% — BIS 부담.','사전적 컨설팅·M&A 강화로 부실 예방, 채권단 관리 최소화 후 신속 민간매각.'], tail:'헐값매각 시비?' },
    { id:'q114',cat:'c13', q:'대기업 vs 중소기업 비율은?', kw:'기간산업', answers:['기간산업·대규모 시설자금 비중 높음.','중소·벤처는 정책 혁신성장펀드·온랜딩 통해 지원.'], tail:'' },
    { id:'q115',cat:'c13', q:'수익 창출 방안은?', kw:'예대마진X/딜링', answers:['개인예금·주담대 거의 없어 예대마진 미미.','주식·파생·외환 딜링으로 직접 수익 창출.','지분투자 회수 차익.'], tail:'' },
    { id:'q116',cat:'c13', q:'산은의 가장 큰 고민(이슈)은?', kw:'국민성장펀드150조', answers:['국민성장펀드 150조 — 현 시대적 사명.','첨단기금채권 발행으로 안정 조달.','운용사 선정 — 잊혀지지 않게 관리.','한국경제 골든타임 — 지금이 중요.'], tail:'' },
    { id:'q117',cat:'c13', q:'산은 행원의 덕목과 부합 여부는?', kw:'규정/청렴/수용성/자기계발/소통', answers:['규정 준수(신뢰) — 감보다 팩트.','청렴 — 산업의 커맨드센터·넥서스.','수용성 — 시대 트렌드 선제적 대응.','지속적 자기계발.','소통/협업.'], tail:'' },
    { id:'q118',cat:'c13', q:'산업은행 vs 시중은행은?', kw:'정책성/장기/파급력', answers:['수익성(시중) vs 정책성(산은).','업무 영역 차이 — 산은은 다방면·기간산업에 대체불가 파급력.','장기자금 주력 — 기간산업이 어려움 극복할 시간 제공.','산은법 제1조 — 산업개발·SOC·지역개발·금융안정·지속가능 성장.'], tail:'' },
    { id:'q119',cat:'c13', q:'산업은행 미션·비전은?', kw:'1%책임/글로벌리더', answers:['미션: 대한민국 경제의 1%를 책임지는 정책금융기관.','비전: 대한민국과 함께 성장하는 글로벌 금융 리더, 더 큰 KDB.'], tail:'' },
    { id:'q120',cat:'c13', q:'산업은행 지점수는?', kw:'61개', answers:['61개.'], tail:'' },
    { id:'q121',cat:'c13', q:'산은 면접 떨어진다면 이유? 나를 뽑아야 하는 이유?', kw:'계산된도전/점검습관', answers:['익숙함에서 벗어나 계산된 도전.','한번 더 점검하는 습관.','책임감으로 사회적 신뢰 확보.','열린 마음으로 변화 수용.'], tail:'' },
    { id:'q122',cat:'c13', q:'입사 후 1년/3년/5년 계획은?', kw:'네트워크/벤처/멘토', answers:['1년: 사수에게 업무·네트워크 노하우 흡수 — 금융은 무형가치라 인적 네트워크가 핵심.','3년: 벤처투자 육성 — 데스밸리 기업의 투자·재투자 간극 메우기.','5년: 자기에 엄격·타인에 너그러운 멘토. 어느 부서든 5년차 계획 병행.'], tail:'바라던 업무 안 될 가능성 99.99%' },
    { id:'q123',cat:'c13', q:'입사 후 최종 목표·비전은?', kw:'', answers:[], tail:'' },
    { id:'q124',cat:'c13', q:'첨단전략산업기금이란?', kw:'75조/정부보증채/WGBI', answers:['첨단전략산업·생태계 종합지원 75조 규모.','첨단전략산업기금채권 — 정부보증채.','WGBI 편입·만기 20년 → 시장충격 제한.','금리인하 기조라 구축효과 제한적.'], tail:'' },
    { id:'q125',cat:'c13', q:'산업은행 주요산업 정리는?', kw:'탄소중립/저탄소', answers:['산업금융협력프로그램 — 산업단위 통합 금융지원.','국내 최초 탄소전용상품 KDB탄소스프레드 — 저탄소 생태계 투자 지원.'], tail:'' },
    { id:'q126',cat:'c13', q:'산은 근무하면서 어려워보이는 것은?', kw:'순환근무/제너럴리스트', answers:['순환근무·다양한 업무 → 끊임없는 학습.','제너럴리스트로서 산업 전반 이해 필수.','첨단산업 위주 재편으로 난이도 상승.','디지털 헬퍼 창구 — 어르신 많은 지역 배치 개선 필요.'], tail:'' },
    { id:'q127',cat:'c13', q:'산은 오기 위해 이것까지 해봤다?', kw:'산은법/자본금', answers:['산은법 제1조 목적 숙지.','자본금 45조 이내·정부 51% 이상 출자 구조 학습.'], tail:'' },

    {"id": "qk1", "cat": "c14", "q": "캠코의 강점은?", "kw": "재기의 출발점/국가경제 안전판", "answers": [], "tail": "", "fullAnswer": "캠코의 강점은, 부실을 손실로 끝내지 않고 재기의 출발점으로 바꾼다는 데 있다고 생각합니다. 상업금융은 부실채권을 떨어내야 할 손실로 보지만, 캠코는 그걸 인수해 채무자의 재기와 자산 가치 회복으로 이어갑니다. 시장이 감당하기 어려운 부분을 받아내기 때문에, IMF 외환위기 때부터 위기 때마다 국가경제의 안전판 역할을 해올 수 있었다고 봅니다.", "priority": "high"},
    {"id": "qk2", "cat": "c14", "q": "캠코의 약점은?", "kw": "제너럴리스트/부문 넘나드는 시야/새 분야 선호", "answers": [], "tail": "", "fullAnswer": "캠코의 약점이라면, 가계·기업·공공을 모두 다루는 만큼 한 분야를 오래 깊이 파고들기 어렵다는 점입니다. 다만 같은 이유로 특정 이해관계에 치우치지 않고 부문을 넘나들며 판단할 수 있는 구조이기도 합니다. 스페셜리스트가 되려면 더 많은 노력이 필요하겠지만, 여러 분야를 함께 읽는 시야는 캠코 같은 유일한 기관에서만 길러진다고 봅니다. 개인적으로 저는 새 분야에 발 들이는 걸 즐기는 편이라, 이 점이 오히려 끌렸습니다.", "priority": "high"},
    {"id": "qk3", "cat": "c14", "q": "캠코의 개선점은?", "kw": "산업 전문성/석박사 인력·사내 연수", "answers": [], "tail": "", "fullAnswer": "개선이 필요한 부분은 산업에 대한 전문성이라고 생각합니다. 생산적 금융으로 역할이 넓어지고 부실징후기업의 경영정상화를 지원하면서, 다뤄야 할 산업이 예전보다 훨씬 고도화되고 다양해졌습니다. 부실을 제대로 평가하고 정상화 방향을 잡으려면 그 산업을 읽을 수 있어야 하는데, 이 부분은 석/박사인력 사내 연수든 더 두텁게 갖춰갈 여지가 있다고 봅니다.", "priority": "high"},
    {"id": "qk4", "cat": "c14", "q": "캠코 리스크 관리 / 재원확충", "kw": "부채비율 200%/자체 수익 기반/국유재산 고도화", "answers": [], "tail": "", "fullAnswer": "캠코는 설립 목적 자체가 부실자산 정리와 기업·가계의 재기 지원이라, 부실을 떠안는 과정에서 부채가 느는 건 어느 정도 구조적입니다. 실제로 새출발기금 수요가 몰리면서 부채비율이 200%를 크게 웃도는데, 정부 출자만 기다리기보다 공공성을 지키면서 자체 수익 기반을 함께 키워 재원을 채우는 게 리스크 관리의 핵심이라고 봅니다. 특히 국유재산을 단순 매각에서 위탁개발이나 장기대부로 고도화하면, 재정수입을 늘리면서 부채 부담도 덜 수 있는 영역이라고 생각합니다.", "priority": "high"},
    {"id": "qk5", "cat": "c14", "q": "캠코의 자금조달 방법은?", "kw": "정부 출자/캠코채/조달 의존도 낮추기", "answers": [], "tail": "", "fullAnswer": "캠코의 주된 자금조달은 정부 출자와 캠코채 발행입니다. 다만 최근 새출발기금 등 채권 매입 수요가 커지면서 캠코채 발행이 매년 늘었고, 그만큼 차입금과 부채비율도 함께 올랐습니다. 금리가 높고 채권시장 여건이 좋지 않을 때는 조달비용 부담이 커지고, 계획보다 많이 발행해야 하는 상황도 생깁니다. 그래서 발행에만 기대기보다, 앞서 말씀드린 국유재산 개발 같은 자체 수익원을 키워 조달 의존도를 낮추는 방향이 필요하다고 봅니다.", "priority": "high"},
    {"id": "qk6", "cat": "c14", "q": "캠코의 가장 큰 고민은?", "kw": "도덕적 해이/형평성/대부업 장기연체채권", "answers": [], "tail": "(꼬리) 그럼 어떻게 해결할 것인가?", "fullAnswer": "가장 큰 고민은 채무조정 제도의 도덕적 해이와 형평성 문제라고 생각합니다. 새출발기금이나 새도약기금처럼 빚을 덜어주는 제도는 재기를 돕는 취지지만, 갚을 능력이 있는데도 감면받는 사례가 나오면 성실히 갚아온 사람이 박탈감을 느끼게 됩니다. 또 하나는 대부업체가 보유한 장기연체 채권 문제입니다. 이 채권까지 정리하려면 대부업체의 참여가 필요한데, 자칫 대부업을 도와주는 모양새가 될 수 있어 균형을 잡기가 까다롭습니다.\n\n[꼬리질문 대비 — 어떻게?]\n성실상환자에 대한 인센티브를 넓혀 '갚으면 손해'라는 인식을 줄이고, 변제능력 심사를 정교하게 해 정말 필요한 사람에게 감면이 가도록 해야 한다고 봅니다. 대부업체에 대해서도 보유 채권을 프로그램에 넘기도록 참여 인센티브를 설계하되, 부실을 키운 곳이 이득을 보지 않도록 기준을 함께 두는 게 맞다고 생각합니다.", "priority": "high"},
    {"id": "qk7", "cat": "c14", "q": "캠코와 타 기관의 차이는?", "kw": "가계·기업·공공 한 기관/유일한 곳/범위", "answers": [], "tail": "", "fullAnswer": "가장 큰 차이는 다루는 범위라고 생각합니다. 제가 인턴으로 겪어본 기관들을 떠올리면, 산업은행은 펀드·직접대출 중심의 기업금융, 신용보증기금은 개인사업자·중소기업 보증 중심의 간접금융, 부동산원은 공공사업 위탁이 핵심이었습니다. 그런데 캠코는 가계·기업·공공을 한 기관에서 모두 다루는, 제가 아는 한 유일한 곳입니다. 성격이 다른 분야가 한곳에 모여 있다는 점이 저에겐 가장 매력적이었고, 쉽지는 않겠지만 각 분야를 익혀 고루 전문성을 갖춘 사람이 되고 싶습니다.", "priority": "high"},
    {"id": "qk8", "cat": "c14", "q": "캠코 미션 / 비전 / 핵심가치", "kw": "건전성·재기·가치제고/온경제 리딩플랫폼/책임·상생·혁신·신뢰", "answers": [], "tail": "", "fullAnswer": "캠코의 미션은 금융회사의 건전성, 경제주체의 재기, 공공자산의 가치 제고를 통해 금융산업과 국가경제 발전에 이바지하는 것입니다. 비전은 '국민에 안정을, 기업에 활력을, 국가자산에 가치를 더하는 온(溫)경제 리딩플랫폼'이고, 핵심가치는 책임·상생·혁신·신뢰로 기억하고 있습니다.", "priority": "high"},
    {"id": "qk9", "cat": "c14", "q": "입사 후 최종 목표 / 비전", "kw": "함께 일하고 싶은 사람/안과 밖 모두 신뢰", "answers": [], "tail": "", "fullAnswer": "입사 후 목표는 두 가지입니다. 조직 안에서는 함께 일하고 싶은 사람이 되는 것입니다. 여러 곳에서 인턴을 하며 공통으로 느낀 건, 높은 자리에 계신 분일수록 업무 능력만이 아니라 함께 일하고 싶게 만드는 태도를 갖췄다는 점이었습니다. 그래서 주변을 잘 챙기고 소외되는 사람 없이, 선배·후배 모두와 잘 지내는 사람이 되고 싶습니다.\n조직 밖에서는, 기재부나 타 기관, 운용사에서 담당이 저라는 걸 알았을 때 '일이 수월해지겠다'고 느끼게 하는 사람이 되고 싶습니다. 안과 밖 모두에서 관계로도, 일로도 믿을 수 있는 구성원으로 자라는 게 가장 큰 목표입니다.", "priority": "high"},
    {"id": "qk10", "cat": "c14", "q": "입사 후 1년 / 3년 / 5년 계획", "kw": "기본기(연수 10등)/믿고 맡길 실무자/나누는 선배", "answers": [], "tail": "", "fullAnswer": "첫해에는 기본기에 집중하고 싶습니다. 연수원에서 10등 안에 들 만큼 기초를 단단히 다지고, 현장에 나가서는 가계 지원이나 국유재산 관리 같은 일을 직접 응대·관리하며 캠코 업무의 감을 잡고 싶습니다. 서툰 부분은 많겠지만 배우려는 의지만큼은 분명히 느껴지는 신입이 되고 싶습니다. 3년 차에는 조직에 실질적으로 도움이 되는 실무자가 되어, 동료가 연차나 출장으로 자리를 비워도 마음 놓고 맡길 수 있는 사람이고 싶습니다. 5년 차에는 그동안 쌓은 경험을 후배에게 자연스럽게 나누고, 부서를 옮긴 뒤에도 다시 함께 일하고 싶다고 떠올려지는 선배가 되는 것이 목표입니다.", "priority": "high"},
    {"id": "qk11", "cat": "c14", "q": "근무하면서 어려워 보이는 것은?", "kw": "법·규정 공부/토지보상법 곁에/선배께 질문", "answers": [], "tail": "", "fullAnswer": "가장 어려울 것 같은 부분은 법과 규정 공부입니다. 가계·기업·공공을 다 다루는 만큼 적용되는 법이 다양하고, 현장에서는 연수원에서 배우지 않은 예외 사례도 많아 판단부터 쉽지 않을 거라고 봅니다. 부동산원에서 일할 때 직원분들이 토지보상법을 늘 곁에 두고 일하시는 걸 봤고, 한 멘토님은 업무를 설명할 때 근거 조항을 같이 캡처해 보내주셔서 이해도 잘 되고 근거도 분명했습니다. 저도 법과 규정을 곁에 끼고 공정하게 판단하되, 모르는 건 경험 많은 선배님들께 계속 여쭤가며 익히겠습니다.", "priority": "high"},
    {"id": "qk12", "cat": "c14", "q": "캠코에 오기 위해 준비한 것 / 한 노력은?", "kw": "부동산원(국유재산)/국책은행(펀드 LP)/보증기관(부실 징후)", "answers": [], "tail": "", "fullAnswer": "제가 걸어온 인턴 경험이 그대로 캠코의 업무와 이어진다고 생각합니다. 부동산원에서는 토지보상 업무를 하며 등기·토지대장을 다뤘는데, 소유주가 캠코로 적힌 재산을 정말 많이 봤습니다. 이 경험은 국유재산 관리와 직결됩니다. 국책은행에서는 펀드 출자 업무를 보조하며, 보안상 제약은 있었지만 LP로서의 역할과 운용사 선정·사후관리를 이해할 수 있었고, 이는 캠코의 기업지원·펀드 업무와 닿아 있습니다. 보증기관에서는 고객과 상환 금액을 조율하고, 겉으로는 멀쩡해 보이던 거래의 부실 징후를 잡아낸 적도 있습니다. 의도한 건 아니었지만, 돌아보니 제가 해온 일들이 모두 캠코를 가리키고 있었습니다.", "priority": "high"},
    {"id": "qk13", "cat": "c14", "q": "입사 후 하고 싶은 직무 / 부서는?", "kw": "지역본부·지사 현장/가계·국유재산/기본기", "answers": [], "tail": "", "fullAnswer": "처음에는 지역본부나 지사 현장에서 시작하고 싶습니다. 가계 지원이나 국유재산 관리 업무를 직접 응대하고 다뤄보며 기본기를 쌓고 싶습니다. 현장에서 사람과 자산을 직접 마주하며 느낀 것들이, 앞으로 어떤 업무를 하든 판단의 출발점이 될 거라고 봅니다. 세 번의 인턴을 거치며 한 기관의 일이 결국 유기적으로 이어져 있다는 걸 느꼈기 때문에, 어디에 배치되더라도 거기서 역량을 쌓고 인정받겠습니다. 그렇게 하면 나중에 원하는 일을 맡을 기회도, 더 잘할 힘도 자연스럽게 따라온다고 생각합니다.", "priority": "high"},
    {"id": "qk14", "cat": "c14", "q": "캠코 ESG 대응 현황은?", "kw": "사회(S) 강점/환경(E) 약점/선박펀드 친환경선", "answers": [], "tail": "", "fullAnswer": "ESG 중 사회(S) 측면은 캠코가 특히 강하다고 봅니다. 취약계층의 채무를 조정하고 재기를 돕는 일 자체가 사회적 가치와 직결되기 때문입니다. 반면 환경(E)은 사업 특성상 상대적으로 약한 편입니다. 이를 보완할 지점이 선박펀드라고 생각합니다. 캠코는 선박 신조 지원 펀드를 운용하는데, 앞으로 LNG선이나 암모니아 추진선처럼 친환경 선박 의무화가 본격화되면, 이런 선박 위주로 펀드를 확대하는 방식으로 환경 기여를 자연스럽게 키울 수 있다고 봅니다.", "priority": "high"},
    {"id": "qk15", "cat": "c14", "q": "마지막 한마디", "kw": "마지막 희망·최후의 보루/좋은 사람으로 일하고 싶은 곳", "answers": [], "tail": "", "fullAnswer": "시중은행은 스스로 최고라고 말하고, 정책금융기관은 저마다의 사명을 이야기합니다. 다만 캠코는 국민과 기업에 '마지막 희망이자 최후의 보루'라는 점을 내세웁니다.\n정년까지 수십 년을 일해야 한다면, 그 시간 동안 스스로 좋은 사람이라고 자부할 수 있는 곳에서 일하고 싶습니다. 저는 그곳이 캠코라고 생각합니다. 선배님, 면접위원님들 아래에서 성장하며 반드시 보답하는 신입이 되겠습니다.", "priority": "high"},
    {"id": "qk16", "cat": "c14", "q": "캠코와 잘 어울린다고 생각하는 이유는?", "kw": "39개 부서/끊임없이 배움/빠른 습득·낯선 분야", "answers": [], "tail": "", "fullAnswer": "캠코가 다루는 업무가 워낙 넓어 본사에만 39개 부서가 있을 정도이고, 정년까지 끊임없이 새로 배워야 하는 조직이라고 생각합니다. 인턴 때, 차장·팀장처럼 높은 자리에 계신 분들도 인사이동 때 후배에게 꼼꼼히 인수인계하며 새 업무를 다시 배우시는 모습을 봤습니다. 끊임없이 배우는 그 태도가 인상 깊었는데, 캠코야말로 그런 자세가 필요한 조직이라고 봅니다. 저는 업무를 빠르게 습득한다는 피드백을 들어왔고, 일 밖에서도 카메라·AI·탁구처럼 낯선 분야에 발을 들이는 걸 즐겨왔습니다. 그래서 캠코에서 마주칠 어려움도 분명 있겠지만, 잘 해낼 자신이 있습니다.", "priority": "high"},
    {"id": "qk17", "cat": "c14", "q": "캠코에서 만들어갈 가치 / 바꿔보고 싶은 것은?", "kw": "AI 활용 능력/바이브코딩/조직 전체 끌어올리기", "answers": [], "tail": "", "fullAnswer": "제가 캠코에서 먼저 고민하고 싶은 건 AI 활용 능력입니다. AI는 누구에게나 평등한 도구지만, 결과물은 결코 평등하지 않습니다. 실제로 한 미국 기업은 직원이 쓴 AI 토큰 양을 인사평가에 반영했다는 사례도 있었고, OpenAI가 나온 지 얼마 되지 않았는데도 벌써 여러 공공기관이 AI를 정식 업무 툴로 들이고 있습니다. 이 흐름은 더 빨라질 거라고 봅니다. 저는 개발자가 아니지만 깃허브나 지피터스 같은 커뮤니티를 따라가며 바이브코딩을 익혀왔습니다. 그래서 제가 먼저 부딪쳐보고 익숙하지 않은 동료에게 풀어 설명해서, 저 한 사람이 아니라 조직 전체의 AI 활용 수준을 끌어올리는 데 기여하고 싶습니다.", "priority": "high"},
    {"id": "qk18", "cat": "c14", "q": "선배에게 배우고 싶은 것은?", "kw": "인간관계 노하우/오래 함께 일하는 법", "answers": [], "tail": "", "fullAnswer": "업무 노하우도 당연히 배우고 싶지만, 그보다 인간관계의 노하우를 배우고 싶습니다. 저는 인복이 좋은 편이라 짧은 인턴 기간엔 큰 어려움을 겪지 않았는데, 한 조직에서 수십 년을 일하다 보면 결국 관계가 가장 중요해진다고 생각합니다. 동료와 선배를 어떻게 챙기고, 관계를 어떻게 쌓아가며 오래 함께 일하는지를 가까이서 배우고 싶습니다. 그렇게 저도 '함께 일하고 싶은 사람'이 되는 게 목표입니다.", "priority": "high"},
    {"id": "qk19", "cat": "c14", "q": "캠코 첫인상 / 어떻게 알게 되었는가?", "kw": "부동산원 소유주 캠코/점잖은 직원/한 사람이 곧 기관 이미지", "answers": [], "tail": "", "fullAnswer": "솔직히 처음엔 캠코를 잘 몰랐습니다. 처음 알게 된 건 부동산원에서 토지보상 업무를 할 때였는데, 한 사업의 소유주가 캠코로 적힌 경우가 정말 많아서 '어떤 기관이길래 이렇게 많지?' 하는 궁금증이 들었습니다. 담당자를 찾는 전화도 자주 왔는데, 담당자가 자리에 없으면 제가 당겨 받아 메모를 남겨드리곤 했습니다. 그 과정에서 통화한 캠코 직원분들이 한결같이 점잖으셔서 좋은 인상을 받았습니다. 그때 느낀 게, 구성원 한 사람이 곧 그 기관의 이미지를 만든다는 점이었습니다. 저도 그런 사람이 되어야겠다고 생각했습니다.", "priority": "high"},
